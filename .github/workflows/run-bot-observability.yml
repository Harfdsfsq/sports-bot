name: Run bot • observability

on:
  workflow_dispatch:
    inputs:
      recent_runs:
        description: How many recent run archives to include in the learning bundle
        required: false
        default: "20"
        type: string

permissions:
  contents: write

env:
  TZ: Europe/Moscow
  APP_TIMEZONE: Europe/Moscow

jobs:
  run-bot-observability:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Prepare folders
        run: mkdir -p .data .data/exports .logs artifacts

      - name: Run bot once
        run: python -m app.cli run-once

      - name: Build learning bundle
        if: always()
        run: |
          python scripts/build_learning_bundle.py --recent-runs "${{ inputs.recent_runs || '20' }}" --output artifacts/learning-bundle.zip
          python scripts/summarize_latest_run.py > artifacts/latest-run-summary.json

      - name: Upload observability artifacts
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: bot-observability-${{ github.run_id }}
          path: |
            artifacts/learning-bundle.zip
            artifacts/latest-run-summary.json
            .logs/debug-last-run.json
            .logs/runs
            .data/state.json
            .data/exports
          if-no-files-found: ignore
          retention-days: 14

      - name: Commit updated state
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A -f .data .logs
          git diff --cached --quiet && exit 0
          git commit -m "Update bot observability state"
          git push
