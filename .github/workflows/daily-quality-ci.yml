name: daily-quality-ci

on:
  pull_request:
  push:
    branches: [fix/coverage-integrity-a-only]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt ruff
      - name: Verify native pipeline in isolated environment
        run: python scripts/verify_daily_pipeline.py
      - name: Lint new validation and verification code
        run: ruff check app/services/prospective_validation.py scripts/verify_daily_pipeline.py tests/test_prospective_validation.py tests/test_release_and_quotes.py tests/test_ci_repairs.py tests/conftest.py tests/test_bulk_coverage.py app/services/sstats_standings.py
