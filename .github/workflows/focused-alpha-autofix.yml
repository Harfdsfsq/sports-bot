name: focused-alpha-autofix

# Temporary branch-only formatter. Removed after it commits the normalized change set.
on:
  push:
    branches:
      - feature/focused-alpha-system
    paths:
      - ".github/workflows/focused-alpha-autofix.yml"
      - "app/cli.py"
      - "app/services/focused_alpha*.py"
      - "app/services/daily_coverage_plan.py"
      - "app/services/daily_coverage_assignments.py"
      - "app/services/daily_coverage_full_inventory_provider_patch.py"
      - "scripts/build_focused_alpha_decisions.py"
      - "scripts/patch_focused_alpha_candidate_rank.py"
      - "scripts/publish_controlled_fallback_guarded.py"
      - "tests/test_focused_alpha*.py"

permissions:
  contents: write

jobs:
  autofix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/focused-alpha-system
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install ruff
      - name: Normalize module docstrings and Ruff-fix change set
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          paths = [
              Path("app/services/focused_alpha.py"),
              Path("app/services/focused_alpha_assignments.py"),
              Path("app/services/focused_alpha_history.py"),
              Path("app/services/focused_alpha_learning_ledger.py"),
              Path("app/services/focused_alpha_runtime_policy.py"),
              Path("scripts/build_focused_alpha_decisions.py"),
              Path("scripts/patch_focused_alpha_candidate_rank.py"),
          ]
          prefix = "from __future__ import annotations\n\n"
          for path in paths:
              text = path.read_text(encoding="utf-8")
              if not text.startswith(prefix):
                  continue
              rest = text[len(prefix):]
              if not rest.startswith('"""'):
                  continue
              end = rest.find('"""', 3)
              if end < 0:
                  raise RuntimeError(f"unterminated module docstring: {path}")
              end += 3
              docstring = rest[:end]
              tail = rest[end:].lstrip("\n")
              path.write_text(
                  docstring + "\n\n" + prefix + tail,
                  encoding="utf-8",
              )
          PY
          ruff check --config pyproject.toml --fix --unsafe-fixes \
            app/cli.py \
            app/services/focused_alpha.py \
            app/services/focused_alpha_assignments.py \
            app/services/focused_alpha_history.py \
            app/services/focused_alpha_learning_ledger.py \
            app/services/focused_alpha_runtime_policy.py \
            app/services/daily_coverage_plan.py \
            app/services/daily_coverage_assignments.py \
            app/services/daily_coverage_full_inventory_provider_patch.py \
            scripts/build_focused_alpha_decisions.py \
            scripts/patch_focused_alpha_candidate_rank.py \
            scripts/publish_controlled_fallback_guarded.py \
            tests/test_focused_alpha*.py
      - name: Commit fixes
        run: |
          if git diff --quiet; then
            echo "No formatting changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/cli.py app/services scripts tests
          git commit -m "Normalize Focused Alpha change set"
          git push origin HEAD:feature/focused-alpha-system
