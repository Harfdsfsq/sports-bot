name: ci

on:
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  lint-type-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff mypy
      - name: Ruff lint
        run: ruff check app scripts --config pyproject.toml
      - name: Mypy type smoke
        run: mypy app scripts --config-file pyproject.toml
      - name: Import smoke
        run: |
          python -m compileall app scripts
          python -m app.cli || true
