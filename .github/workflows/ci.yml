name: ci

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-type-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff mypy
      - name: Ruff lint changed Python files
        shell: bash
        run: |
          mapfile -t files < <(git diff --name-only "origin/${{ github.base_ref }}...HEAD" -- app scripts | grep -E '\\.py$' || true)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No changed Python files to lint"
          else
            printf 'Linting %s changed Python files\\n' "${#files[@]}"
            ruff check "${files[@]}" --config pyproject.toml
          fi
      - name: Mypy type smoke changed Python files
        shell: bash
        run: |
          mapfile -t files < <(git diff --name-only "origin/${{ github.base_ref }}...HEAD" -- app scripts | grep -E '\\.py$' || true)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No changed Python files to type-check"
          else
            mypy "${files[@]}" --config-file pyproject.toml
          fi
      - name: Import smoke
        run: |
          python -m compileall app scripts
          python - <<'PY'
          import app.cli
          import app.main
          print("import smoke ok")
          PY
      - name: Run full test suite
        run: python -m pytest -q
      - name: Dependency audit
        run: |
          pip install pip-audit
          pip-audit
