name: Run bot • phase12 fixed run

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  TZ: Europe/Moscow
  APP_TIMEZONE: Europe/Moscow

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Load Phase12 env
        run: bash scripts/load_env_safe.sh config/phase12_fixed_run.env.example
      - name: Prepare folders
        run: mkdir -p .data .data/exports .logs artifacts
      - name: Run bot once
        run: python -m app.cli run-once
      - name: Canonicalize latest picks
        run: python scripts/canonicalize_latest_picks.py
      - name: Build publish gate report
        run: python scripts/publish_gate_report.py
      - name: Build bundle
        run: python scripts/build_phase12_bundle.py
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: phase12-fixed-run
          path: |
            artifacts/phase12-bundle.zip
            artifacts/phase12-bundle-summary.json
            artifacts/latest-candidate-integrity.json
            artifacts/latest-canonical-picks.json
            artifacts/publish-gate-report.json
