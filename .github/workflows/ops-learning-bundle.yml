name: Ops • Learning bundle

on:
  workflow_dispatch:
    inputs:
      recent_runs:
        description: How many recent run archives to include
        required: false
        default: "20"
        type: string

permissions:
  contents: read

jobs:
  build-learning-bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Build learning bundle
        run: |
          python scripts/build_learning_bundle.py --recent-runs "${{ inputs.recent_runs }}" --output artifacts/learning-bundle.zip

      - name: Summarize latest run
        run: |
          python scripts/summarize_latest_run.py > artifacts/latest-run-summary.json

      - name: Upload learning bundle
        uses: actions/upload-artifact@v5
        with:
          name: learning-bundle-${{ github.run_id }}
          path: |
            artifacts/learning-bundle.zip
            artifacts/latest-run-summary.json
          if-no-files-found: error
          retention-days: 14
