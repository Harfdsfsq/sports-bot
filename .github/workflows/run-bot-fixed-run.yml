name: Run bot • fixed run

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  TZ: Europe/Moscow
  APP_TIMEZONE: Europe/Moscow

jobs:
  fixed-run:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Load fixed-run profile
        run: |
          grep -E '^[A-Za-z_][A-Za-z0-9_]*=' config/single_fixed_run.env >> "$GITHUB_ENV"

      - name: Prepare folders
        run: |
          mkdir -p .data .logs artifacts/fixed-run

      - name: Run bot once
        run: python -m app.cli run-once

      - name: Canonicalize latest picks
        if: always()
        run: python scripts/canonicalize_latest_picks.py

      - name: Audit odds integrity
        if: always()
        run: python scripts/audit_odds_integrity.py

      - name: Build fixed run bundle
        if: always()
        run: python scripts/build_fixed_run_bundle.py

      - name: Upload fixed run artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fixed-run-current
          path: |
            artifacts/fixed-run-bundle.zip
            artifacts/fixed-run
          if-no-files-found: warn
          retention-days: 7
