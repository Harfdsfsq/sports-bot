name: run-bot-fast

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Run mode: fast or full"
        required: true
        default: "fast"
      provider_smoke:
        description: "Run provider smoke before production run"
        required: true
        default: "false"
      run_tests:
        description: "Run unit tests before production run"
        required: true
        default: "false"
      persist_state:
        description: "Commit only small lifecycle state files after run"
        required: true
        default: "true"

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  PYTHONUNBUFFERED: "1"
  PYTHONPATH: ${{ github.workspace }}
  TZ: Europe/Moscow
  APP_TIMEZONE: Europe/Moscow
  APP_ENV: production
  RUN_MODE: "normal"
  FAST_WORKFLOW_MODE: ${{ github.event.inputs.mode || 'fast' }}
  HARIZON_FAST_RUN: ${{ github.event.inputs.mode != 'full' }}
  PUBLISH_DRY_RUN: "false"
  PREDICTION_PUBLICATION_ENABLED: "true"
  RUN_REPORT_ENABLED: "false"
  ENHANCED_RUN_REPORT_SEND_TELEGRAM: "true"
  TELEGRAM_MESSAGE_SOFT_LIMIT: "3600"
  MANUAL_CONTROLLED_PUBLISH_ENABLED: "true"
  PUBLISH_WINDOW_HOURS: "24"
  RUN_DAYS_AHEAD: "2"
  MIN_KICKOFF_LEAD_MINUTES: "20"

  FAST_RUN_PROFILE: "balanced-depth-v5-stable-testing"
  FAST_RUN_INVENTORY_LIMIT: "300"
  FAST_RUN_WINDOW_HOURS: "24"
  FAST_RUN_ODDS_MATCH_TARGET: "260"
  FAST_RUN_ODDS_API_IO_REQUESTS: "160"
  FAST_RUN_KEEP_WINDOW_HOURS: "30"
  FAST_RUN_TRIM_DAY_INVENTORY: "true"
  FAST_RUN_AUTO_DISABLE_SPORTLOGIC: "true"

  DAY_INVENTORY_PRESERVE_CACHED_EVIDENCE: "true"
  CORE_PROVIDER_INVENTORY_BRIDGE_ENABLED: "true"
  DAY_INVENTORY_TARGET_SIZE: "300"
  DAY_INVENTORY_MAX_MATCHES: "300"
  DAY_INVENTORY_FORCE_TOP_300: "true"
  DAY_INVENTORY_FORCE_FULL_300: "true"
  DAY_INVENTORY_FORCE_PROVIDER_MERGE: "true"
  DAY_INVENTORY_CONTEXT_BACKFILL_ENABLED: "true"
  DAY_INVENTORY_ENABLE_BZZOIRO: "true"
  DAY_INVENTORY_ENABLE_SSTATS: "true"
  DAY_INVENTORY_ENABLE_SPORTLOGIC: "false"
  DAY_INVENTORY_ENABLE_ALLSPORTSAPI: "false"
  DAY_INVENTORY_TOP_MATCHES_ENABLED: "true"
  DAY_INVENTORY_ODDS_API_IO_TARGET_MATCHES: "260"
  DAY_INVENTORY_MULTI_SOURCE_MAX_MATCHES: "260"
  DAY_INVENTORY_SSTATS_TOTAL_HARD_CAP: "220"
  DAY_INVENTORY_BZZOIRO_MAX_REQUESTS: "160"
  DAY_INVENTORY_BZZOIRO_MAX_PAGES: "16"
  DAY_INVENTORY_SSTATS_MAX_REQUESTS: "100"
  DAY_INVENTORY_SPORTLOGIC_MATCH_LIMIT: "0"
  DAY_INVENTORY_SPORTLOGIC_MAX_REQUESTS: "0"

  MARKET_FAMILY_PUBLICATION_GUARD_ENABLED: "true"
  PUBLICATION_ALLOWED_MARKET_FAMILIES: "totals,spreads"
  HARIZON_ALLOWED_PUBLICATION_FAMILIES: "totals,spreads"
  CONTROLLED_FALLBACK_ALLOWED_FAMILIES: "totals,spreads"
  CONTROLLED_RESCUE_ALLOWED_FAMILIES: "totals,spreads"
  H2H_PUBLICATION_ENABLED: "false"
  BTTS_PUBLICATION_ENABLED: "false"
  DNB_PUBLICATION_ENABLED: "false"
  DOUBLE_CHANCE_PUBLICATION_ENABLED: "false"
  TEAM_TOTALS_PUBLICATION_ENABLED: "false"
  TOTALS_PUBLICATION_ENABLED: "true"
  SPREADS_PUBLICATION_ENABLED: "true"
  PUBLISH_MIN_ODDS_SOURCES: "1"
  PUBLISH_MIN_CONTEXT_SOURCES: "2"
  MIN_CONTEXT_SOURCES_PUBLISH: "2"
  PUBLISH_TIER_A_MIN_ODDS_SOURCES: "2"
  PUBLISH_TIER_A_MIN_BOOKS: "2"
  PUBLISH_TIER_A_MIN_CONTEXT_SOURCES: "2"
  PUBLISH_TIER_B_MIN_ODDS_SOURCES: "1"
  PUBLISH_TIER_B_MIN_BOOKS: "2"
  PUBLISH_TIER_B_MIN_CONTEXT_SOURCES: "1"
  CONTROLLED_FALLBACK_MIN_ODDS_SOURCES: "1"
  CONTROLLED_FALLBACK_MIN_CONTEXT_SOURCES: "1"
  CONTROLLED_FALLBACK_REQUIRE_2_ODDS_SOURCES_FOR_TELEGRAM: "false"
  CONTROLLED_FALLBACK_REQUIRE_2_CONTEXT_SOURCES_FOR_TELEGRAM: "false"
  CONTROLLED_FALLBACK_TELEGRAM_ALLOW_TIER_B: "true"
  CONTROLLED_FALLBACK_TELEGRAM_ALLOW_TIER_C: "false"
  CONTROLLED_FALLBACK_TIER_B_REQUIRE_2_BOOKS_FOR_TELEGRAM: "true"
  CONTROLLED_FALLBACK_TIER_B_REQUIRE_INDEPENDENT_SOURCES: "false"
  CONTROLLED_FALLBACK_TIER_B_MIN_CONTEXT_SOURCES: "1"
  CONTROLLED_FALLBACK_TIER_B_MIN_CONFIRMATION_SOURCES: "1"
  CONTROLLED_FALLBACK_TIER_B_WEIGHTED_SINGLE_LINE_ENABLED: "true"
  CONTROLLED_FALLBACK_TIER_B_WEIGHTED_MIN_CONTEXT_SOURCES: "1"
  CONTROLLED_FALLBACK_TIER_B_WEIGHTED_MIN_CONFIDENCE: "76"
  CONTROLLED_FALLBACK_TIER_B_WEIGHTED_MIN_QUALITY: "78"
  CONTROLLED_FALLBACK_TIER_B_WEIGHTED_MIN_EDGE_PP: "4.0"
  CONTROLLED_FALLBACK_TIER_B_WEIGHTED_MIN_EV_PCT: "7.0"
  CONTROLLED_FALLBACK_TIER_B_WEIGHTED_REQUIRE_XG_HARD_CONFIRMATION: "false"
  CONTROLLED_FALLBACK_ALLOW_MARKET_IMPLIED_XG_FOR_B_TIER: "true"
  CONTROLLED_FALLBACK_BLOCK_PROXY_DEFAULT_XG_ALL_TIERS: "true"
  CONTROLLED_FALLBACK_B_TIER_REQUIRE_HARD_CONTEXT: "false"
  CONTROLLED_FALLBACK_B_TIER_BLOCK_LOW_QUALITY_COMPETITIONS: "true"
  BZZOIRO_CURRENT_ODDS_AS_SECONDARY_SOURCE: "true"
  SSTATS_ROLLING_METRICS_ENABLED: "true"
  SSTATS_HISTORICAL_ODDS_AS_LINES: "false"

  PROVIDER_FREE_QUOTA_POLICY_ENABLED: "true"
  PROVIDER_QUOTA_GOVERNOR_ENABLED: "true"
  PROVIDER_QUOTA_RUNS_PER_DAY: "12"
  PROVIDER_QUOTA_SAFETY_FACTOR: "0.78"
  PROVIDER_REQUEST_BUDGET_MODE: "per_run_with_daily_guards"
  PROVIDER_REQUEST_BUDGET_DISABLE_DAILY_MONTHLY: "false"
  ALL_SOURCES_FREE_MAXIMIZE: "true"
  PROVIDER_SMOKE_FAIL_ON_ERROR: "false"
  API_HEALTH_DURING_RUN_ENABLED: "false"

  ODDS_API_IO_HOURLY_LIMIT: "100"
  ODDS_API_IO_ACCOUNT_QUOTA_ENABLED: "true"
  ODDS_API_IO_ACCOUNT_HOURLY_LIMIT: "100"
  ODDS_API_IO_ACCOUNT_DAILY_LIMIT: "500"
  ODDS_API_IO_BOOKMAKERS_ACCOUNT1: "Bet365,Unibet"
  ODDS_API_IO_BOOKMAKERS_ACCOUNT2: "Betfair Exchange,Sbobet"
  ODDS_API_IO_PER_RUN_MAX: "100"
  ODDS_API_IO_ACCOUNT1_PER_RUN_MAX: "50"
  ODDS_API_IO_ACCOUNT2_PER_RUN_MAX: "50"
  ODDS_API_IO_MAX_HTTP_REQUESTS_PER_RUN: "100"
  ODDS_API_IO_MAX_REQUESTS_PER_RUN: "100"
  ODDS_API_IO_REQUEST_BUDGET_GRANTED: "100"
  ODDS_API_IO_REQUESTS_MAX_PER_RUN: "100"
  PRICE_BACKFILL_ODDS_API_IO_BATCHES_PER_ACCOUNT: "24"
  PRICE_BACKFILL_ODDS_API_IO_MAX_EVENT_IDS_PER_REQUEST: "10"
  PRICE_BACKFILL_ODDS_API_IO_EVENT_LIMIT: "220"
  MAX_MATCHES_FOR_ODDS_FETCH: "260"

  BZZOIRO_RATE_LIMIT_PER_MINUTE: "200"
  BZZOIRO_MAX_REQUESTS_PER_RUN: "160"
  BZZOIRO_REQUEST_BUDGET_GRANTED: "160"
  BZZOIRO_EVENTS_MAX_REQUESTS_PER_RUN: "90"
  BZZOIRO_PREDICTIONS_MAX_REQUESTS_PER_RUN: "32"
  BZZOIRO_PREDICTIONS_MAX_PAGES: "8"
  BZZOIRO_MAX_PAGES: "12"
  BZZOIRO_CONTEXT_MATCH_LIMIT: "260"
  BZZOIRO_PRICE_BACKFILL_ENABLED: "true"
  BZZOIRO_PRICE_BACKFILL_TARGET_LIMIT: "160"
  BZZOIRO_V2_ODDS_ENABLED: "true"
  BZZOIRO_V2_FETCH_EVENT_ODDS: "true"

  SSTATS_RATE_LIMIT_PER_MINUTE: "150"
  SSTATS_MAX_REQUESTS_PER_RUN: "100"
  SSTATS_REQUEST_BUDGET_GRANTED: "100"
  SSTATS_CONTEXT_MATCH_LIMIT: "260"
  SSTATS_DEEP_DETAIL_LIMIT_PER_RUN: "24"
  SSTATS_DEEP_CONTEXT_MATCH_LIMIT: "60"
  SSTATS_DEEP_ENRICHMENT_ENABLED: "true"
  SSTATS_GAME_DETAIL_ENABLED: "true"
  SSTATS_LAST_GAMES_STATS_ENABLED: "true"
  SSTATS_INJURIES_ENABLED: "false"
  SSTATS_GLICKO_ENABLED: "true"
  SSTATS_ODDS_RESCUE_ENABLED: "true"

  SPORTLOGIC_DAILY_LIMIT: "500"
  SPORTLOGIC_ENABLED: "false"
  ENABLE_SPORTLOGIC: "false"
  SPORTLOGIC_CONTROLLED_ODDS_ENABLED: "false"
  SPORTLOGIC_MAX_HTTP_REQUESTS_PER_RUN: "0"
  SPORTLOGIC_REQUEST_BUDGET_GRANTED: "0"
  SPORTLOGIC_MATCH_LIMIT: "0"
  SPORTLOGIC_CONTEXT_MATCH_LIMIT: "0"
  SPORTLOGIC_ODDS_MATCH_LIMIT: "0"
  SPORTLOGIC_PER_RUN_MAX: "0"
  SPORTLOGIC_REQUESTS_MAX_PER_RUN: "0"
  SPORTLOGIC_DISABLED_ZERO_ROWS_GUARD: "true"

  TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN || secrets.TELEGRAM_TOKEN }}
  TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN || secrets.TELEGRAM_BOT_TOKEN }}
  TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
  ODDS_API_IO_KEY: ${{ secrets.ODDS_API_IO_KEY }}
  ODDS_API_IO_KEY_2: ${{ secrets.ODDS_API_IO_KEY_2 }}
  ODDS_API_IO_KEY2: ${{ secrets.ODDS_API_IO_KEY2 || secrets.ODDS_API_IO_KEY_2 }}
  ODDS_API_IO_ACC2_KEY: ${{ secrets.ODDS_API_IO_KEY_2 || secrets.ODDS_API_IO_KEY2 }}
  ODDS_API_IO_SECONDARY_KEY: ${{ secrets.ODDS_API_IO_KEY_2 || secrets.ODDS_API_IO_KEY2 }}
  BZZOIRO_API_KEY: ${{ secrets.BZZOIRO_API_KEY }}
  SSTATS_API_KEY: ${{ secrets.SSTATS_API_KEY }}
  SPORTLOGIC_API_KEY: ${{ secrets.SPORTLOGIC_API_KEY }}
  SPORTLOGIC_KEY: ${{ secrets.SPORTLOGIC_API_KEY }}
  SPORTLOGIC_TOKEN: ${{ secrets.SPORTLOGIC_API_KEY }}
  FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
  THESPORTSDB_API_KEY: ${{ secrets.THESPORTSDB_API_KEY }}
  WEATHERAPI_KEY: ${{ secrets.WEATHERAPI_KEY }}
  WEATHER_API_KEY: ${{ secrets.WEATHERAPI_KEY }}
  ALLSPORTSAPI_API_KEY: ${{ secrets.ALLSPORTSAPI_API_KEY }}
  API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
  ODDSPAPI_API_KEY: ${{ secrets.ODDSPAPI_API_KEY }}
  OPENWEATHERMAP_API_KEY: ${{ secrets.OPENWEATHERMAP_API_KEY }}
  NEWSAPI_KEY: ${{ secrets.NEWSAPI_KEY }}
  CURRENTS_API_KEY: ${{ secrets.CURRENTS_API_KEY }}
  GNEWS_KEY: ${{ secrets.GNEWS_KEY }}
  NEWSDATA_API_KEY: ${{ secrets.NEWSDATA_API_KEY }}
  GUARDIAN_API_KEY: ${{ secrets.GUARDIAN_API_KEY }}
  FUTRIXMETRICS_API_KEY: ${{ secrets.FUTRIXMETRICS_API_KEY }}
  HIGHLIGHTLY_API_KEY: ${{ secrets.HIGHLIGHTLY_API_KEY }}
  RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}

concurrency:
  group: run-bot-fast
  cancel-in-progress: false

jobs:
  run-bot-fast:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Setup Python with pip cache
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install --disable-pip-version-check -r requirements.txt

      - name: Prepare runtime directories and date
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .data/exports .data/cache .data/day_inventory .data/line_history artifacts/run-bot
          cache_date="$(TZ="${APP_TIMEZONE}" date +%F)"
          echo "DAY_INVENTORY_CACHE_DATE=${cache_date}" >> "$GITHUB_ENV"
          echo "DAY_INVENTORY_TARGET_DATE=${cache_date}" >> "$GITHUB_ENV"
          echo "PROVIDER_SMOKE_TARGET_DATE=${cache_date}" >> "$GITHUB_ENV"
          echo "PROVIDER_SMOKE_TARGET_DATE_FROZEN=true" >> "$GITHUB_ENV"

      - name: Restore fast runtime cache
        uses: actions/cache/restore@v4
        with:
          path: |
            .data/day_inventory
            .data/line_history
            .data/state.json
            .data/fallback-sent-index.json
            .data/published-candidate-index.json
            .data/candidate-lifecycle-state.json
          key: run-bot-fast-state-${{ env.DAY_INVENTORY_CACHE_DATE }}-${{ github.run_id }}
          restore-keys: |
            run-bot-fast-state-${{ env.DAY_INVENTORY_CACHE_DATE }}-
            run-bot-day-inventory-${{ env.DAY_INVENTORY_CACHE_DATE }}-
            provider-smoke-day-inventory-${{ env.DAY_INVENTORY_CACHE_DATE }}-

      - name: Apply fast run limits
        shell: bash
        run: |
          mkdir -p .data/exports
          python -u scripts/apply_fast_run_budget.py
          python -u scripts/trim_day_inventory_fast.py
          echo "RUN_MODE=${RUN_MODE} FAST_WORKFLOW_MODE=${FAST_WORKFLOW_MODE} HARIZON_FAST_RUN=${HARIZON_FAST_RUN}"

      - name: Apply publication and quota policy
        shell: bash
        run: |
          set -uo pipefail
          python -u scripts/apply_publication_family_policy.py || true
          timeout 35s python -u scripts/apply_per_run_api_quota_contract.py || true
          python -u scripts/apply_fast_run_budget.py || true
          python -u scripts/apply_publication_family_policy.py || true
          echo "fast-depth env: RUN_MODE=${RUN_MODE} ODDS_API_IO_MAX_REQUESTS_PER_RUN=${ODDS_API_IO_MAX_REQUESTS_PER_RUN} MAX_MATCHES_FOR_ODDS_FETCH=${MAX_MATCHES_FOR_ODDS_FETCH} BZZOIRO_MAX_REQUESTS_PER_RUN=${BZZOIRO_MAX_REQUESTS_PER_RUN} SPORTLOGIC_PER_RUN_MAX=${SPORTLOGIC_PER_RUN_MAX}"

      - name: Provider smoke
        if: ${{ github.event.inputs.provider_smoke == 'true' || github.event.inputs.mode == 'full' }}
        shell: bash
        run: |
          timeout 75s python -u workflow/provider_smoke.py || true
          cp .data/exports/latest-provider-smoke.json artifacts/run-bot/latest-provider-smoke.json 2>/dev/null || true
          cp .data/exports/latest-provider-smoke.md artifacts/run-bot/latest-provider-smoke.md 2>/dev/null || true

      - name: Run tests
        if: ${{ github.event.inputs.run_tests == 'true' || github.event.inputs.mode == 'full' }}
        shell: bash
        run: |
          timeout 60s python -m pytest -q tests/test_market_integrity.py || true

      - name: Run bot
        shell: bash
        run: |
          set -uo pipefail
          python -u scripts/apply_fast_run_budget.py || true
          if [[ -s .data/exports/latest-fast-run-env.sh ]]; then
            set -a
            source .data/exports/latest-fast-run-env.sh
            set +a
          fi
          export SPORTLOGIC_ENABLED=false ENABLE_SPORTLOGIC=false SPORTLOGIC_CONTROLLED_ODDS_ENABLED=false SPORTLOGIC_PER_RUN_MAX=0 SPORTLOGIC_MAX_HTTP_REQUESTS_PER_RUN=0 SPORTLOGIC_REQUEST_BUDGET_GRANTED=0 SPORTLOGIC_MATCH_LIMIT=0 SPORTLOGIC_ODDS_MATCH_LIMIT=0
          echo "effective fast depth: PUBLISH_WINDOW_HOURS=${PUBLISH_WINDOW_HOURS} MAX_MATCHES_FOR_ODDS_FETCH=${MAX_MATCHES_FOR_ODDS_FETCH} ODDS_API_IO_MAX_ODDS_REQUESTS_PER_RUN=${ODDS_API_IO_MAX_ODDS_REQUESTS_PER_RUN:-n/a} ODDS_API_IO_ACCOUNT2_ACTIVE=${ODDS_API_IO_ACCOUNT2_ACTIVE:-n/a} ODDS_API_IO_FAST_EVENT_ACCOUNT=${ODDS_API_IO_FAST_EVENT_ACCOUNT:-n/a} BZZOIRO_MAX_REQUESTS_PER_RUN=${BZZOIRO_MAX_REQUESTS_PER_RUN} SPORTLOGIC_PER_RUN_MAX=${SPORTLOGIC_PER_RUN_MAX}"
          echo "runtime start $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          python -u -m app.cli run-once 2>&1 | tee .data/exports/latest-run-bot.log
          status=${PIPESTATUS[0]}
          echo "runtime status ${status}"
          echo "runtime finish $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          cp -r .data/exports artifacts/run-bot/exports || true
          cp -r .data/day_inventory artifacts/run-bot/day_inventory || true
          cp -r .data/line_history artifacts/run-bot/line_history || true
          cp .logs/debug-last-run.json artifacts/run-bot/debug-last-run.json 2>/dev/null || true
          cp .data/exports/latest-run-bot.log artifacts/run-bot/latest-run-bot.log 2>/dev/null || true
          exit ${status}

      - name: Post-run guards, fallback and report
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          if [[ ! -s .data/exports/latest-run-bot.log ]]; then
            echo "skip post-run: fresh run-bot log missing"
            exit 0
          fi
          if [[ -s .data/exports/latest-fast-run-env.sh ]]; then
            set -a
            source .data/exports/latest-fast-run-env.sh
            set +a
          fi
          export PUBLISH_TIER_B_MIN_CONTEXT_SOURCES=1 CONTROLLED_FALLBACK_MIN_CONTEXT_SOURCES=1 CONTROLLED_FALLBACK_TIER_B_MIN_CONTEXT_SOURCES=1 CONTROLLED_FALLBACK_TIER_B_MIN_CONFIRMATION_SOURCES=1 CONTROLLED_FALLBACK_REQUIRE_2_CONTEXT_SOURCES_FOR_TELEGRAM=false
          export SPORTLOGIC_ENABLED=false ENABLE_SPORTLOGIC=false SPORTLOGIC_CONTROLLED_ODDS_ENABLED=false SPORTLOGIC_PER_RUN_MAX=0 SPORTLOGIC_MAX_HTTP_REQUESTS_PER_RUN=0 SPORTLOGIC_REQUEST_BUDGET_GRANTED=0 SPORTLOGIC_MATCH_LIMIT=0 SPORTLOGIC_ODDS_MATCH_LIMIT=0
          python -u scripts/update_day_inventory_priority_and_line_state.py || true
          python -u scripts/repair_inventory_refresh_plan_counts.py || true
          python -u scripts/bridge_runtime_context_coverage.py || true
          python -u scripts/day_inventory_cumulative_coverage.py || true
          python -u scripts/build_day_inventory_coverage_truth.py || true
          python -u scripts/replace_rescue_proxy_placeholder_xg.py || true
          python -u scripts/apply_publication_family_policy.py || true
          python -u scripts/publish_controlled_fallback.py || true
          python -u scripts/ensure_controlled_fallback_report.py || true
          python -u scripts/normalize_published_pick_payloads.py || true
          python -u scripts/send_harizon_telegram_run_report_v13.py || python -u scripts/send_harizon_telegram_run_report_v12.py || python -u scripts/send_harizon_telegram_run_report_v8.py || true
          python -u scripts/assert_fast_run_depth.py || true
          cp .data/exports/latest-fast-run-budget.json artifacts/run-bot/latest-fast-run-budget.json 2>/dev/null || true
          cp .data/exports/latest-fast-inventory-trim.json artifacts/run-bot/latest-fast-inventory-trim.json 2>/dev/null || true
          cp .data/exports/latest-fast-run-depth-check.json artifacts/run-bot/latest-fast-run-depth-check.json 2>/dev/null || true
          cp .data/exports/latest-controlled-fallback-report.json artifacts/run-bot/latest-controlled-fallback-report.json 2>/dev/null || true
          cp .data/exports/latest-day-inventory-coverage-truth.json artifacts/run-bot/latest-day-inventory-coverage-truth.json 2>/dev/null || true
          cp .data/exports/latest-day-inventory-refresh-plan.json artifacts/run-bot/latest-day-inventory-refresh-plan.json 2>/dev/null || true
          cp .data/exports/latest-harizon-telegram-run-report.json artifacts/run-bot/latest-harizon-telegram-run-report.json 2>/dev/null || true
          cp .data/exports/latest-harizon-telegram-run-report.txt artifacts/run-bot/latest-harizon-telegram-run-report.txt 2>/dev/null || true

      - name: Persist small lifecycle state
        if: ${{ always() && github.event.inputs.persist_state == 'true' }}
        shell: bash
        run: |
          set -uo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f .data/state.json .data/fallback-sent-index.json .data/published-candidate-index.json .data/candidate-lifecycle-state.json \
            .data/exports/latest-picks.json .data/exports/latest-bets.json .data/exports/latest-pending-bets.json .data/exports/latest-bankroll.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "no lifecycle state changes to commit"
          else
            git commit -m "Update small runtime state [skip ci]" || true
            git push || true
          fi

      - name: Save fast runtime cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            .data/day_inventory
            .data/line_history
            .data/state.json
            .data/fallback-sent-index.json
            .data/published-candidate-index.json
            .data/candidate-lifecycle-state.json
          key: run-bot-fast-state-${{ env.DAY_INVENTORY_CACHE_DATE }}-${{ github.run_id }}

      - name: Upload run artifact
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: run-bot-fast-${{ github.run_id }}
          path: |
            artifacts/run-bot/**
            .data/exports/**
            .data/day_inventory/**
            .data/line_history/**
            .data/published-candidate-index.json
            .data/fallback-sent-index.json
            .data/candidate-lifecycle-state.json
          if-no-files-found: ignore
          include-hidden-files: true
          compression-level: 1
          retention-days: 5
