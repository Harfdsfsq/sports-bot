name: run-bot-fast

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Compatibility input; production always uses rules workflow"
        required: false
        default: "fast"
      provider_smoke:
        description: "Deprecated compatibility input"
        required: false
        default: "false"
      run_tests:
        description: "Deprecated compatibility input"
        required: false
        default: "false"
      persist_state:
        description: "Deprecated compatibility input"
        required: false
        default: "true"

permissions:
  actions: write
  contents: read

concurrency:
  group: run-bot-fast-dispatch-main
  cancel-in-progress: true

jobs:
  dispatch-rules-production:
    runs-on: ubuntu-latest
    steps:
      - name: Fast mode retired; dispatch canonical production pipeline
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run run-bot-rules.yml --repo "$GH_REPO"
