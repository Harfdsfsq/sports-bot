name: Ops • learning review

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  learning-review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Build latest run summary
        run: python scripts/summarize_latest_run.py

      - name: Audit odds integrity across archives
        run: python scripts/audit_odds_integrity.py

      - name: Build learning bundle
        run: python scripts/build_learning_bundle.py

      - name: Upload learning artifacts
        uses: actions/upload-artifact@v5
        with:
          name: learning-review-${{ github.run_id }}
          path: artifacts/**
          if-no-files-found: ignore
          retention-days: 14
