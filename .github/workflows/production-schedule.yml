name: production-schedule

on:
  schedule:
    # 21,23,01,... UTC => 00,02,04,... Europe/Moscow.
    # Daily inventory is managed separately by the existing cron-job.org job.
    - cron: "0 1-23/2 * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: production-schedule
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch rules-compliant production run
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run run-bot-rules.yml --repo "$GH_REPO"
