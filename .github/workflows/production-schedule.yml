name: production-schedule

on:
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: production-schedule
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch rules-compliant production run
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run run-bot-rules.yml --repo "$GH_REPO"
