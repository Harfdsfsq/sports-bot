name: Run bot • single run integrity

on:
  workflow_dispatch:
    inputs:
      reset_state:
        description: Delete .data/state.json before this manual run
        required: false
        default: false
        type: boolean
  schedule:
    - cron: '7 6 * * *'
    - cron: '17 10 * * *'
    - cron: '17 14 * * *'
    - cron: '17 18 * * *'

permissions:
  contents: write

concurrency:
  group: run-bot-single-run-integrity
  cancel-in-progress: true

env:
  TZ: Europe/Moscow
  APP_TIMEZONE: Europe/Moscow

  TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
  TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
  ODDS_API_IO_KEY: ${{ secrets.ODDS_API_IO_KEY }}
  ODDSPAPI_API_KEY: ${{ secrets.ODDSPAPI_API_KEY }}
  ALLSPORTSAPI_API_KEY: ${{ secrets.ALLSPORTSAPI_API_KEY }}
  FUTRIXMETRICS_API_KEY: ${{ secrets.FUTRIXMETRICS_API_KEY }}
  SSTATS_API_KEY: ${{ secrets.SSTATS_API_KEY }}
  BZZOIRO_API_KEY: ${{ secrets.BZZOIRO_API_KEY }}
  API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
  FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
  THESPORTSDB_API_KEY: ${{ secrets.THESPORTSDB_API_KEY }}
  NEWSAPI_KEY: ${{ secrets.NEWSAPI_KEY }}
  GNEWS_KEY: ${{ secrets.GNEWS_KEY }}

  PUBLISH_DRY_RUN: 'false'
  PREDICTION_PUBLICATION_ENABLED: 'true'
  RUN_REPORT_ENABLED: 'true'
  DAILY_REPORT_ENABLED: 'true'
  DAILY_REPORT_SEND_TELEGRAM: 'true'
  NIGHTLY_REVIEW_REPORT_ONLY_ENABLED: 'false'

  # safer market profile
  PUBLISH_WINDOW_HOURS: '12'
  MIN_KICKOFF_LEAD_MINUTES: '30'
  MAX_PICKS_PER_RUN: '2'
  MIN_BOOKS_PUBLISH: '2'
  MIN_SOURCES_PUBLISH: '1'
  MIN_EDGE_PCT: '3.0'
  MIN_EV_PCT: '2.0'
  MIN_MODEL_CONFIDENCE: '0.60'
  ODDS_MIN: '1.70'
  ODDS_MAX: '2.35'

  QUALITY_LAYER_ENABLED: 'true'
  MIN_QUALITY_SCORE_PUBLISH: '70.0'
  NO_BET_QUALITY_SCORE_ENABLED: 'true'
  QUALITY_FALLBACK_MIN_BOOKS_STRICT: '2'
  QUALITY_TOTALS_FALLBACK_ENABLED: 'true'
  QUALITY_TOTALS_FALLBACK_MIN_BOOKS: '2'
  QUALITY_TOTALS_FALLBACK_MIN_CONFIDENCE: '62.0'
  QUALITY_TOTALS_FALLBACK_MIN_EV_PCT: '2.0'
  QUALITY_TOTALS_FALLBACK_MIN_EDGE_PCT: '3.0'
  QUALITY_TOTALS_FALLBACK_OVER_MIN_XG_HEADROOM: '0.45'
  QUALITY_TOTALS_FALLBACK_UNDER_MIN_XG_HEADROOM: '0.35'
  QUALITY_HIGH_ODDS_MIN_ODDS: '2.35'
  CORE_SINGLE_BOOK_RELIEF_ENABLED: 'false'

  # one-run / one-bundle mode
  LEARNING_BUNDLE_MAX_RUNS: '1'
  LEARNING_BUNDLE_INCLUDE_DEBUG: 'true'
  LEARNING_BUNDLE_INCLUDE_STATE: 'true'
  LEARNING_BUNDLE_INCLUDE_EXPORTS: 'true'

  # odds integrity audit
  ODDS_SANITY_MAX_IMPLIED_GAP_PP: '2.0'
  ODDS_SANITY_MAX_ODDS_TO_FAIR_RATIO: '1.15'
  ODDS_SANITY_FAIL_ON_PUBLISHED: 'false'

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Prepare state folders
        run: mkdir -p .data .data/exports .data/provider_cache .logs artifacts

      - name: Reset state for manual republish
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.reset_state }}
        run: rm -f .data/state.json

      - name: Run full bot cycle once
        run: python -m app.cli run-once

      - name: Summarize latest run
        if: always()
        run: python scripts/summarize_latest_run.py

      - name: Audit odds integrity for latest run
        if: always()
        run: python scripts/audit_odds_integrity.py --latest-only

      - name: Build single-run bundle
        if: always()
        run: python scripts/build_single_run_bundle.py

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: bot-single-run-${{ github.run_id }}
          path: |
            artifacts/**
            .logs/debug-last-run.json
            .logs/runs
            .data/state.json
            .data/exports
          if-no-files-found: ignore
          retention-days: 14

      - name: Commit updated state
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A -f .data .logs artifacts
          git diff --cached --quiet && exit 0
          git commit -m "Update bot state"
          git push
