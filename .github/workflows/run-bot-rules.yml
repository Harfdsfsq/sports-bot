name: run-bot-rules

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Проверка без отправки в Telegram"
        type: boolean
        default: true
      max_picks:
        description: "Максимум прогнозов за запуск (5 за день)"
        type: choice
        options: ["1", "2"]
        default: "2"
      use_secondary_odds_account:
        description: "Совместимость: второй аккаунт подключается автоматически при наличии ключа"
        type: boolean
        default: false
  workflow_call:
    inputs:
      dry_run:
        type: boolean
        default: true
      max_picks:
        type: string
        default: "2"

permissions:
  contents: read

concurrency:
  group: daily-quality-${{ github.repository }}
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      PYTHONUNBUFFERED: "1"
      PYTHONPATH: ${{ github.workspace }}
      TZ: Europe/Moscow
      APP_TIMEZONE: Europe/Moscow
      PUBLICATION_PROFILE: daily_quality
      PUBLISH_DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}
      MAX_PICKS_PER_RUN: ${{ inputs.max_picks || '2' }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN || secrets.TELEGRAM_TOKEN }}
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN || secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      ODDS_API_IO_KEY: ${{ secrets.ODDS_API_IO_KEY }}
      ODDS_API_IO_KEY_2: ${{ secrets.ODDS_API_IO_KEY_2 || secrets.ODDS_API_IO_KEY2 }}
      API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
      BZZOIRO_API_KEY: ${{ secrets.BZZOIRO_API_KEY }}
      SSTATS_API_KEY: ${{ secrets.SSTATS_API_KEY }}
      FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
      THESPORTSDB_API_KEY: ${{ secrets.THESPORTSDB_API_KEY }}
      WEATHERAPI_KEY: ${{ secrets.WEATHERAPI_KEY }}
      OPENWEATHERMAP_API_KEY: ${{ secrets.OPENWEATHERMAP_API_KEY || secrets.OPENWEATHER_API_KEY }}
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: |
            app
            scripts
            config
            tests
            docs
            .github
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Prepare isolated run
        shell: bash
        run: |
          # Only cache state created by this branch/profile is restored below.
          rm -rf .data .logs artifacts/run-bot
          mkdir -p .data/exports .data/day_inventory .data/daily_quality .logs
          echo "RUN_STARTED_AT_UTC=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
          echo "CACHE_DATE=$(TZ=Europe/Moscow date +%F)" >> "$GITHUB_ENV"
          sed '/^[[:space:]]*#/d; /^[[:space:]]*$/d' config/daily_quality.env >> "$GITHUB_ENV"
      - name: Restore registry, provider cache and publication ledger
        uses: actions/cache/restore@v4
        with:
          path: |
            .data/daily_quality
            .data/day_inventory
            .data/provider_cache
            .data/cache
            .data/line_history
            .data/state.json
            .data/candidate-lifecycle-state.json
            .data/published-candidate-index.json
            .data/fallback-sent-index.json
            .data/provider_quota*
            .data/odds_api_io_account_quota_state.json
            .data/provider_cooldowns
          key: daily-quality-v1-${{ github.ref_name }}-${{ inputs.dry_run }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            daily-quality-v1-${{ github.ref_name }}-${{ inputs.dry_run }}-
      - name: Restore shared API budgets for dry and live runs
        uses: actions/cache/restore@v4
        with:
          path: .data/daily_quality/api-budget.json
          key: daily-quality-api-budget-${{ github.repository }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            daily-quality-api-budget-${{ github.repository }}-
      - name: Install dependencies
        run: pip install --disable-pip-version-check -r requirements.txt
      - name: Verify critical pipeline tests
        run: python -m pytest -q tests/test_daily_quality_pipeline.py tests/test_api_budget.py
      - name: Build or complete today's inventory
        shell: bash
        run: |
          if python scripts/daily_inventory_refresh_due.py ".data/day_inventory/${CACHE_DATE}.json"; then
            timeout 900s python -u scripts/build_day_inventory_core_v3.py
          fi
          if [[ "$(TZ=Europe/Moscow date +%H)" -ge 20 ]]; then
            NEXT_DATE=$(TZ=Europe/Moscow date -d tomorrow +%F)
            if python scripts/daily_inventory_refresh_due.py ".data/day_inventory/${NEXT_DATE}.json"; then
              DAY_INVENTORY_TARGET_DATE="$NEXT_DATE" timeout 900s python -u scripts/build_day_inventory_core_v3.py
            fi
          fi
      - name: Run daily quality pipeline
        id: pipeline
        continue-on-error: true
        shell: bash
        run: |
          if [[ "$PUBLISH_DRY_RUN" == "true" ]]; then
            unset TELEGRAM_BOT_TOKEN TELEGRAM_TOKEN TELEGRAM_CHAT_ID
          fi
          set -o pipefail
          timeout 1500s python -u scripts/run_daily_quality_pipeline.py 2>&1 | tee .data/exports/latest-daily-quality-pipeline.log
      - name: Sanitize diagnostics
        if: always()
        run: python -u scripts/sanitize_daily_artifacts.py
      - name: Send current-run report
        id: report
        if: always()
        continue-on-error: true
        run: python -u scripts/send_daily_quality_report.py
      - name: Save shared API budgets
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .data/daily_quality/api-budget.json
          key: daily-quality-api-budget-${{ github.repository }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Save persistent state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            .data/daily_quality
            .data/day_inventory
            .data/provider_cache
            .data/cache
            .data/line_history
            .data/state.json
            .data/candidate-lifecycle-state.json
            .data/published-candidate-index.json
            .data/fallback-sent-index.json
            .data/provider_quota*
            .data/odds_api_io_account_quota_state.json
            .data/provider_cooldowns
          key: daily-quality-v1-${{ github.ref_name }}-${{ inputs.dry_run }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: run-bot-rules-${{ github.run_id }}
          path: |
            .data/exports
            .data/daily_quality
            .data/day_inventory
            .logs/debug-last-run.json
          include-hidden-files: true
          retention-days: 14
      - name: Check pipeline and delivery
        if: always()
        env:
          PIPELINE_OUTCOME: ${{ steps.pipeline.outcome }}
          REPORT_OUTCOME: ${{ steps.report.outcome }}
        run: |
          test "$PIPELINE_OUTCOME" = "success"
          test "$REPORT_OUTCOME" = "success"
