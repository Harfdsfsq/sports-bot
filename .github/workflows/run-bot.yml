  CONTEXT_ENRICHMENT_MATCH_LIMIT: '72'
  PUBLISH_WINDOW_HOURS: '5'
  MIN_KICKOFF_LEAD_MINUTES: '45'
  MAX_MATCHES_FOR_ODDS_FETCH: '80'
  MAX_PICKS_PER_RUN: '3'
  MAX_PICKS_PER_FAMILY: '2'
  MAX_PICKS_PER_LEAGUE: '2'
  MAX_SAME_REASON_SIGNATURE: '2'
  ALLOW_LOW_TIER: 'false'
  ALLOW_SINGLE_SHARP_BOOK: 'true'
  BOOKMAKER_ALIAS_RELAXED: 'false'
  CONSENSUS_ALIAS_GROUPS: ''
  MIN_SOURCES_PUBLISH: '1'

  MIN_MODEL_CONFIDENCE: '0.58'
  SIMPLE_MARKET_TOTALS_MIN_CONFIDENCE: '52'
  SIMPLE_MARKET_H2H_MIN_CONFIDENCE: '56'
  SIMPLE_MARKET_TOTALS_MIN_EV_PCT: '1.4'
  SIMPLE_MARKET_TOTALS_MIN_EDGE_PCT: '1.8'
  SIMPLE_MARKET_H2H_MIN_EV_PCT: '1.8'
  SIMPLE_MARKET_H2H_MIN_EDGE_PCT: '2.4'
  SUPPORTED_TOTAL_LINES: '0.75,1.0,1.25,1.5,1.75,2.0,2.25,2.5,2.75,3.0,3.25,3.5,3.75,4.0,4.25,4.5,4.75,5.0'
  LINE_SUPPORT_TOLERANCE: '0.10'
  SIMPLE_MARKET_MIN_SIGNAL_BOOST_PCT: '0.30'
  MAX_CONSENSUS_DISPERSION_PCT: '14.0'

  REJECT_NEGATIVE_EXPECTED_GOALS: 'true'
  MIN_EXPECTED_GOALS_VALUE: '0.35'
  MAX_EXPECTED_GOALS_VALUE: '4.8'

  H2H_MIN_BOOKS: '2'
  H2H_MIN_EDGE_PCT: '3.2'
  H2H_MIN_EV_PCT: '1.9'
  H2H_MIN_MODEL_CONFIDENCE: '0.61'
  H2H_SINGLE_SOURCE_MIN_CONFIDENCE: '60'
  H2H_SINGLE_SOURCE_MIN_EDGE_PCT: '4.0'
  H2H_SINGLE_SOURCE_MIN_EV_PCT: '2.2'
  H2H_XG_DISLOCATION_GUARD_ENABLED: 'true'
  H2H_XG_DISLOCATION_MARKET_MAX_PROB: '0.62'
  H2H_XG_DISLOCATION_MIN_CONFIDENCE: '0.74'
  H2H_XG_DISLOCATION_MIN_DIFF: '0.60'
  H2H_XG_DISLOCATION_MIN_SOURCES: '2'

  TOTALS_MIN_BOOKS: '2'
  TOTALS_MIN_EDGE_PCT: '3.4'
  TOTALS_MIN_EV_PCT: '2.1'
  TOTALS_MIN_MODEL_CONFIDENCE: '0.59'

  SPREADS_MIN_BOOKS: '1'
  SPREADS_MIN_EDGE_PCT: '3.0'
  SPREADS_MIN_EV_PCT: '1.8'
  SPREADS_MIN_MODEL_CONFIDENCE: '0.58'

  TEAM_TOTALS_MIN_BOOKS: '1'
  TEAM_TOTALS_MIN_EDGE_PCT: '3.6'
  TEAM_TOTALS_MIN_EV_PCT: '2.2'
  TEAM_TOTALS_MIN_MODEL_CONFIDENCE: '0.60'

  BTTS_MIN_BOOKS: '1'
  BTTS_MIN_EDGE_PCT: '3.0'
  BTTS_MIN_EV_PCT: '1.8'
  BTTS_MIN_MODEL_CONFIDENCE: '0.60'

  SINGLE_SHARP_MIN_CONFIDENCE: '0.74'
  SINGLE_SHARP_MIN_EDGE_PCT: '7.6'

  FALLBACK_PUBLISH_MODE_ENABLED: 'true'
  FALLBACK_PUBLISH_MIN_CONFIDENCE: '51'
  FALLBACK_PUBLISH_MIN_EDGE_PCT: '1.6'
  FALLBACK_PUBLISH_MIN_EV_PCT: '1.0'
  FALLBACK_PUBLISH_MIN_BOOKS: '2'
  MIN_PUBLICATION_SCORE: '9.5'
  MIN_PUBLICATION_SCORE_SECONDARY_LEAGUE: '11.5'
  MIN_PUBLICATION_SCORE_OTHER_LEAGUE: '13.5'
  MIN_PUBLICATION_SCORE_LOW_TIER: '22.0'

  NON_CORE_LEAGUE_MIN_BOOKS: '2'
  NON_CORE_LEAGUE_MIN_CONFIDENCE: '58.0'
  NON_CORE_LEAGUE_MIN_EDGE_PCT: '2.8'
  NON_CORE_LEAGUE_MIN_EV_PCT: '1.8'
  NON_CORE_LEAGUE_REQUIRE_CORE_CONTEXT: 'false'

  PREFERRED_SINGLE_BOOK_MIN_CONFIDENCE: '64'
  PREFERRED_SINGLE_BOOK_MIN_EDGE_PCT: '4.2'
  PREFERRED_SINGLE_BOOK_MIN_EV_PCT: '2.2'
  PREFERRED_SINGLE_BOOK_MIN_PUBLICATION_SCORE: '10.5'

  SECONDARY_SINGLE_BOOK_MIN_CONFIDENCE: '66'
  SECONDARY_SINGLE_BOOK_MIN_EDGE_PCT: '4.6'
  SECONDARY_SINGLE_BOOK_MIN_EV_PCT: '2.4'
  SECONDARY_SINGLE_BOOK_MIN_PUBLICATION_SCORE: '11.5'

  TOTALS_OVER25_DUAL_THREAT_GUARD_ENABLED: 'true'
  TOTALS_OVER25_MIN_WEAKER_SIDE_XG: '0.58'
  TOTALS_OVER25_MAX_TEAM_XG_SHARE: '0.82'

  SUPPORTED_TEAM_TOTAL_LINES: '0.25,0.5,0.75,1.0,1.25,1.5,1.75,2.0,2.25,2.5,2.75,3.0,3.25,3.5'

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Smoke import check
        run: |
          python -c "from app.config import Settings; Settings(); import app.cli; import app.services.runner; import app.services.model; import app.services.market_monitor; import app.providers.odds_api_io; import app.providers.oddspapi; import app.providers.allsportsapi; import app.providers.futrixmetrics; import app.providers.football_data; import app.providers.openfootball; import app.providers.newsapi; import app.providers.gnews"

      - name: Compile key modules
        run: |
          python -m py_compile             app/config.py             app/schemas.py             app/providers/odds_api_io.py             app/providers/oddspapi.py             app/providers/allsportsapi.py             app/providers/futrixmetrics.py             app/providers/football_data.py             app/providers/openfootball.py             app/providers/newsapi.py             app/providers/gnews.py             app/services/runner.py             app/services/model.py             app/services/market_monitor.py             app/services/sheet_export.py             app/services/settlement.py             app/services/telegram.py             app/state.py

      - name: Prepare local state folders
        run: mkdir -p .data .data/exports

      - name: Reset state for manual republish
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.reset_state }}
        run: rm -f .data/state.json

      - name: Run bot once
        run: python -m app.cli run-once

      - name: Upload latest debug artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bot-debug-${{ github.run_id }}
          path: |
            .data/debug-last-run.json
            .data/exports/latest-matches.json
            .data/exports/latest-matches.csv
            .data/exports/latest-picks.json
            .data/exports/latest-picks.csv
            .data/sheet-export.json
            .data/sheet-export.csv
            .data/sheet-run-summary.json
            .data/sheet-picks.csv
            .data/sheet-matches.csv
          if-no-files-found: ignore
          retention-days: 7

      - name: Commit updated bot state
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add .data/state.json .data/debug-last-run.json .data/exports .data/sheet-export.json .data/sheet-export.csv .data/sheet-run-summary.json .data/sheet-picks.csv .data/sheet-matches.csv || true
          git diff --cached --quiet && exit 0
          git commit -m "Update bot state"
          git push
