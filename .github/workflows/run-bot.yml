name: Run Sports Bot

on:
  workflow_dispatch:
  schedule:
    - cron: "15 */12 * * *"

permissions:
  contents: write

concurrency:
  group: sports-bot-runner-${{ github.ref }}
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Smoke check imports
        run: python -c "import app.cli; import app.services.runner; import app.services.model; import app.services.market_monitor"

      - name: Compile critical modules
        run: python -m py_compile app/config.py app/services/runner.py app/services/model.py app/services/market_monitor.py

      - name: Prepare data dir
        run: mkdir -p .data .data/exports

      - name: Run bot
        env:
          APP_ENV: production
          APP_TIMEZONE: Europe/Moscow
          TZ: Europe/Moscow
          STATE_PATH: .data/state.json
          DEBUG_PATH: .data/debug-last-run.json
          STORAGE_EXPORT_DIR: .data/exports
          PUBLISH_DRY_RUN: false
          RUN_SPORTS: soccer
          RUN_DAYS_AHEAD: 4
          PUBLISH_WINDOW_HOURS: 48
          MIN_KICKOFF_LEAD_MINUTES: 30
          TARGET_BOOKMAKERS: Bet365,Unibet
          CONSENSUS_BOOKMAKERS: Bet365,Unibet,Pinnacle,Betfair
          ODDS_API_IO_BOOKMAKERS: Bet365,Unibet
          MIN_BOOKS_PUBLISH: 2
          MIN_SOURCES_PUBLISH: 1
          MIN_MODEL_CONFIDENCE: 0.55
          MAX_MATCHES_FOR_ODDS_FETCH: 300
          MAX_MATCHES_FOR_PRICING: 300
          MAX_PICKS_PER_RUN: 5
          ALLOW_LOW_TIER: false
          ENABLE_PROVIDER_DIAGNOSTICS: true
          DIAGNOSTICS_MATCH_LIMIT: 180
          CONTEXT_ENRICHMENT_MATCH_LIMIT: 90
          CONTEXT_ENRICHMENT_REQUIRES_OFFERS: true
          BOOKIES_BOOTSTRAP_ENABLED: true
          BOOKIES_API_ENABLED: true
          SSTATS_ENABLED: true
          ENABLE_ODDS_API_IO: true
          ENABLE_SSTATS_CONTEXT: true
          BOOKIES_API_BASE_URL: ${{ secrets.BOOKIES_API_BASE_URL }}
          BOOKIES_API_LOGIN: ${{ secrets.BOOKIES_API_LOGIN }}
          BOOKIES_API_KEY: ${{ secrets.BOOKIES_API_KEY }}
          BOOKIES_API_TOKEN: ${{ secrets.BOOKIES_API_TOKEN }}
          BOOKIES_API_USE_FOR_BACKFILL_ONLY: true
          BOOKIES_API_ODDS_TASK: odds
          BOOKIES_API_ODDS_FETCH_LIMIT: 40
          BOOKIES_API_TIMEOUT_SECONDS: 30
          BOOKIES_API_MAX_PAGES_PER_DAY: 40
          BOOKIES_API_PAGE_LIMIT: 50
          ODDS_API_IO_KEY: ${{ secrets.ODDS_API_IO_KEY }}
          SSTATS_API_KEY: ${{ secrets.SSTATS_API_KEY }}
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          BZZOIRO_API_KEY: ${{ secrets.BZZOIRO_API_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m app.cli run-once

      - name: Commit updated state and exports
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add \
            .data/state.json \
            .data/exports/latest-picks.json \
            .data/exports/latest-picks.csv \
            .data/exports/latest-matches.json \
            .data/exports/latest-matches.csv || true
          git diff --cached --quiet && exit 0
          git commit -m "Update bot state"
          git push
