  API_FOOTBALL_ENABLED: 'false'
  API_FOOTBALL_CONTEXT_MATCH_LIMIT: '0'
  API_FOOTBALL_PREDICTIONS_LIMIT: '0'
  API_FOOTBALL_FETCH_MATCH_DATES_ONLY: 'true'
  API_FOOTBALL_FREE_DAYS_AHEAD: '1'

  ENABLE_OPENFOOTBALL_CONTEXT: 'false'
  OPENFOOTBALL_CONTEXT_MATCH_LIMIT: '0'

  ENABLE_NEWSAPI_CONTEXT: 'false'
  NEWSAPI_CONTEXT_MATCH_LIMIT: '0'
  NEWSAPI_MATCH_LIMIT: '0'
  NEWSAPI_ARTICLES_PER_MATCH: '0'
  NEWSAPI_LOOKBACK_HOURS: '24'

  ENABLE_GNEWS_CONTEXT: 'false'
  GNEWS_TIMEOUT_SECONDS: '8'
  GNEWS_CONTEXT_MATCH_LIMIT: '2'
  GNEWS_MATCH_LIMIT: '2'
  GNEWS_ARTICLES_PER_MATCH: '2'
