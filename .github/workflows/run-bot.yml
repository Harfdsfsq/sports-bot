name: Run bot

on:
  workflow_dispatch:
    inputs:
      reset_state:
        description: Delete .data/state.json before this manual run
        required: false
        default: false
        type: boolean
      late_manual_mode:
        description: Allow very late manual runs with a smaller kickoff lead window
        required: false
        default: true
        type: boolean
  schedule:
    - cron: '0 5,9,13,17 * * *'
    - cron: '0 19 * * *'

permissions:
  contents: write

concurrency:
  group: run-bot-${{ github.event.schedule || github.event_name }}
  cancel-in-progress: true

env:
  TZ: Europe/Moscow
  APP_TIMEZONE: Europe/Moscow
  TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
  TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
  SHEET_ID: ${{ secrets.SHEET_ID }}
  PUBLISH_DRY_RUN: 'false'
  PREDICTION_PUBLICATION_ENABLED: ${{ github.event_name == 'schedule' && github.event.schedule == '0 19 * * *' && 'false' || 'true' }}
  RUN_REPORT_ENABLED: ${{ github.event_name == 'schedule' && github.event.schedule == '0 19 * * *' && 'false' || 'true' }}
  DAILY_REPORT_ENABLED: 'true'
  DAILY_REPORT_SEND_TELEGRAM: 'true'
  DAILY_REPORT_HOUR_LOCAL: '22'
  NIGHTLY_REVIEW_REPORT_ONLY_ENABLED: 'true'
  SETTLEMENT_ENABLED: 'true'
  SETTLEMENT_GRACE_MINUTES: '180'
  SETTLEMENT_LOOKBACK_DAYS: '5'

  ODDS_API_IO_ENABLED: 'true'
  ODDS_API_IO_KEY: ${{ secrets.ODDS_API_IO_KEY }}
  ODDS_API_IO_BOOKMAKERS: 'Bet365,Unibet'
  ODDSPAPI_ENABLED: 'true'
  ODDSPAPI_API_KEY: ${{ secrets.ODDSPAPI_API_KEY }}
  ODDSPAPI_MIN_FETCH_INTERVAL_MINUTES: '360'
  ODDSPAPI_MATCH_LIMIT: '12'
  ODDSPAPI_TOURNAMENT_LIMIT: '4'
  ODDSPAPI_BOOKMAKERS: 'bet365,unibet'
  ALLSPORTSAPI_ENABLED: 'true'
  ALLSPORTSAPI_API_KEY: ${{ secrets.ALLSPORTSAPI_API_KEY }}
  ALLSPORTSAPI_MIN_FETCH_INTERVAL_MINUTES: '240'
  ALLSPORTSAPI_MATCH_LIMIT: '8'
  ALLSPORTSAPI_BOOKMAKERS: 'Bet365,Unibet'

  SSTATS_API_KEY: ${{ secrets.SSTATS_API_KEY }}
  BZZOIRO_API_KEY: ${{ secrets.BZZOIRO_API_KEY }}
  API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
  FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
  THESPORTSDB_API_KEY: ${{ secrets.THESPORTSDB_API_KEY }}
  NEWSAPI_KEY: ${{ secrets.NEWSAPI_KEY }}
  GNEWS_KEY: ${{ secrets.GNEWS_KEY }}
  FUTRIXMETRICS_ENABLED: 'true'
  FUTRIXMETRICS_API_KEY: ${{ secrets.FUTRIXMETRICS_API_KEY }}

  TARGET_BOOKMAKERS: 'Bet365,Unibet'
  CONSENSUS_BOOKMAKERS: 'Bet365,Unibet'
  SHARP_BOOKMAKERS: 'Bet365,Unibet'
  MIN_WEIGHTED_BOOKS_FOR_CONSENSUS: '1.05'
  MIN_BOOKS_PUBLISH: '2'
  MIN_SOURCES_PUBLISH: '1'

  MATCH_BOOTSTRAP_PROVIDER: 'odds_api_io'
  PUBLISH_WINDOW_HOURS: '12'
  MIN_KICKOFF_LEAD_MINUTES: '30'
  ADAPTIVE_MIN_KICKOFF_LEAD_ENABLED: 'true'
  ADAPTIVE_MIN_KICKOFF_LEAD_MINUTES: '30'
  EMERGENCY_MIN_KICKOFF_LEAD_ENABLED: 'true'
  EMERGENCY_MIN_KICKOFF_LEAD_MINUTES: '30'
  EMERGENCY_MIN_KICKOFF_ACTIVATION_RATIO: '0.85'
  MANUAL_LATE_MODE_ENABLED: ${{ github.event_name == 'workflow_dispatch' && inputs.late_manual_mode && 'true' || 'false' }}
  MANUAL_LATE_MIN_KICKOFF_LEAD_MINUTES: '30'
  MANUAL_LATE_ADAPTIVE_MIN_KICKOFF_LEAD_MINUTES: '30'

  ENABLE_CONTEXT_STAGING: 'true'
  CONTEXT_ENRICHMENT_REQUIRES_OFFERS: 'true'
  CONTEXT_ENRICHMENT_MATCH_LIMIT: '36'
  PREMIUM_CONTEXT_SHORTLIST_LIMIT: '18'
  PREMIUM_NEWS_SHORTLIST_LIMIT: '2'
  VALUE_HINT_MIN_EDGE_PCT: '0.9'

  ENABLE_BZZOIRO_CONTEXT: 'true'
  BZZOIRO_CONTEXT_MATCH_LIMIT: '48'
  ENABLE_ESPN_CONTEXT: 'true'
  ESPN_CONTEXT_MATCH_LIMIT: '32'
  ESPN_MAX_MATCHES: '40'
  ESPN_SLUGS_PER_RUN_LIMIT: '12'
  ESPN_SOCCER_LEAGUES: 'eng.1,eng.2,esp.1,esp.2,ita.1,ita.2,ger.1,ger.2,fra.1,ned.1,bel.1,por.1,sco.1,tur.1,usa.1,uefa.champions,uefa.europa,uefa.europa.conf,conmebol.libertadores,conmebol.sudamericana'
  ENABLE_THESPORTSDB_CONTEXT: 'true'
  THESPORTSDB_CONTEXT_MATCH_LIMIT: '72'
  THESPORTSDB_MAX_LEAGUES: '24'
  ENABLE_FOOTBALL_DATA_CONTEXT: 'true'
  FOOTBALL_DATA_MATCH_LIMIT: '160'
  FOOTBALL_DATA_CONTEXT_MATCH_LIMIT: '96'
  FOOTBALL_DATA_STANDINGS_LIMIT: '8'
  FOOTBALL_DATA_HISTORY_COMPETITIONS_LIMIT: '8'
  FOOTBALL_DATA_COMPETITION_MATCH_LIMIT: '220'
  FOOTBALL_DATA_MATCH_SCORE_THRESHOLD: '34'
  FOOTBALL_DATA_DAYS_AHEAD: '3'
  ENABLE_OPENLIGADB_CONTEXT: 'true'
  OPENLIGADB_CONTEXT_MATCH_LIMIT: '24'
  OPENLIGADB_DATASET_LIMIT: '6'
  OPENLIGADB_MATCH_LIMIT: '80'
  API_FOOTBALL_ENABLED: 'true'
  API_FOOTBALL_CONTEXT_MATCH_LIMIT: '24'
  API_FOOTBALL_PREDICTIONS_LIMIT: '14'
  API_FOOTBALL_FETCH_MATCH_DATES_ONLY: 'true'
  API_FOOTBALL_FREE_DAYS_AHEAD: '1'
  ENABLE_OPENFOOTBALL_CONTEXT: 'true'
  OPENFOOTBALL_CONTEXT_MATCH_LIMIT: '80'
  OPENFOOTBALL_MATCH_LIMIT: '80'
  NEWSAPI_CONTEXT_MATCH_LIMIT: '2'
  NEWSAPI_MATCH_LIMIT: '2'
  NEWSAPI_ARTICLES_PER_MATCH: '3'
  GNEWS_CONTEXT_MATCH_LIMIT: '1'
  GNEWS_MATCH_LIMIT: '1'
  GNEWS_ARTICLES_PER_MATCH: '2'
  FUTRIXMETRICS_CONTEXT_MATCH_LIMIT: '6'
  FUTRIXMETRICS_LIMIT_PER_TEAM: '40'

  MARKET_DERIVED_CANDIDATES_ENABLED: 'true'
  MARKET_DERIVED_MIN_BOOKS: '2'
  MARKET_DERIVED_MIN_SOURCES: '1'
  MARKET_DERIVED_MIN_OBSERVATIONS: '2'
  MARKET_DERIVED_MIN_EDGE_PCT: '0.9'
  MARKET_DERIVED_MAX_DISPERSION_PCT: '9.5'
  MARKET_DERIVED_CONSENSUS_RELIEF_ENABLED: 'true'
  MARKET_DERIVED_CONSENSUS_RELIEF_MIN_EDGE_PCT: '1.6'
  SIMPLE_MARKET_MIN_SIGNAL_BOOST_PCT: '0.15'
  SIMPLE_MARKET_H2H_MIN_CONFIDENCE: '51'
  SIMPLE_MARKET_SPREADS_MIN_CONFIDENCE: '51'
  SIMPLE_MARKET_TOTALS_MIN_CONFIDENCE: '50'

  QUALITY_LAYER_ENABLED: 'true'
  MIN_QUALITY_SCORE_PUBLISH: '60'
  CLV_QUALITY_GUARD_ENABLED: 'true'
  HISTORICAL_SEGMENT_GUARD_ENABLED: 'true'
  QUALITY_HIGH_ODDS_GUARD_ENABLED: 'true'
  NO_BET_QUALITY_SCORE_ENABLED: 'true'
  MARKET_SANITY_GUARD_ENABLED: 'true'
  DIXON_COLES_ENABLED: 'true'

  H2H_HIGH_ODDS_MIN_ODDS: '3.40'
  H2H_HIGH_ODDS_MARKET_MAX_PROB: '0.30'
  H2H_HIGH_ODDS_MIN_CONFIDENCE: '68.0'
  H2H_HIGH_ODDS_MIN_EDGE_PCT: '5.0'
  H2H_HIGH_ODDS_MIN_EV_PCT: '2.8'
  H2H_HIGH_ODDS_MIN_XG_DIFF: '0.35'
  H2H_HIGH_ODDS_MIN_CONTEXT_SOURCES: '2'

  H2H_SINGLE_SOURCE_MIN_CONFIDENCE: '60'
  H2H_SINGLE_SOURCE_MIN_EDGE_PCT: '4.0'
  H2H_SINGLE_SOURCE_MIN_EV_PCT: '2.2'
  H2H_SIDE_MIN_CONFIDENCE: '51'

  TOTALS_MIN_EDGE_PCT: '3.0'
  TOTALS_MIN_EV_PCT: '2.2'
  TOTALS_MIN_MODEL_CONFIDENCE: '0.57'
  TOTALS_OVER25_MIN_CONFIDENCE: '64'
  TOTALS_OVER25_MIN_EDGE_PCT: '7.0'
  TOTALS_OVER25_MIN_EV_PCT: '4.8'

  SPREADS_MIN_EDGE_PCT: '2.2'
  SPREADS_MIN_EV_PCT: '1.3'
  SPREADS_MIN_MODEL_CONFIDENCE: '0.54'
  DNB_MIN_EDGE_PCT: '1.8'
  DNB_MIN_EV_PCT: '1.2'
  DNB_MIN_MODEL_CONFIDENCE: '0.54'

  BTTS_MIN_EDGE_PCT: '2.2'
  BTTS_MIN_EV_PCT: '1.3'
  BTTS_MIN_MODEL_CONFIDENCE: '0.55'
  TEAM_TOTALS_MIN_EDGE_PCT: '2.4'
  TEAM_TOTALS_MIN_EV_PCT: '1.5'
  TEAM_TOTALS_MIN_MODEL_CONFIDENCE: '0.56'

  FALLBACK_PUBLISH_MODE_ENABLED: 'false'
  MODEL_RELAXED_FALLBACK_ENABLED: 'false'
  FORCE_PUBLISH_WHEN_EMPTY_ENABLED: 'false'

  MIN_PUBLICATION_SCORE: '12.5'
  MIN_PUBLICATION_SCORE_SECONDARY_LEAGUE: '14.5'
  MIN_PUBLICATION_SCORE_OTHER_LEAGUE: '18.0'
  MIN_PUBLICATION_SCORE_LOW_TIER: '24.0'
  NON_CORE_LEAGUE_MIN_BOOKS: '2'
  NON_CORE_LEAGUE_MIN_CONFIDENCE: '66.0'
  NON_CORE_LEAGUE_MIN_EDGE_PCT: '5.5'
  NON_CORE_LEAGUE_MIN_EV_PCT: '3.4'
  NON_CORE_LEAGUE_REQUIRE_CORE_CONTEXT: 'true'
  MAX_NON_CORE_PICKS_PER_RUN: '1'
  PREFER_CORE_LEAGUES_IN_SHORTLIST: 'true'

  MAX_MATCHES_FOR_ODDS_FETCH: '180'
  MAX_PICKS_PER_RUN: '2'
  MAX_PICKS_PER_FAMILY: '2'
  MAX_PICKS_PER_LEAGUE: '2'
  MAX_SAME_REASON_SIGNATURE: '2'
  ALLOW_LOW_TIER: 'false'
  ALLOW_SINGLE_SHARP_BOOK: 'false'
  BOOKMAKER_ALIAS_RELAXED: 'true'

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Smoke import check
        run: |
          python -c "import app; import app.cli; import app.main; import app.services.runner; import app.services.model; import app.providers.api_football; import app.runtime_bot_fix"

      - name: Compile key modules
        run: |
          python -m py_compile \
            app/__init__.py \
            app/cli.py \
            app/main.py \
            app/runtime_bot_fix.py \
            app/config.py \
            app/providers/api_football.py \
            app/services/model.py \
            app/services/runner.py \
            app/services/quality.py \
            app/services/telegram.py \
            app/state.py

      - name: Prepare local state folders
        run: mkdir -p .data .data/exports

      - name: Reset state for manual republish
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.reset_state }}
        run: rm -f .data/state.json

      - name: Run bot once
        run: python -m app.cli run-once

      - name: Smoke offline reporting commands
        run: |
          python -m app.cli coverage-audit
          python -m app.cli training-dataset
          python -m app.cli reporting-sqlite

      - name: Upload latest debug artifacts
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: bot-debug-${{ github.run_id }}
          path: |
            .data/debug-last-run.json
            .data/exports/latest-matches.json
            .data/exports/latest-matches.csv
            .data/exports/latest-picks.json
            .data/exports/latest-picks.csv
            .data/exports/latest-bets.json
            .data/exports/latest-bets.csv
            .data/exports/latest-quality-report.json
            .data/exports/latest-quality-segments.csv
            .data/exports/coverage-audit.json
            .data/exports/training-dataset.csv
            .data/exports/reporting.sqlite
          if-no-files-found: ignore
          retention-days: 7

      - name: Commit updated bot state
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A .data
          git diff --cached --quiet && exit 0
          git commit -m "Update bot state"
          git push
