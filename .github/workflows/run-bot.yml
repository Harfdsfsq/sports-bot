name: run-bot

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Compatibility input used by cron-job.org"
        required: false
        default: "normal"
        type: string
      provider_smoke:
        description: "Deprecated compatibility input"
        required: false
        default: "false"
        type: string
      run_tests:
        description: "Deprecated compatibility input"
        required: false
        default: "false"
        type: string

permissions:
  actions: write
  contents: read

concurrency:
  group: run-bot-dispatch-main
  cancel-in-progress: true

jobs:
  dispatch-rules-production:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch single production pipeline
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run run-bot-rules.yml --repo "$GH_REPO"
