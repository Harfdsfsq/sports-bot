name: Run bot

on:
  workflow_dispatch:
    inputs:
      reset_state:
        description: Delete .data/state.json before this manual run
        required: false
        default: false
        type: boolean
      late_manual_mode:
        description: Allow very late manual runs with a smaller kickoff lead window
        required: false
        default: true
        type: boolean
  schedule:
    - cron: '0 3,5,7,9,11,13,15,17,19 * * *'

permissions:
  contents: write

concurrency:
  group: run-bot-${{ github.event.schedule || github.event_name }}
  cancel-in-progress: true

env:
  TZ: Europe/Moscow
  APP_TIMEZONE: Europe/Moscow
  MIN_SOURCES_PUBLISH: '1'
  DAY_PREDICTIONS_REPORT_ENABLED: 'true'
  POSTFILTER_SINGLE_SOURCE_HEAVY_SHRINK_MIN_PP: '10.0'
  POSTFILTER_SINGLE_SOURCE_HEAVY_SHRINK_MIN_QUALITY: '80.0'
  POSTFILTER_SINGLE_SOURCE_HEAVY_SHRINK_MIN_CONFIDENCE: '70.0'
  POSTFILTER_SINGLE_SOURCE_HEAVY_SHRINK_MIN_EV_PCT: '14.0'

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Prepare local state folders
        run: mkdir -p .data .data/exports .data/provider_cache/daily-coverage .data/provider_cache/day-shortlist .logs
      - name: Reset state for manual republish
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.reset_state }}
        run: rm -f .data/state.json
      - name: Run bot once
        run: python -m app.cli run-once
