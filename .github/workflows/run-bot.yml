name: Run bot

on:
  workflow_dispatch:
    inputs:
      reset_state:
        description: Delete .data/state.json before this manual run
        required: false
        default: false
        type: boolean
  schedule:
    - cron: '0 */5 * * *'

permissions:
  contents: write

concurrency:
  group: run-bot
  cancel-in-progress: false

env:
  TZ: Europe/Moscow
  APP_TIMEZONE: Europe/Moscow
  TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
  TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
  SHEET_ID: ${{ secrets.SHEET_ID }}
  PUBLISH_DRY_RUN: 'false'

  BANKROLL_CURRENCY: 'units'
  BANKROLL_ENABLED: 'true'
  BANKROLL_STARTING_BALANCE: '1000'
  BANKROLL_FLAT_STAKE_PCT: '2.0'
  BANKROLL_KELLY_ENABLED: 'true'
  BANKROLL_KELLY_FRACTION: '0.20'
  BANKROLL_MIN_STAKE_PCT: '1.0'
  BANKROLL_MAX_STAKE_PCT: '3.0'
  BANKROLL_MIN_STAKE_AMOUNT: '10'
  BANKROLL_MAX_OPEN_EXPOSURE_PCT: '100.0'
  SETTLEMENT_ENABLED: 'true'
  SETTLEMENT_GRACE_MINUTES: '180'
  SETTLEMENT_LOOKBACK_DAYS: '5'
  SETTLEMENT_SEND_TELEGRAM_SUMMARY: 'true'

  ODDS_API_IO_ENABLED: 'true'
  ODDS_API_IO_BOOTSTRAP_ENABLED: 'true'
  ODDS_API_IO_KEY: ${{ secrets.ODDS_API_IO_KEY }}
  ODDS_API_IO_BOOKMAKERS: 'Bet365,Unibet'

  ODDSPAPI_ENABLED: 'true'
  ODDSPAPI_API_KEY: ${{ secrets.ODDSPAPI_API_KEY }}
  ODDSPAPI_MIN_FETCH_INTERVAL_MINUTES: '720'
  ODDSPAPI_MATCH_LIMIT: '6'
  ODDSPAPI_TOURNAMENT_LIMIT: '2'
  ODDSPAPI_BOOKMAKERS: 'bet365,unibet'
  ODDSPAPI_TIMEOUT_SECONDS: '10'

  ALLSPORTSAPI_ENABLED: 'true'
  ALLSPORTSAPI_API_KEY: ${{ secrets.ALLSPORTSAPI_API_KEY }}
  ALLSPORTSAPI_MIN_FETCH_INTERVAL_MINUTES: '360'
  ALLSPORTSAPI_MATCH_LIMIT: '6'
  ALLSPORTSAPI_BOOKMAKERS: 'Bet365,Unibet'
  ALLSPORTSAPI_TIMEOUT_SECONDS: '10'

