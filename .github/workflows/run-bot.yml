name: run-bot

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Run mode"
        required: true
        default: "normal"

permissions:
  contents: write

concurrency:
  group: run-bot
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      PYTHONUNBUFFERED: "1"
      PYTHONPATH: ${{ github.workspace }}
      TZ: Europe/Moscow
      APP_TIMEZONE: Europe/Moscow
      APP_ENV: production
      RUN_MODE: ${{ github.event.inputs.mode || 'normal' }}
      PUBLISH_DRY_RUN: "false"
      PREDICTION_PUBLICATION_ENABLED: "true"
      RUN_REPORT_ENABLED: "false"
      ENHANCED_RUN_REPORT_SEND_TELEGRAM: "true"
      TELEGRAM_MESSAGE_SOFT_LIMIT: "3600"
      PUBLISH_WINDOW_HOURS: "12"
      RUN_DAYS_AHEAD: "4"
      MIN_KICKOFF_LEAD_MINUTES: "30"
      MAX_PICKS_PER_RUN: "2"
      MANUAL_CONTROLLED_PUBLISH_ENABLED: "true"
      HARIZON_FAST_INVENTORY_LOCK: "true"
      HARIZON_RUNTIME_POLICY_VERSION: "harizon-runtime-policy-v5-live-controlled-publish-fast-inventory"
      HARIZON_EFFECTIVE_RUNTIME_POLICY_VERSION: "harizon-runtime-policy-v5-live-controlled-publish-fast-inventory"
      MATCH_BOOTSTRAP_PROVIDER: "odds_api_io"
      DAY_INVENTORY_BOOTSTRAP_PROVIDER: "odds_api_io"
      DAY_INVENTORY_USE_FOR_RUN: "true"
      DAY_INVENTORY_FORCE_PROVIDER_MERGE: "false"
      DAY_INVENTORY_NEAR_WINDOW_PRIORITY: "true"
      DAY_INVENTORY_NEAR_WINDOW_HOURS: "12"
      CONTEXT_ENRICHMENT_REQUIRES_OFFERS: "true"
      CONTEXT_ENRICHMENT_MATCH_LIMIT: "240"
      ANALYSIS_MATCH_CAP_PER_RUN: "420"
      DIAGNOSTICS_MATCH_LIMIT: "420"
      MAX_MATCHES_FOR_ODDS_FETCH: "520"
      CONTROLLED_FALLBACK_ENABLED: "true"
      CONTROLLED_FALLBACK_SEND_TELEGRAM: "true"
      CONTROLLED_FALLBACK_SEND_NO_PICK_REPORT: "false"
      CONTROLLED_FALLBACK_REQUIRE_FRESH_ARTIFACTS: "true"
      CONTROLLED_FALLBACK_ARTIFACT_FRESHNESS_MINUTES: "90"
      CONTROLLED_FALLBACK_ALLOWED_FAMILIES: "totals,dnb,btts"
      CONTROLLED_FALLBACK_TIER_A_ALLOWED_FAMILIES: "totals,dnb,btts"
      CONTROLLED_FALLBACK_TIER_B_ALLOWED_FAMILIES: "totals,dnb,btts"
      CONTROLLED_FALLBACK_TIER_C_ALLOWED_FAMILIES: ""
      CONTROLLED_FALLBACK_TIER_C_PUBLISH_ENABLED: "false"
      CONTROLLED_FALLBACK_MAX_PICKS_PER_RUN: "2"
      CONTROLLED_FALLBACK_MIN_CONFIRMATION_SOURCES: "1"
      CONTROLLED_FALLBACK_MIN_INDEPENDENT_SOURCES: "2"
      CONTROLLED_FALLBACK_MIN_ODDS_SOURCES: "2"
      CONTROLLED_FALLBACK_REQUIRE_2_BOOKS_FOR_TELEGRAM: "true"
      CONTROLLED_FALLBACK_REQUIRE_2_ODDS_SOURCES_FOR_TELEGRAM: "true"
      CONTROLLED_FALLBACK_REJECT_SINGLE_SOURCE_UNLESS_3_BOOKS: "true"
      CONTROLLED_FALLBACK_SINGLE_SOURCE_MIN_BOOKS: "3"
      CONTROLLED_FALLBACK_PROXY_SINGLE_SOURCE_STRICT: "true"
      CONTROLLED_FALLBACK_PROXY_SINGLE_SOURCE_MIN_EDGE_PP: "3.0"
      CONTROLLED_FALLBACK_PROXY_SINGLE_SOURCE_MIN_EV_PCT: "7.0"
      CONTROLLED_FALLBACK_PROXY_SINGLE_SOURCE_MIN_CONFIDENCE: "68.0"
      CONTROLLED_FALLBACK_FINAL_MIN_EDGE_PP: "3.0"
      CONTROLLED_FALLBACK_FINAL_MIN_EV_PCT: "6.0"
      MARKET_MONITOR_ENABLED: "true"
      MARKET_DERIVED_CANDIDATES_ENABLED: "true"
      SIMPLE_MARKET_FALLBACK_ENABLED: "true"
      PARTIAL_CONTEXT_MARKET_FALLBACK_ENABLED: "true"
      SHADOW_TRACKING_ENABLED: "true"
      SELF_HISTORY_CONTEXT_ENABLED: "true"
      BANKROLL_ENABLED: "true"
      SETTLEMENT_ENABLED: "true"
      SETTLEMENT_SEND_TELEGRAM_SUMMARY: "true"
      MARKET_INTEGRITY_HARD_GUARD_ENABLED: "true"
      MARKET_INTEGRITY_CANDIDATE_PATCH_ENABLED: "true"
      MARKET_INTEGRITY_MIN_BOOKS: "2"
      MARKET_INTEGRITY_MIN_SOURCES: "1"
      MARKET_INTEGRITY_SINGLE_SOURCE_MIN_BOOKS: "3"
      MARKET_INTEGRITY_MAX_PRICE_DISPERSION_PCT: "30"
      MARKET_INTEGRITY_MAX_EXACT_PRICE_DISPERSION_PCT: "22"
      MARKET_INTEGRITY_MAX_EXACT_LINE_DELTA_PCT: "18"
      MARKET_INTEGRITY_USE_EXACT_PRICE_SOURCES: "true"
      PROVIDER_CONTEXT_SOURCES_DO_NOT_CONFIRM_PRICE: "true"
      MATCH_TOTAL_OVER15_MAX_REASONABLE_ODDS: "1.65"
      MATCH_TOTAL_OVER15_ABSOLUTE_PRICE_GUARD_ENABLED: "true"
      MATCH_TOTAL_OVER15_ABSOLUTE_MAX_ODDS: "1.85"
      MATCH_TOTAL_OVER15_MIN_EXACT_BOOKS: "3"
      MATCH_TOTAL_OVER20_MAX_REASONABLE_ODDS: "2.05"
      ENABLE_QUARTER_TOTAL_LINES: "true"
      QUARTER_TOTAL_MIN_BOOKS: "2"
      DISABLE_SPREADS_UNTIL_HANDICAP_PARSER_VERIFIED: "true"
      HANDICAP_PAIR_INTEGRITY_REQUIRED: "true"
      SPREADS_PUBLICATION_ENABLED: "false"
      TEAM_TOTALS_PUBLICATION_ENABLED: "false"
      ENABLE_ODDS_API_IO: "true"
      ODDS_API_IO_ENABLED: "true"
      ODDS_API_IO_BOOKMAKERS: "Bet365,Unibet,Betfair Exchange,Sbobet"
      TARGET_BOOKMAKERS: "Bet365,Unibet,Betfair Exchange,Sbobet"
      CONSENSUS_BOOKMAKERS: "Bet365,Unibet,Betfair Exchange,Sbobet"
      SHARP_BOOKMAKERS: "Bet365,Unibet,Betfair Exchange,Sbobet"
      ODDS_API_IO_BOOKMAKERS_ACCOUNT1: "Bet365,Unibet"
      ODDS_API_IO_BOOKMAKERS_ACCOUNT2: "Betfair Exchange,Sbobet"
      ODDS_API_IO_MAX_REQUESTS_PER_RUN: "200"
      ODDS_API_IO_MAX_HTTP_REQUESTS_PER_RUN: "200"
      ODDS_API_IO_PER_RUN_MAX: "200"
      ODDS_API_IO_ACCOUNT1_PER_RUN_MAX: "100"
      ODDS_API_IO_ACCOUNT2_PER_RUN_MAX: "100"
      ODDS_API_IO_ACCOUNT2_MAX_REQUESTS_PER_RUN: "100"
      ODDS_API_IO_PAGE_LIMIT: "100"
      ODDS_API_IO_MAX_EVENT_PAGES_PER_SPORT: "36"
      ODDS_API_IO_BOOKMAKER_ALIAS_EMPTY_RETRY_ENABLED: "false"
      ODDS_API_IO_UNFILTERED_EMPTY_RETRY_ENABLED: "false"
      PROVIDER_FREE_QUOTA_POLICY_ENABLED: "true"
      PROVIDER_QUOTA_GOVERNOR_ENABLED: "true"
      PROVIDER_QUOTA_RUNS_PER_DAY: "12"
      PROVIDER_QUOTA_SAFETY_FACTOR: "0.78"
      PROVIDER_QUOTA_HARD_TIMEOUT_SECONDS: "25"
      PROVIDER_REQUEST_BUDGET_MODE: "per_run_only"
      PROVIDER_REQUEST_BUDGET_DISABLE_DAILY_MONTHLY: "true"
      ALL_SOURCES_FREE_MAXIMIZE: "true"
      FREE_CONTEXT_RUNTIME_ENABLED: "true"
      FREE_CONTEXT_RUNTIME_TIMEOUT_SECONDS: "6"
      RUNTIME_PROVIDER_DIAGNOSTICS_ENABLED: "true"
      ENABLE_PROVIDER_DIAGNOSTICS: "true"
      API_HEALTH_DURING_RUN_ENABLED: "true"
      API_HEALTH_MODE: "quick"
      API_HEALTH_GUARD_TIMEOUT_SECONDS: "55"
      BZZOIRO_EVENTS_MAX_REQUESTS_PER_RUN: "3"
      BZZOIRO_PREDICTIONS_MAX_REQUESTS_PER_RUN: "3"
      BZZOIRO_PAGE_SIZE: "5"
      BZZOIRO_TIMEOUT_SECONDS: "12"
      SSTATS_MAX_REQUESTS_PER_RUN: "150"
      FOOTBALL_DATA_MAX_REQUESTS_PER_RUN: "8"
      THESPORTSDB_MAX_REQUESTS_PER_RUN: "12"
      ALLSPORTSAPI_MAX_REQUESTS_PER_RUN: "20"
      SPORTLOGIC_QUERY_GUARD_ENABLED: "true"
      SPORTLOGIC_BROAD_FALLBACK_ENABLED: "true"
      SPORTLOGIC_CONTROLLED_ODDS_ENABLED: "false"
      SPORTLOGIC_BOOKMAKERS: "__probe_only__"
      SPORTLOGIC_MAX_REQUESTS_PER_RUN: "20"
      SPORTLOGIC_PER_PAGE: "50"
      FUTRIXMETRICS_MAX_REQUESTS_PER_RUN: "0"
      WEATHERAPI_MAX_REQUESTS_PER_RUN: "24"
      OPENWEATHERMAP_MAX_REQUESTS_PER_RUN: "12"
      OPEN_METEO_ENABLED: "true"
      OPEN_METEO_MAX_REQUESTS_PER_RUN: "120"
      NEWSAPI_MAX_REQUESTS_PER_RUN: "0"
      CURRENTS_MAX_REQUESTS_PER_RUN: "0"
      GNEWS_MAX_REQUESTS_PER_RUN: "0"
      NEWSDATA_MAX_REQUESTS_PER_RUN: "0"
      GUARDIAN_MAX_REQUESTS_PER_RUN: "0"
      CLUBELO_ENABLED: "true"
      CLUBELO_BASE_URL: "http://api.clubelo.com"
      FOOTBALL_DATA_CO_UK_ENABLED: "true"
      WIKIDATA_ENABLED: "true"
      WIKIDATA_MAX_REQUESTS_PER_DAY: "8"
      WIKIDATA_SPARQL_MAX_REQUESTS_PER_DAY: "2"
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN || secrets.TELEGRAM_TOKEN }}
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN || secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      ODDS_API_IO_KEY: ${{ secrets.ODDS_API_IO_KEY }}
      ODDS_API_IO_KEY_2: ${{ secrets.ODDS_API_IO_KEY_2 }}
      BZZOIRO_API_KEY: ${{ secrets.BZZOIRO_API_KEY }}
      SSTATS_API_KEY: ${{ secrets.SSTATS_API_KEY }}
      FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
      THESPORTSDB_API_KEY: ${{ secrets.THESPORTSDB_API_KEY }}
      ALLSPORTSAPI_API_KEY: ${{ secrets.ALLSPORTSAPI_API_KEY }}
      SPORTLOGIC_API_KEY: ${{ secrets.SPORTLOGIC_API_KEY }}
      SPORTLOGIC_KEY: ${{ secrets.SPORTLOGIC_API_KEY }}
      SPORTLOGIC_TOKEN: ${{ secrets.SPORTLOGIC_API_KEY }}
      WEATHERAPI_KEY: ${{ secrets.WEATHERAPI_KEY }}
      WEATHER_API_KEY: ${{ secrets.WEATHERAPI_KEY }}
      WEATHERAPI_API_KEY: ${{ secrets.WEATHERAPI_KEY }}
      OPENWEATHERMAP_API_KEY: ${{ secrets.OPENWEATHERMAP_API_KEY }}
      OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHERMAP_API_KEY }}
      OPENWEATHERMAP_KEY: ${{ secrets.OPENWEATHERMAP_API_KEY }}
      NEWSAPI_KEY: ${{ secrets.NEWSAPI_KEY }}
      CURRENTS_API_KEY: ${{ secrets.CURRENTS_API_KEY }}
      GNEWS_KEY: ${{ secrets.GNEWS_KEY }}
      NEWSDATA_API_KEY: ${{ secrets.NEWSDATA_API_KEY }}
      GUARDIAN_API_KEY: ${{ secrets.GUARDIAN_API_KEY }}
      FUTRIXMETRICS_API_KEY: ${{ secrets.FUTRIXMETRICS_API_KEY }}
      HIGHLIGHTLY_API_KEY: ${{ secrets.HIGHLIGHTLY_API_KEY }}
      METEOSTAT_RAPIDAPI_KEY: ${{ secrets.METEOSTAT_RAPIDAPI_KEY }}
      RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
      FREE_FOOTBALL_RAPIDAPI_KEY: ${{ secrets.FREE_FOOTBALL_RAPIDAPI_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - name: Prepare runtime directories
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .data/exports artifacts/run-bot
          mkdir -p .data/exports .data/cache artifacts/run-bot
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Apply provider quota governor
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p .data/exports .data/cache artifacts/run-bot
          echo "provider quota governor shell start $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          if timeout 45s python -u scripts/apply_provider_quota_governor.py; then
            echo "provider quota governor applied"
          else
            status=$?
            echo "provider quota governor failed or timed out with status ${status}; continuing with request-budget policy"
          fi
      - name: Apply provider request budget
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p .data/exports .data/cache artifacts/run-bot
          echo "provider request budget start $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          if timeout 45s python -u scripts/apply_provider_request_budget.py; then
            echo "provider request budget applied"
          else
            status=$?
            echo "provider request budget failed or timed out with status ${status}; continuing with workflow env"
          fi
      - name: Run tests
        shell: bash
        run: |
          set -uo pipefail
          echo "unit tests start $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          if timeout 60s python -m pytest -q tests/test_market_integrity.py; then
            echo "unit tests passed"
          else
            status=$?
            echo "unit tests failed or timed out with status ${status}; continuing production run"
          fi
      - name: Run bot
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p .data/exports .data/cache artifacts/run-bot
          echo "runtime start $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          python - <<'PY' 2>&1 | tee .data/exports/latest-run-bot.log
          import runpy
          import sys
          print('runtime cli direct start', flush=True)
          sys.argv = ['python -m app.cli', 'run-once']
          runpy.run_module('app.cli', run_name='__main__')
          PY
          status=${PIPESTATUS[0]}
          echo "runtime status ${status}"
          echo "runtime finish $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          find .data/exports -maxdepth 2 -type f -printf '%p\n' | sort || true
          cp -r .data/exports artifacts/run-bot/exports || true
          cp -r .data/cache artifacts/run-bot/cache || true
          cp .logs/debug-last-run.json artifacts/run-bot/debug-last-run.json 2>/dev/null || true
          cp .data/exports/latest-run-bot.log artifacts/run-bot/latest-run-bot.log 2>/dev/null || true
          cp .data/provider_quota_governor_state.json artifacts/run-bot/provider_quota_governor_state.json 2>/dev/null || true
          cp .data/provider_request_budget_state.json artifacts/run-bot/provider_request_budget_state.json 2>/dev/null || true
          exit ${status}
      - name: Publish controlled fallback
        shell: bash
        run: |
          set -uo pipefail
          if [[ ! -s .data/exports/latest-run-bot.log ]]; then
            echo "skip controlled fallback: fresh run-bot log was not created"
            exit 0
          fi
          python scripts/publish_controlled_fallback.py || true
          cp .data/exports/latest-controlled-fallback-report.json artifacts/run-bot/latest-controlled-fallback-report.json 2>/dev/null || true
          cp artifacts/controlled-fallback-report.json artifacts/run-bot/controlled-fallback-report.json 2>/dev/null || true
      - name: Send HARIZON Telegram run report
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          if [[ ! -s .data/exports/latest-run-bot.log ]]; then
            echo "skip HARIZON report: fresh run-bot log was not created"
            exit 0
          fi
          python scripts/send_harizon_telegram_run_report_v3.py || python scripts/send_harizon_telegram_run_report.py || true
          cp .data/exports/latest-harizon-telegram-run-report.txt artifacts/run-bot/latest-harizon-telegram-run-report.txt 2>/dev/null || true
          cp .data/exports/latest-harizon-telegram-run-report.json artifacts/run-bot/latest-harizon-telegram-run-report.json 2>/dev/null || true
      - name: Commit runtime artifacts
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          if [[ ! -s .data/exports/latest-run-bot.log ]]; then
            echo "skip runtime artifact commit: fresh run-bot log was not created"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f .data/exports .data/cache .data/provider_quota_governor_state.json .data/provider_request_budget_state.json .data/provider_quota_state.json || true
          git commit -m "Update runtime artifacts [skip ci]" || true
          git push || true
      - name: Upload run artifact
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: run-bot-${{ github.run_id }}
          path: |
            artifacts/run-bot/**
            .data/exports/**
            .data/cache/**
            .data/provider_quota_governor_state.json
            .data/provider_request_budget_state.json
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 7
