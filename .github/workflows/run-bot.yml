name: Run bot

on:
  workflow_dispatch:
    inputs:
      reset_state:
        description: Delete .data/state.json before this manual run
        required: false
        default: false
        type: boolean
  schedule:
    - cron: '*/30 * * * *'

permissions:
  contents: write

concurrency:
  group: run-bot
  cancel-in-progress: false

env:
  TZ: Europe/Moscow
  APP_TIMEZONE: Europe/Moscow
  TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
  TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
  SHEET_ID: ${{ secrets.SHEET_ID }}
  PUBLISH_DRY_RUN: 'false'

  ODDS_API_IO_ENABLED: 'true'
  ODDS_API_IO_BOOTSTRAP_ENABLED: 'true'
  ODDS_API_IO_KEY: ${{ secrets.ODDS_API_IO_KEY }}
  ODDS_API_IO_BOOKMAKERS: 'Bet365,Unibet'
  TARGET_BOOKMAKERS: 'Bet365,Unibet'
  CONSENSUS_BOOKMAKERS: 'Bet365,Unibet'
  SHARP_BOOKMAKERS: 'Bet365,Unibet'
  MIN_WEIGHTED_BOOKS_FOR_CONSENSUS: '2.0'
  MIN_BOOKS_PUBLISH: '2'

  BOOKIES_API_ENABLED: 'false'
  BOOKIES_API_USE_FOR_BACKFILL_ONLY: 'true'
  BOOKIES_API_BASE_URL: ${{ secrets.BOOKIES_API_BASE_URL }}
  BOOKIES_API_KEY: ${{ secrets.BOOKIES_API_KEY }}
  BOOKIES_API_LOGIN: ${{ secrets.BOOKIES_API_LOGIN }}
  BOOKIES_API_TOKEN: ${{ secrets.BOOKIES_API_TOKEN }}
  BOOKIES_API_ODDS_FETCH_LIMIT: '0'
  BOOKIES_API_ODDS_TASK: ${{ secrets.BOOKIES_API_ODDS_TASK }}

  SSTATS_API_KEY: ${{ secrets.SSTATS_API_KEY }}
  BZZOIRO_API_KEY: ${{ secrets.BZZOIRO_API_KEY }}
  API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
  FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
  THESPORTSDB_API_KEY: ${{ secrets.THESPORTSDB_API_KEY }}
  NEWSAPI_KEY: ${{ secrets.NEWSAPI_KEY }}
  GNEWS_KEY: ${{ secrets.GNEWS_KEY }}

  ENABLE_PROVIDER_DIAGNOSTICS: 'true'
  DIAGNOSTICS_MATCH_LIMIT: '120'

  ENABLE_ESPN_CONTEXT: 'true'
  ESPN_ENABLE_NEWS_CONTEXT: 'false'
  ESPN_TIMEOUT_SECONDS: '6'
  ESPN_CONTEXT_MATCH_LIMIT: '16'
  ESPN_MAX_MATCHES: '40'
  ESPN_SLUGS_PER_RUN_LIMIT: '6'
  ESPN_SOCCER_LEAGUES: 'eng.1,esp.1,ita.1,ger.1,fra.1,uefa.champions,uefa.europa,uefa.europa.conf'
  ESPN_INJURY_OUT_WEIGHT: '1.0'
  ESPN_INJURY_DOUBTFUL_WEIGHT: '0.35'
  ESPN_INJURY_QUESTIONABLE_WEIGHT: '0.25'
  ESPN_INJURY_SUSPENSION_WEIGHT: '1.0'
  ESPN_NEWS_ABSENCE_PENALTY_PER_POINT: '0.06'

  ENABLE_THESPORTSDB_CONTEXT: 'true'
  THESPORTSDB_MAX_LEAGUES: '18'
  THESPORTSDB_CONTEXT_MATCH_LIMIT: '120'
  THESPORTSDB_TIMEOUT_SECONDS: '8'
  THESPORTSDB_TEAM_ALIAS_RELAXED: 'false'

  ENABLE_FOOTBALL_DATA_CONTEXT: 'true'
  FOOTBALL_DATA_TIMEOUT_SECONDS: '12'
  FOOTBALL_DATA_MATCH_LIMIT: '120'
  FOOTBALL_DATA_CONTEXT_MATCH_LIMIT: '120'
  FOOTBALL_DATA_STANDINGS_LIMIT: '12'
  FOOTBALL_DATA_DAYS_AHEAD: '3'

  API_FOOTBALL_PREDICTIONS_LIMIT: '10'
  API_FOOTBALL_CONTEXT_MATCH_LIMIT: '28'

  ENABLE_OPENFOOTBALL_CONTEXT: 'false'
  OPENFOOTBALL_CONTEXT_MATCH_LIMIT: '0'

  ENABLE_NEWSAPI_CONTEXT: 'false'
  NEWSAPI_CONTEXT_MATCH_LIMIT: '0'
  NEWSAPI_MATCH_LIMIT: '0'
  NEWSAPI_ARTICLES_PER_MATCH: '0'
  NEWSAPI_LOOKBACK_HOURS: '24'

  ENABLE_GNEWS_CONTEXT: 'true'
  GNEWS_TIMEOUT_SECONDS: '8'
  GNEWS_CONTEXT_MATCH_LIMIT: '2'
  GNEWS_MATCH_LIMIT: '2'
  GNEWS_ARTICLES_PER_MATCH: '2'
  GNEWS_LOOKBACK_HOURS: '24'

  MATCH_BOOTSTRAP_PROVIDER: 'odds_api_io'
  PUBLISH_WINDOW_HOURS: '24'
  MIN_KICKOFF_LEAD_MINUTES: '45'
  MAX_MATCHES_FOR_ODDS_FETCH: '48'
  MAX_PICKS_PER_FAMILY: '2'
  MAX_PICKS_PER_LEAGUE: '2'
  MAX_SAME_REASON_SIGNATURE: '1'
  ALLOW_LOW_TIER: 'false'
  ALLOW_SINGLE_SHARP_BOOK: 'false'
  BOOKMAKER_ALIAS_RELAXED: 'false'
  CONSENSUS_ALIAS_GROUPS: ''
  MIN_SOURCES_PUBLISH: '1'
  MIN_MODEL_CONFIDENCE: '0.70'
  LINE_SUPPORT_TOLERANCE: '0.04'
  REJECT_NEGATIVE_EXPECTED_GOALS: 'true'
  MIN_EXPECTED_GOALS_VALUE: '0.35'
  MAX_EXPECTED_GOALS_VALUE: '4.8'

  H2H_MIN_BOOKS: '2'
  H2H_MIN_EDGE_PCT: '6'
  H2H_MIN_EV_PCT: '3'
  H2H_MIN_MODEL_CONFIDENCE: '0.70'
  H2H_SINGLE_SOURCE_MIN_CONFIDENCE: '0.76'
  H2H_SINGLE_SOURCE_MIN_EDGE_PCT: '9'
  H2H_SINGLE_SOURCE_MIN_EV_PCT: '5'
  H2H_XG_DISLOCATION_GUARD_ENABLED: 'true'
  H2H_XG_DISLOCATION_MARKET_MAX_PROB: '0.62'
  H2H_XG_DISLOCATION_MIN_CONFIDENCE: '0.74'
  H2H_XG_DISLOCATION_MIN_DIFF: '0.60'
  H2H_XG_DISLOCATION_MIN_SOURCES: '2'

  TOTALS_MIN_BOOKS: '2'
  TOTALS_MIN_EDGE_PCT: '7'
  TOTALS_MIN_EV_PCT: '4'
  TOTALS_MIN_MODEL_CONFIDENCE: '0.73'

  TEAM_TOTALS_MIN_BOOKS: '2'
  TEAM_TOTALS_MIN_EDGE_PCT: '7'
  TEAM_TOTALS_MIN_EV_PCT: '4'
  TEAM_TOTALS_MIN_MODEL_CONFIDENCE: '0.74'

  BTTS_MIN_BOOKS: '2'
  BTTS_MIN_EDGE_PCT: '7'
  BTTS_MIN_EV_PCT: '4'
  BTTS_MIN_MODEL_CONFIDENCE: '0.74'

  SINGLE_SHARP_MIN_CONFIDENCE: '0.80'
  SINGLE_SHARP_MIN_EDGE_PCT: '10'

  MIN_PUBLICATION_SCORE: '13.5'
  MIN_PUBLICATION_SCORE_OTHER_LEAGUE: '21.0'
  MIN_PUBLICATION_SCORE_LOW_TIER: '24.0'
  NON_CORE_LEAGUE_MIN_BOOKS: '2'
  NON_CORE_LEAGUE_MIN_CONFIDENCE: '70.0'
  NON_CORE_LEAGUE_MIN_EDGE_PCT: '9.0'
  NON_CORE_LEAGUE_MIN_EV_PCT: '5.5'
  NON_CORE_LEAGUE_REQUIRE_CORE_CONTEXT: 'true'
  SUPPORTED_TOTAL_LINES: '1.5,1.75,2.0,2.25,2.5,2.75,3.0,3.25,3.5,3.75,4.0'
  SUPPORTED_TEAM_TOTAL_LINES: '0.5,0.75,1.0,1.25,1.5,1.75,2.0,2.25,2.5,2.75,3.0'

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Smoke import check
        run: |
          python -c "import app.cli; import app.services.runner; import app.services.model; import app.services.market_monitor; import app.providers.odds_api_io; import app.providers.football_data; import app.providers.openfootball; import app.providers.newsapi; import app.providers.gnews"

      - name: Compile key modules
        run: |
          python -m py_compile \
            app/config.py \
            app/schemas.py \
            app/providers/odds_api_io.py \
            app/providers/football_data.py \
            app/providers/openfootball.py \
            app/providers/newsapi.py \
            app/providers/gnews.py \
            app/services/runner.py \
            app/services/model.py \
            app/services/market_monitor.py

      - name: Prepare local state folders
        run: mkdir -p .data .data/exports

      - name: Reset state for manual republish
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.reset_state }}
        run: rm -f .data/state.json

      - name: Run bot once
        run: python -m app.cli run-once

      - name: Upload latest debug artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bot-debug-${{ github.run_id }}
          path: |
            .data/debug-last-run.json
            .data/exports/latest-matches.json
            .data/exports/latest-matches.csv
            .data/exports/latest-picks.json
            .data/exports/latest-picks.csv
          if-no-files-found: ignore
          retention-days: 7

      - name: Commit updated bot state
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add .data/state.json .data/debug-last-run.json .data/exports || true
          git diff --cached --quiet && exit 0
          git commit -m "Update bot state"
          git push
