name: Run bot

on:
  workflow_dispatch:
    inputs:
      reset_state:
        description: Delete .data/state.json before this manual run
        required: false
        default: false
        type: boolean
      late_manual_mode:
        description: Allow very late manual runs with a smaller kickoff lead window
        required: false
        default: true
        type: boolean
  schedule:
    # 06:00, 08:00, 10:00, 12:00, 14:00, 16:00, 18:00, 20:00 MSK
    - cron: '0 3,5,7,9,11,13,15,17 * * *'
    # 22:00 MSK daily report / nightly review
    - cron: '0 19 * * *'

permissions:
  contents: write

concurrency:
  group: run-bot-${{ github.event.schedule || github.event_name }}
  cancel-in-progress: true

env:
  TZ: Europe/Moscow
  APP_TIMEZONE: Europe/Moscow
  TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
  TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
  SHEET_ID: ${{ secrets.SHEET_ID }}
  PUBLISH_DRY_RUN: 'false'
  PREDICTION_PUBLICATION_ENABLED: ${{ github.event_name == 'schedule' && github.event.schedule == '0 19 * * *' && 'false' || 'true' }}
  RUN_REPORT_ENABLED: ${{ github.event_name == 'schedule' && github.event.schedule == '0 19 * * *' && 'false' || 'true' }}

  ODDS_API_IO_KEY: ${{ secrets.ODDS_API_IO_KEY }}
  ODDSPAPI_API_KEY: ${{ secrets.ODDSPAPI_API_KEY }}
  ALLSPORTSAPI_API_KEY: ${{ secrets.ALLSPORTSAPI_API_KEY }}
  FUTRIXMETRICS_API_KEY: ${{ secrets.FUTRIXMETRICS_API_KEY }}
  SSTATS_API_KEY: ${{ secrets.SSTATS_API_KEY }}
  BZZOIRO_API_KEY: ${{ secrets.BZZOIRO_API_KEY }}
  API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
  FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
  THESPORTSDB_API_KEY: ${{ secrets.THESPORTSDB_API_KEY }}
  NEWSAPI_KEY: ${{ secrets.NEWSAPI_KEY }}
  GNEWS_KEY: ${{ secrets.GNEWS_KEY }}

  MATCH_BOOTSTRAP_PROVIDER: 'odds_api_io'
  PUBLISH_WINDOW_HOURS: '12'
  MIN_KICKOFF_LEAD_MINUTES: '30'
  MANUAL_LATE_MODE_ENABLED: ${{ github.event_name == 'workflow_dispatch' && inputs.late_manual_mode && 'true' || 'false' }}
  MAX_PICKS_PER_RUN: '2'
  MIN_BOOKS_PUBLISH: '2'
  MIN_SOURCES_PUBLISH: '2'
  MIN_WEIGHTED_BOOKS_FOR_CONSENSUS: '1.05'

  TARGET_BOOKMAKERS: 'Bet365,Unibet'
  CONSENSUS_BOOKMAKERS: 'Bet365,Unibet'
  SHARP_BOOKMAKERS: 'Bet365,Unibet'
  ODDS_API_IO_BOOKMAKERS: 'Bet365,Unibet'
  ODDSPAPI_BOOKMAKERS: 'bet365,unibet'
  ALLSPORTSAPI_BOOKMAKERS: 'Bet365,Unibet'

  ODDS_API_IO_ENABLED: 'true'
  ODDSPAPI_ENABLED: 'true'
  ALLSPORTSAPI_ENABLED: 'true'
  FUTRIXMETRICS_ENABLED: 'true'
  BOOKIES_API_ENABLED: 'false'
  ENABLE_BZZOIRO_CONTEXT: 'true'
  ENABLE_ESPN_CONTEXT: 'true'
  ENABLE_THESPORTSDB_CONTEXT: 'true'
  ENABLE_FOOTBALL_DATA_CONTEXT: 'true'
  ENABLE_OPENLIGADB_CONTEXT: 'true'
  API_FOOTBALL_ENABLED: 'true'
  ENABLE_OPENFOOTBALL_CONTEXT: 'true'
  ENABLE_NEWSAPI_CONTEXT: 'true'
  ENABLE_GNEWS_CONTEXT: 'true'
  ENABLE_PROVIDER_DIAGNOSTICS: 'true'

  ENABLE_CONTEXT_STAGING: 'true'
  CONTEXT_ENRICHMENT_REQUIRES_OFFERS: 'false'
  CONTEXT_ENRICHMENT_MATCH_LIMIT: '220'
  PREMIUM_CONTEXT_SHORTLIST_LIMIT: '24'
  PREMIUM_NEWS_SHORTLIST_LIMIT: '4'

  BZZOIRO_CONTEXT_MATCH_LIMIT: '220'
  ESPN_CONTEXT_MATCH_LIMIT: '160'
  THESPORTSDB_CONTEXT_MATCH_LIMIT: '220'
  FOOTBALL_DATA_CONTEXT_MATCH_LIMIT: '220'
  OPENFOOTBALL_CONTEXT_MATCH_LIMIT: '240'
  OPENLIGADB_CONTEXT_MATCH_LIMIT: '140'
  API_FOOTBALL_CONTEXT_MATCH_LIMIT: '24'
  API_FOOTBALL_PREDICTIONS_LIMIT: '14'
  FUTRIXMETRICS_CONTEXT_MATCH_LIMIT: '8'
  NEWSAPI_CONTEXT_MATCH_LIMIT: '10'
  GNEWS_CONTEXT_MATCH_LIMIT: '8'

  ODDSPAPI_MIN_FETCH_INTERVAL_MINUTES: '240'
  ODDSPAPI_MATCH_LIMIT: '10'
  ODDSPAPI_TOURNAMENT_LIMIT: '4'
  ALLSPORTSAPI_MIN_FETCH_INTERVAL_MINUTES: '240'
  ALLSPORTSAPI_MATCH_LIMIT: '14'

  DAILY_COVERAGE_CACHE_ENABLED: 'true'
  DAILY_COVERAGE_CACHE_PATH: '.data/provider_cache/daily-coverage'
  DAILY_COVERAGE_MATCH_TTL_MINUTES: '120'
  DAILY_COVERAGE_OFFERS_TTL_MINUTES: '75'
  DAILY_COVERAGE_BACKUP_OFFERS_TTL_MINUTES: '240'
  DAILY_COVERAGE_CONTEXT_TTL_MINUTES: '360'
  DAILY_COVERAGE_PREMIUM_CONTEXT_TTL_MINUTES: '300'
  DAILY_COVERAGE_NEWS_CONTEXT_TTL_MINUTES: '120'
  DAILY_COVERAGE_EMPTY_MATCHES_TTL_MINUTES: '60'
  DAILY_COVERAGE_EMPTY_OFFERS_TTL_MINUTES: '90'
  DAILY_COVERAGE_EMPTY_CONTEXT_TTL_MINUTES: '180'

  NON_CORE_LEAGUE_MIN_BOOKS: '2'
  NON_CORE_LEAGUE_REQUIRE_CORE_CONTEXT: 'true'
  QUALITY_LAYER_ENABLED: 'true'
  CLV_QUALITY_GUARD_ENABLED: 'true'
  HISTORICAL_SEGMENT_GUARD_ENABLED: 'true'
  QUALITY_HIGH_ODDS_GUARD_ENABLED: 'true'
  NO_BET_QUALITY_SCORE_ENABLED: 'true'
  MIN_QUALITY_SCORE_PUBLISH: '60'
  DIXON_COLES_ENABLED: 'true'

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Smoke import check
        run: |
          python -c "from app.config import Settings; Settings(); import app.cli; import app.services.runner; import app.providers.odds_api_io; import app.providers.oddspapi; import app.providers.allsportsapi; import app.providers.api_football"

      - name: Compile key modules
        run: |
          python -m py_compile             app/__init__.py             app/runtime_bot_fix.py             app/cli.py             app/config.py             app/schemas.py             app/state.py             app/services/runner.py

      - name: Prepare local state folders
        run: mkdir -p .data .data/exports .data/provider_cache/daily-coverage

      - name: Reset state for manual republish
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.reset_state }}
        run: rm -f .data/state.json

      - name: Run bot once
        run: python -m app.cli run-once

      - name: Smoke offline reporting commands
        run: |
          python -m app.cli coverage-audit
          python -m app.cli training-dataset
          python -m app.cli reporting-sqlite

      - name: Upload latest debug artifacts
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: bot-debug-${{ github.run_id }}
          path: |
            .data/debug-last-run.json
            .data/exports/latest-matches.json
            .data/exports/latest-picks.json
            .data/exports/latest-bets.json
            .data/provider_cache/daily-coverage
          if-no-files-found: ignore
          retention-days: 7

      - name: Commit updated bot state
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A .data
          git diff --cached --quiet && exit 0
          git commit -m "Update bot state"
          git push
