name: Run bot

on:
  workflow_dispatch:
    inputs:
      reset_state:
        description: Delete .data/state.json before this manual run
        required: false
        default: false
        type: boolean
  schedule:
    - cron: '*/30 * * * *'

permissions:
  contents: write

concurrency:
  group: run-bot
  cancel-in-progress: false

env:
  TZ: Europe/Moscow
  APP_TIMEZONE: Europe/Moscow
  TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
  TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
  SHEET_ID: ${{ secrets.SHEET_ID }}
  PUBLISH_DRY_RUN: 'false'

  ODDS_API_IO_ENABLED: 'true'
  ODDS_API_IO_BOOTSTRAP_ENABLED: 'true'
  ODDS_API_IO_KEY: ${{ secrets.ODDS_API_IO_KEY }}
  ODDS_API_IO_BOOKMAKERS: 'Bet365,Unibet'
  TARGET_BOOKMAKERS: 'Bet365,Unibet'
  CONSENSUS_BOOKMAKERS: 'Bet365,Unibet'
  SHARP_BOOKMAKERS: 'Bet365,Unibet'
  MIN_WEIGHTED_BOOKS_FOR_CONSENSUS: '1.35'
  MIN_BOOKS_PUBLISH: '1'

  BOOKIES_API_ENABLED: 'false'
  BOOKIES_API_USE_FOR_BACKFILL_ONLY: 'true'
  BOOKIES_API_BASE_URL: ${{ secrets.BOOKIES_API_BASE_URL }}
  BOOKIES_API_KEY: ${{ secrets.BOOKIES_API_KEY }}
  BOOKIES_API_LOGIN: ${{ secrets.BOOKIES_API_LOGIN }}
  BOOKIES_API_TOKEN: ${{ secrets.BOOKIES_API_TOKEN }}
  BOOKIES_API_ODDS_FETCH_LIMIT: '0'
  BOOKIES_API_ODDS_TASK: ${{ secrets.BOOKIES_API_ODDS_TASK }}

  SSTATS_API_KEY: ${{ secrets.SSTATS_API_KEY }}
  BZZOIRO_API_KEY: ${{ secrets.BZZOIRO_API_KEY }}
  API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
  FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
  THESPORTSDB_API_KEY: ${{ secrets.THESPORTSDB_API_KEY }}
  NEWSAPI_KEY: ${{ secrets.NEWSAPI_KEY }}
  GNEWS_KEY: ${{ secrets.GNEWS_KEY }}

  ENABLE_PROVIDER_DIAGNOSTICS: 'true'
  DIAGNOSTICS_MATCH_LIMIT: '100'

  ENABLE_ESPN_CONTEXT: 'false'
  ESPN_ENABLE_NEWS_CONTEXT: 'false'
  ESPN_TIMEOUT_SECONDS: '6'
  ESPN_CONTEXT_MATCH_LIMIT: '0'
  ESPN_MAX_MATCHES: '0'
  ESPN_SLUGS_PER_RUN_LIMIT: '0'
  ESPN_SOCCER_LEAGUES: 'eng.1,esp.1,ita.1,ger.1,fra.1,uefa.champions,uefa.europa,uefa.europa.conf'
  ESPN_INJURY_OUT_WEIGHT: '1.0'
  ESPN_INJURY_DOUBTFUL_WEIGHT: '0.35'
  ESPN_INJURY_QUESTIONABLE_WEIGHT: '0.25'
  ESPN_INJURY_SUSPENSION_WEIGHT: '1.0'
  ESPN_NEWS_ABSENCE_PENALTY_PER_POINT: '0.06'

  ENABLE_THESPORTSDB_CONTEXT: 'true'
  THESPORTSDB_MAX_LEAGUES: '18'
  THESPORTSDB_CONTEXT_MATCH_LIMIT: '120'
  THESPORTSDB_TIMEOUT_SECONDS: '8'
  THESPORTSDB_TEAM_ALIAS_RELAXED: 'false'

  ENABLE_FOOTBALL_DATA_CONTEXT: 'true'
  FOOTBALL_DATA_TIMEOUT_SECONDS: '12'
  FOOTBALL_DATA_MATCH_LIMIT: '160'
  FOOTBALL_DATA_CONTEXT_MATCH_LIMIT: '160'
  FOOTBALL_DATA_STANDINGS_LIMIT: '20'
  FOOTBALL_DATA_DAYS_AHEAD: '4'
  FOOTBALL_DATA_HISTORY_COMPETITIONS_LIMIT: '16'
  FOOTBALL_DATA_COMPETITION_MATCH_LIMIT: '260'
  FOOTBALL_DATA_MIN_TEAM_HISTORY_MATCHES: '1'
  FOOTBALL_DATA_ALLOW_CUP_STANDINGS: 'true'
  FOOTBALL_DATA_MATCH_SCORE_THRESHOLD: '40'
  FOOTBALL_DATA_TEAM_MATCH_THRESHOLD: '0.66'

  API_FOOTBALL_ENABLED: 'false'
  API_FOOTBALL_PREDICTIONS_LIMIT: '0'
  API_FOOTBALL_FETCH_MATCH_DATES_ONLY: 'true'
  API_FOOTBALL_FREE_DAYS_AHEAD: '1'
  API_FOOTBALL_CONTEXT_MATCH_LIMIT: '0'

  ENABLE_OPENFOOTBALL_CONTEXT: 'false'
  OPENFOOTBALL_CONTEXT_MATCH_LIMIT: '0'

  ENABLE_NEWSAPI_CONTEXT: 'false'
  NEWSAPI_CONTEXT_MATCH_LIMIT: '0'
  NEWSAPI_MATCH_LIMIT: '0'
  NEWSAPI_ARTICLES_PER_MATCH: '0'
  NEWSAPI_LOOKBACK_HOURS: '24'

  ENABLE_GNEWS_CONTEXT: 'false'
  ENABLE_CONTEXT_STAGING: 'true'
  PREMIUM_CONTEXT_SHORTLIST_LIMIT: '14'
  PREMIUM_NEWS_SHORTLIST_LIMIT: '0'
  VALUE_HINT_MIN_EDGE_PCT: '1.25'
  DETAILED_TELEGRAM_WRITEUP: 'true'
  TELEGRAM_WRITEUP_MAX_POINTS: '4'
  GNEWS_TIMEOUT_SECONDS: '8'
  GNEWS_CONTEXT_MATCH_LIMIT: '2'
  GNEWS_MATCH_LIMIT: '2'
  GNEWS_ARTICLES_PER_MATCH: '2'
  GNEWS_LOOKBACK_HOURS: '24'

  MATCH_BOOTSTRAP_PROVIDER: 'odds_api_io'
  PUBLISH_WINDOW_HOURS: '24'
  MIN_KICKOFF_LEAD_MINUTES: '45'
  MAX_MATCHES_FOR_ODDS_FETCH: '48'
  MAX_PICKS_PER_FAMILY: '2'
  MAX_PICKS_PER_LEAGUE: '2'
  MAX_SAME_REASON_SIGNATURE: '2'
  ALLOW_LOW_TIER: 'false'
  ALLOW_SINGLE_SHARP_BOOK: 'true'
  BOOKMAKER_ALIAS_RELAXED: 'false'
  CONSENSUS_ALIAS_GROUPS: ''
  MIN_SOURCES_PUBLISH: '1'
  MIN_MODEL_CONFIDENCE: '0.64'
  SIMPLE_MARKET_TOTALS_MIN_CONFIDENCE: '55'
  SIMPLE_MARKET_H2H_MIN_CONFIDENCE: '60'
  SIMPLE_MARKET_TOTALS_MIN_EV_PCT: '2.0'
  SIMPLE_MARKET_TOTALS_MIN_EDGE_PCT: '2.4'
  SIMPLE_MARKET_H2H_MIN_EV_PCT: '3.0'
  SIMPLE_MARKET_H2H_MIN_EDGE_PCT: '3.8'
  LINE_SUPPORT_TOLERANCE: '0.10'
  SIMPLE_MARKET_MIN_SIGNAL_BOOST_PCT: '0.35'
  MAX_CONSENSUS_DISPERSION_PCT: '12.0'
  REJECT_NEGATIVE_EXPECTED_GOALS: 'true'
  MIN_EXPECTED_GOALS_VALUE: '0.35'
  MAX_EXPECTED_GOALS_VALUE: '4.8'

  H2H_MIN_BOOKS: '1'
  H2H_MIN_EDGE_PCT: '6'
  H2H_MIN_EV_PCT: '3'
  H2H_MIN_MODEL_CONFIDENCE: '0.68'
  H2H_SINGLE_SOURCE_MIN_CONFIDENCE: '0.72'
  H2H_SINGLE_SOURCE_MIN_EDGE_PCT: '7.0'
  H2H_SINGLE_SOURCE_MIN_EV_PCT: '3.6'
  H2H_XG_DISLOCATION_GUARD_ENABLED: 'true'
  H2H_XG_DISLOCATION_MARKET_MAX_PROB: '0.62'
  H2H_XG_DISLOCATION_MIN_CONFIDENCE: '0.74'
  H2H_XG_DISLOCATION_MIN_DIFF: '0.60'
  H2H_XG_DISLOCATION_MIN_SOURCES: '2'

  TOTALS_MIN_BOOKS: '1'
  TOTALS_MIN_EDGE_PCT: '7'
  TOTALS_MIN_EV_PCT: '4'
  TOTALS_MIN_MODEL_CONFIDENCE: '0.67'

  TEAM_TOTALS_MIN_BOOKS: '1'
  TEAM_TOTALS_MIN_EDGE_PCT: '7'
  TEAM_TOTALS_MIN_EV_PCT: '4'
  TEAM_TOTALS_MIN_MODEL_CONFIDENCE: '0.68'

  BTTS_MIN_BOOKS: '1'
  BTTS_MIN_EDGE_PCT: '7'
  BTTS_MIN_EV_PCT: '4'
  BTTS_MIN_MODEL_CONFIDENCE: '0.68'

  SINGLE_SHARP_MIN_CONFIDENCE: '0.74'
  SINGLE_SHARP_MIN_EDGE_PCT: '7.6'
  FALLBACK_PUBLISH_MODE_ENABLED: 'false'
  MIN_PUBLICATION_SCORE: '11.0'
  MIN_PUBLICATION_SCORE_SECONDARY_LEAGUE: '13.5'
  MIN_PUBLICATION_SCORE_OTHER_LEAGUE: '16.5'
  MIN_PUBLICATION_SCORE_LOW_TIER: '22.0'
  NON_CORE_LEAGUE_MIN_BOOKS: '2'
  NON_CORE_LEAGUE_MIN_CONFIDENCE: '65.0'
  NON_CORE_LEAGUE_MIN_EDGE_PCT: '6.0'
  NON_CORE_LEAGUE_MIN_EV_PCT: '3.6'
  NON_CORE_LEAGUE_REQUIRE_CORE_CONTEXT: 'false'
  PREFERRED_SINGLE_BOOK_MIN_CONFIDENCE: '71'
  PREFERRED_SINGLE_BOOK_MIN_EDGE_PCT: '6.5'
  PREFERRED_SINGLE_BOOK_MIN_EV_PCT: '3.6'
  PREFERRED_SINGLE_BOOK_MIN_PUBLICATION_SCORE: '13.5'
  SECONDARY_SINGLE_BOOK_MIN_CONFIDENCE: '73'
  SECONDARY_SINGLE_BOOK_MIN_EDGE_PCT: '7.2'
  SECONDARY_SINGLE_BOOK_MIN_EV_PCT: '4.0'
  SECONDARY_SINGLE_BOOK_MIN_PUBLICATION_SCORE: '15.5'
  TOTALS_OVER25_DUAL_THREAT_GUARD_ENABLED: 'true'
  TOTALS_OVER25_MIN_WEAKER_SIDE_XG: '0.58'
  TOTALS_OVER25_MAX_TEAM_XG_SHARE: '0.82'

  SUPPORTED_TOTAL_LINES: '1.25,1.5,1.75,2.0,2.25,2.5,2.75,3.0,3.25,3.5,3.75,4.0,4.25,4.5,5.0'
  SUPPORTED_TEAM_TOTAL_LINES: '0.25,0.5,0.75,1.0,1.25,1.5,1.75,2.0,2.25,2.5,2.75,3.0,3.25,3.5'

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Smoke import check
        run: |
          python -c "import app.cli; import app.services.runner; import app.services.model; import app.services.market_monitor; import app.providers.odds_api_io; import app.providers.football_data; import app.providers.openfootball; import app.providers.newsapi; import app.providers.gnews"

      - name: Compile key modules
        run: |
          python -m py_compile \
            app/config.py \
            app/schemas.py \
            app/providers/odds_api_io.py \
            app/providers/football_data.py \
            app/providers/openfootball.py \
            app/providers/newsapi.py \
            app/providers/gnews.py \
            app/services/runner.py \
            app/services/model.py \
            app/services/market_monitor.py

      - name: Prepare local state folders
        run: mkdir -p .data .data/exports

      - name: Reset state for manual republish
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.reset_state }}
        run: rm -f .data/state.json

      - name: Run bot once
        run: python -m app.cli run-once

      - name: Upload latest debug artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bot-debug-${{ github.run_id }}
          path: |
            .data/debug-last-run.json
            .data/exports/latest-matches.json
            .data/exports/latest-matches.csv
            .data/exports/latest-picks.json
            .data/exports/latest-picks.csv
          if-no-files-found: ignore
          retention-days: 7

      - name: Commit updated bot state
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add .data/state.json .data/debug-last-run.json .data/exports || true
          git diff --cached --quiet && exit 0
          git commit -m "Update bot state"
          git push
