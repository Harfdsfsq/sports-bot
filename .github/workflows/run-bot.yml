name: run-bot

on:
  workflow_dispatch:
  schedule:
    - cron: '0 8 * * *'
      timezone: 'Europe/Moscow'

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run bot
        env:
          APP_ENV: production
          APP_TIMEZONE: Europe/Moscow
          TZ: Europe/Moscow
          STATE_PATH: .data/state.json
          DEBUG_PATH: .data/debug-last-run.json
          STORAGE_EXPORT_DIR: .data/exports
          PUBLISH_DRY_RUN: ${{ vars.PUBLISH_DRY_RUN || 'false' }}
          RUN_SPORTS: ${{ vars.RUN_SPORTS || 'soccer' }}
          RUN_DAYS_AHEAD: ${{ vars.RUN_DAYS_AHEAD || '4' }}
          PUBLISH_WINDOW_HOURS: ${{ vars.PUBLISH_WINDOW_HOURS || '48' }}
          MIN_KICKOFF_LEAD_MINUTES: ${{ vars.MIN_KICKOFF_LEAD_MINUTES || '30' }}
          TARGET_BOOKMAKERS: ${{ vars.TARGET_BOOKMAKERS || 'Bet365,Unibet' }}
          CONSENSUS_BOOKMAKERS: ${{ vars.CONSENSUS_BOOKMAKERS || 'Bet365,Unibet' }}
          MIN_BOOKS_PUBLISH: ${{ vars.MIN_BOOKS_PUBLISH || '3' }}
          MIN_SOURCES_PUBLISH: ${{ vars.MIN_SOURCES_PUBLISH || '1' }}
          MIN_MODEL_CONFIDENCE: ${{ vars.MIN_MODEL_CONFIDENCE || '58' }}
          MAX_MATCHES_FOR_ODDS_FETCH: ${{ vars.MAX_MATCHES_FOR_ODDS_FETCH || '300' }}
          ALLOW_LOW_TIER: ${{ vars.ALLOW_LOW_TIER || 'false' }}
          BOOKIES_API_ENABLED: ${{ vars.BOOKIES_API_ENABLED || 'true' }}
          BOOKIES_API_BASE_URL: ${{ secrets.BOOKIES_API_BASE_URL }}
          BOOKIES_API_LOGIN: ${{ secrets.BOOKIES_API_LOGIN }}
          BOOKIES_API_KEY: ${{ secrets.BOOKIES_API_KEY }}
          BOOKIES_API_TOKEN: ${{ secrets.BOOKIES_API_TOKEN }}
          BOOKIES_API_USE_FOR_BACKFILL_ONLY: ${{ vars.BOOKIES_API_USE_FOR_BACKFILL_ONLY || 'false' }}
          BOOKIES_API_ODDS_TASK: ${{ vars.BOOKIES_API_ODDS_TASK || 'odds' }}
          BOOKIES_API_ODDS_FETCH_LIMIT: ${{ vars.BOOKIES_API_ODDS_FETCH_LIMIT || '40' }}
          ODDS_API_IO_KEY: ${{ secrets.ODDS_API_IO_KEY }}
          SSTATS_API_KEY: ${{ secrets.SSTATS_API_KEY }}
          BZZOIRO_API_KEY: ${{ secrets.BZZOIRO_API_KEY }}
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          API_FOOTBALL_PREDICTIONS_LIMIT: ${{ vars.API_FOOTBALL_PREDICTIONS_LIMIT || '4' }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          mkdir -p .data .data/exports
          python -m app.cli run-once

      - name: Commit state and exports
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -A .data || true
          git diff --cached --quiet && exit 0
          git commit -m "Update bot state"
          git push
