name: run-bot

on:
  schedule:
    - cron: "0 1-23/2 * * *" # Every 2 hours in Europe/Moscow.
  workflow_dispatch:
    inputs:
      mode:
        description: "Run mode"
        required: true
        default: "normal"

permissions:
  contents: write

concurrency:
  group: run-bot
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      PYTHONUNBUFFERED: "1"
      PYTHONPATH: ${{ github.workspace }}
      TZ: Europe/Moscow
      APP_TIMEZONE: Europe/Moscow
      APP_ENV: production
      RUN_MODE: ${{ github.event.inputs.mode || 'normal' }}
      PUBLISH_DRY_RUN: "false"
      PUBLISH_ALLOW_B_TIER: "true"
      PUBLISH_COVERAGE_TIER_MODE: "hybrid"
      MIN_BOOKS_PUBLISH: "2"
      PUBLISH_MIN_BOOKS: "2"
      PUBLISH_TIER_A_MIN_ODDS_SOURCES: "2"
      PUBLISH_TIER_A_MIN_BOOKS: "2"
      PUBLISH_TIER_A_MIN_CONTEXT_SOURCES: "2"
      PUBLISH_TIER_B_MIN_ODDS_SOURCES: "2"
      PUBLISH_TIER_B_MIN_BOOKS: "2"
      PUBLISH_TIER_B_MIN_CONTEXT_SOURCES: "2"
      MIN_SOURCES_PUBLISH: "2"
      PREDICTION_PUBLICATION_ENABLED: "true"
      REPUBLISH_SEEN_CANDIDATES_WHEN_EMPTY: "false"
      SEEN_CANDIDATE_LOOKBACK_HOURS: "96"
      RUN_REPORT_ENABLED: "false"
      ENHANCED_RUN_REPORT_SEND_TELEGRAM: "true"
      TELEGRAM_MESSAGE_SOFT_LIMIT: "3600"
      MANUAL_CONTROLLED_PUBLISH_ENABLED: "false"

      DAY_INVENTORY_PRESERVE_CACHED_EVIDENCE: "true"
      CORE_PROVIDER_INVENTORY_BRIDGE_ENABLED: "true"
      DAY_INVENTORY_TARGET_SIZE: "300"
      DAY_INVENTORY_MAX_MATCHES: "300"
      DAY_INVENTORY_FORCE_TOP_300: "true"
      DAY_INVENTORY_FORCE_FULL_300: "true"
      DAY_INVENTORY_FORCE_PROVIDER_MERGE: "true"
      DAY_INVENTORY_CONTEXT_BACKFILL_ENABLED: "true"
      DAY_INVENTORY_ENABLE_BZZOIRO: "true"
      DAY_INVENTORY_ENABLE_SSTATS: "true"
      DAY_INVENTORY_ENABLE_SPORTLOGIC: "false"
      DAY_INVENTORY_ENABLE_ALLSPORTSAPI: "false"
      DAY_INVENTORY_TOP_MATCHES_ENABLED: "true"
      DAY_INVENTORY_ODDS_API_IO_TARGET_MATCHES: "220"
      DAY_INVENTORY_MULTI_SOURCE_MAX_MATCHES: "220"
      DAY_INVENTORY_SSTATS_TOTAL_HARD_CAP: "300"
      DAY_INVENTORY_FORCE_FULL_ALLOW_SSTATS_OVER_HARD_CAP: "true"
      DAY_INVENTORY_BZZOIRO_MAX_REQUESTS: "200"
      DAY_INVENTORY_BZZOIRO_MAX_PAGES: "20"
      DAY_INVENTORY_SSTATS_MAX_REQUESTS: "150"
      DAY_INVENTORY_SPORTLOGIC_MATCH_LIMIT: "0"
      DAY_INVENTORY_SPORTLOGIC_MAX_REQUESTS: "0"

      MARKET_FAMILY_PUBLICATION_GUARD_ENABLED: "true"
      PUBLICATION_ALLOWED_MARKET_FAMILIES: "totals,spreads"
      HARIZON_ALLOWED_PUBLICATION_FAMILIES: "totals,spreads"
      CONTROLLED_FALLBACK_ALLOWED_FAMILIES: "totals,spreads"
      CONTROLLED_RESCUE_ALLOWED_FAMILIES: "totals,spreads"
      H2H_PUBLICATION_ENABLED: "false"
      BTTS_PUBLICATION_ENABLED: "false"
      DNB_PUBLICATION_ENABLED: "false"
      DOUBLE_CHANCE_PUBLICATION_ENABLED: "false"
      TEAM_TOTALS_PUBLICATION_ENABLED: "false"
      TOTALS_PUBLICATION_ENABLED: "true"
      SPREADS_PUBLICATION_ENABLED: "true"
      PUBLISH_MIN_ODDS_SOURCES: "2"
      PUBLISH_MIN_CONTEXT_SOURCES: "2"
      MIN_CONTEXT_SOURCES_PUBLISH: "2"
      CONTROLLED_FALLBACK_MIN_ODDS_SOURCES: "2"
      CONTROLLED_FALLBACK_MIN_CONTEXT_SOURCES: "2"
      CONTROLLED_FALLBACK_MIN_CONFIRMATION_SOURCES: "2"
      CONTROLLED_FALLBACK_TIER_A_REQUIRE_2_ODDS_SOURCES: "true"
      CONTROLLED_FALLBACK_TIER_A_MIN_ODDS_SOURCES: "2"
      CONTROLLED_FALLBACK_TIER_A_MIN_BOOKS: "2"
      CONTROLLED_FALLBACK_TIER_A_MIN_CONTEXT_SOURCES: "2"
      CONTROLLED_FALLBACK_TIER_B_REQUIRE_ODDS_SOURCES: "true"
      CONTROLLED_FALLBACK_TIER_B_REQUIRE_INDEPENDENT_SOURCES: "true"
      CONTROLLED_FALLBACK_TIER_B_MIN_ODDS_SOURCES: "2"
      CONTROLLED_FALLBACK_TIER_B_MIN_BOOKS: "2"
      CONTROLLED_FALLBACK_TIER_B_MIN_CONTEXT_SOURCES: "2"
      CONTROLLED_FALLBACK_TIER_B_MIN_CONFIRMATION_SOURCES: "2"
      CONTROLLED_FALLBACK_TIER_B_BOOKMAKER_QUORUM_PRICE_GUARD: "true"
      CONTROLLED_FALLBACK_TIER_B_REQUIRE_2_BOOKS_FOR_TELEGRAM: "true"
      CONTROLLED_FALLBACK_REQUIRE_TOTALS_SANITY_FOR_TELEGRAM: "true"
      CONTROLLED_FALLBACK_REQUIRE_2_BOOKS_FOR_TELEGRAM: "true"
      CONTROLLED_FALLBACK_REQUIRE_INDEPENDENT_SOURCES: "true"
      CONTROLLED_FALLBACK_REQUIRE_2_ODDS_SOURCES_FOR_TELEGRAM: "true"
      CONTROLLED_FALLBACK_REQUIRE_2_CONTEXT_SOURCES_FOR_TELEGRAM: "true"
      CONTROLLED_FALLBACK_TELEGRAM_MIN_QUALITY: "70"
      CONTROLLED_FALLBACK_TELEGRAM_ALLOW_TIER_B: "true"
      CONTROLLED_FALLBACK_TELEGRAM_ALLOW_TIER_C: "false"
      CONTROLLED_FALLBACK_REQUIRE_FINAL_CRON_RECHECK: "true"
      CONTROLLED_FALLBACK_REQUIRE_LINE_RECHECK: "true"
      CONTROLLED_FALLBACK_STRICT_MATCH_MARKET_DEDUPE: "false"
      CONTROLLED_FALLBACK_MIN_TOTAL_XG_FOR_SANITY: "0.25"
      CONTROLLED_FALLBACK_MIN_TEAM_XG_FOR_SANITY: "0.03"
      PROMOTE_B_COVER_MIN_TOTAL_XG_FOR_SANITY: "0.25"
      PROMOTE_B_COVER_MIN_TEAM_XG_FOR_SANITY: "0.03"
      CRON_EXPECTED_INTERVAL_MINUTES: "120"
      LINE_MOVEMENT_CRON_INTERVAL_MINUTES: "120"
      LINE_MOVEMENT_CRON_ANCHOR_MINUTE: "0"
      LINE_MOVEMENT_MIN_LEAD_MINUTES: "15"
      ODDS_MOVEMENT_SNAPSHOTS_ENABLED: "true"
      NEWS_INJURY_SHORTLIST_ENABLED: "true"
      NEWS_INJURY_SHORTLIST_LIMIT: "8"
      BZZOIRO_CURRENT_ODDS_AS_SECONDARY_SOURCE: "true"
      SSTATS_ROLLING_METRICS_ENABLED: "true"
      SSTATS_HISTORICAL_ODDS_AS_LINES: "false"
      FALLBACK_PUBLISH_MODE_ENABLED: "false"
      MODEL_RELAXED_FALLBACK_ENABLED: "false"
      FORCE_PUBLISH_WHEN_EMPTY_ENABLED: "false"
      QUALITY_EMERGENCY_PUBLISH_ENABLED: "false"
      QUALITY_LAST_RESORT_PUBLISH_ENABLED: "false"
      HISTORICAL_SEGMENT_RELIEF_ENABLED: "false"

      PROVIDER_FREE_QUOTA_POLICY_ENABLED: "true"
      PROVIDER_QUOTA_GOVERNOR_ENABLED: "true"
      PROVIDER_QUOTA_RUNS_PER_DAY: "12"
      PROVIDER_QUOTA_SAFETY_FACTOR: "0.78"
      PROVIDER_QUOTA_HARD_TIMEOUT_SECONDS: "25"
      PROVIDER_REQUEST_BUDGET_MODE: "per_run_only"
      PROVIDER_REQUEST_BUDGET_DISABLE_DAILY_MONTHLY: "true"
      ALL_SOURCES_FREE_MAXIMIZE: "true"
      PROVIDER_SMOKE_FAIL_ON_ERROR: "false"
      PROVIDER_SMOKE_TIMEOUT_SECONDS: "10"
      API_HEALTH_DURING_RUN_ENABLED: "true"

      ODDS_API_IO_HOURLY_LIMIT: "100"
      ODDS_API_IO_PER_RUN_MAX: "100"
      ODDS_API_IO_ACCOUNT1_PER_RUN_MAX: "50"
      ODDS_API_IO_ACCOUNT2_PER_RUN_MAX: "50"
      ODDS_API_IO_MAX_HTTP_REQUESTS_PER_RUN: "100"
      ODDS_API_IO_MAX_REQUESTS_PER_RUN: "100"
      ODDS_API_IO_REQUEST_BUDGET_GRANTED: "100"
      ODDS_API_IO_REQUESTS_MAX_PER_RUN: "100"
      ODDS_API_IO_MAX_EVENT_PAGES_PER_SPORT: "10"
      ODDS_API_IO_MAX_PAGES_PER_SPORT: "10"
      PRICE_BACKFILL_ODDS_API_IO_BATCHES_PER_ACCOUNT: "5"
      PRICE_BACKFILL_ODDS_API_IO_MAX_EVENT_IDS_PER_REQUEST: "10"
      PRICE_BACKFILL_ODDS_API_IO_EVENT_LIMIT: "100"
      MAX_MATCHES_FOR_ODDS_FETCH: "300"

      BZZOIRO_RATE_LIMIT_PER_MINUTE: "200"
      BZZOIRO_PER_RUN_MAX: "200"
      BZZOIRO_MAX_REQUESTS_PER_RUN: "200"
      BZZOIRO_MAX_HTTP_REQUESTS_PER_RUN: "200"
      BZZOIRO_REQUESTS_MAX_PER_RUN: "200"
      BZZOIRO_REQUEST_BUDGET_GRANTED: "200"
      BZZOIRO_EVENTS_MAX_REQUESTS_PER_RUN: "80"
      BZZOIRO_PREDICTIONS_MAX_REQUESTS_PER_RUN: "40"
      BZZOIRO_PREDICTIONS_MAX_PAGES: "10"
      BZZOIRO_MAX_PAGES: "20"
      BZZOIRO_CONTEXT_MATCH_LIMIT: "300"
      BZZOIRO_PRICE_BACKFILL_ENABLED: "true"
      BZZOIRO_PRICE_BACKFILL_TARGET_LIMIT: "80"

      SSTATS_RATE_LIMIT_PER_MINUTE: "150"
      SSTATS_PER_RUN_MAX: "150"
      SSTATS_MAX_REQUESTS_PER_RUN: "150"
      SSTATS_REQUESTS_MAX_PER_RUN: "150"
      SSTATS_REQUEST_BUDGET_GRANTED: "150"
      SSTATS_MAX_HTTP_REQUESTS_PER_RUN: "150"
      SSTATS_CONTEXT_MATCH_LIMIT: "300"
      SSTATS_DEEP_DETAIL_LIMIT_PER_RUN: "40"
      SSTATS_DEEP_CONTEXT_MATCH_LIMIT: "80"
      SSTATS_DEEP_ENRICHMENT_ENABLED: "true"
      SSTATS_DEEP_ENRICHMENT_AFTER_CROSSWALK: "true"
      SSTATS_DEEP_SMOKE_DETAIL_GAMES: "30"
      SSTATS_GAME_DETAIL_ENABLED: "true"
      SSTATS_LAST_GAMES_STATS_ENABLED: "true"
      SSTATS_INJURIES_ENABLED: "false"
      SSTATS_GLICKO_ENABLED: "true"
      SSTATS_ODDS_RESCUE_ENABLED: "true"

      SPORTLOGIC_DAILY_LIMIT: "500"
      SPORTLOGIC_ENABLED: "false"
      ENABLE_SPORTLOGIC: "false"
      SPORTLOGIC_CONTROLLED_ODDS_ENABLED: "false"
      SPORTLOGIC_PER_RUN_MAX: "0"
      SPORTLOGIC_MAX_HTTP_REQUESTS_PER_RUN: "0"
      SPORTLOGIC_REQUESTS_MAX_PER_RUN: "0"
      SPORTLOGIC_REQUEST_BUDGET_GRANTED: "0"
      SPORTLOGIC_MATCH_LIMIT: "0"
      SPORTLOGIC_CONTEXT_MATCH_LIMIT: "0"
      SPORTLOGIC_ODDS_MATCH_LIMIT: "0"
      SPORTLOGIC_ACTIVE_ODDS_SMOKE_PAGES: "2"
      SPORTLOGIC_ACTIVE_ODDS_SMOKE_GAME_LIMIT: "40"
      SPORTLOGIC_MATCH_MIN_SCORE: "48"

      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN || secrets.TELEGRAM_TOKEN }}
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN || secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      ODDS_API_IO_KEY: ${{ secrets.ODDS_API_IO_KEY }}
      ODDS_API_IO_KEY_2: ${{ secrets.ODDS_API_IO_KEY_2 }}
      ODDS_API_IO_KEY2: ${{ secrets.ODDS_API_IO_KEY2 }}
      BZZOIRO_API_KEY: ${{ secrets.BZZOIRO_API_KEY }}
      SSTATS_API_KEY: ${{ secrets.SSTATS_API_KEY }}
      FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
      THESPORTSDB_API_KEY: ${{ secrets.THESPORTSDB_API_KEY }}
      WEATHERAPI_KEY: ${{ secrets.WEATHERAPI_KEY }}
      WEATHER_API_KEY: ${{ secrets.WEATHERAPI_KEY }}
      WEATHERAPI_API_KEY: ${{ secrets.WEATHERAPI_KEY }}
      ALLSPORTSAPI_API_KEY: ${{ secrets.ALLSPORTSAPI_API_KEY }}
      SPORTLOGIC_API_KEY: ${{ secrets.SPORTLOGIC_API_KEY }}
      SPORTLOGIC_KEY: ${{ secrets.SPORTLOGIC_API_KEY }}
      SPORTLOGIC_TOKEN: ${{ secrets.SPORTLOGIC_API_KEY }}
      API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
      ODDSPAPI_API_KEY: ${{ secrets.ODDSPAPI_API_KEY }}
      OPENWEATHERMAP_API_KEY: ${{ secrets.OPENWEATHERMAP_API_KEY }}
      OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHERMAP_API_KEY }}
      OPENWEATHERMAP_KEY: ${{ secrets.OPENWEATHERMAP_API_KEY }}
      NEWSAPI_KEY: ${{ secrets.NEWSAPI_KEY }}
      CURRENTS_API_KEY: ${{ secrets.CURRENTS_API_KEY }}
      GNEWS_KEY: ${{ secrets.GNEWS_KEY }}
      NEWSDATA_API_KEY: ${{ secrets.NEWSDATA_API_KEY }}
      GUARDIAN_API_KEY: ${{ secrets.GUARDIAN_API_KEY }}
      FUTRIXMETRICS_API_KEY: ${{ secrets.FUTRIXMETRICS_API_KEY }}
      HIGHLIGHTLY_API_KEY: ${{ secrets.HIGHLIGHTLY_API_KEY }}
      METEOSTAT_RAPIDAPI_KEY: ${{ secrets.METEOSTAT_RAPIDAPI_KEY }}
      ODDS_FEED_RAPIDAPI_KEY: ${{ secrets.ODDS_FEED_RAPIDAPI_KEY }}
      FREE_FOOTBALL_RAPIDAPI_KEY: ${{ secrets.FREE_FOOTBALL_RAPIDAPI_KEY }}
      RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Prepare runtime directories
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/harizon-preserve-exports
          cp .data/exports/latest-build-day-inventory.log /tmp/harizon-preserve-exports/ 2>/dev/null || true
          cp .data/exports/latest-day-inventory-core-build-report.json /tmp/harizon-preserve-exports/ 2>/dev/null || true
          cp .data/exports/latest-day-inventory-core-crosswalk.json /tmp/harizon-preserve-exports/ 2>/dev/null || true
          cp .data/exports/latest-day-inventory-core-strict-merge-report.json /tmp/harizon-preserve-exports/ 2>/dev/null || true
          rm -rf .data/exports artifacts/run-bot
          mkdir -p .data/exports .data/cache .data/day_inventory .data/line_history artifacts/run-bot
          cp /tmp/harizon-preserve-exports/* .data/exports/ 2>/dev/null || true

      - name: Compute and freeze day inventory date
        shell: bash
        run: |
          set -euo pipefail
          cache_date="$(TZ="${APP_TIMEZONE}" date +%F)"
          echo "DAY_INVENTORY_CACHE_DATE=${cache_date}" >> "$GITHUB_ENV"
          echo "DAY_INVENTORY_TARGET_DATE=${cache_date}" >> "$GITHUB_ENV"
          echo "PROVIDER_SMOKE_TARGET_DATE=${cache_date}" >> "$GITHUB_ENV"
          echo "PROVIDER_SMOKE_TARGET_DATE_FROZEN=true" >> "$GITHUB_ENV"
          echo "run-bot frozen day inventory date: ${cache_date}"

      - name: Restore persisted day inventory
        uses: actions/cache/restore@v4
        with:
          path: |
            .data/day_inventory
            .data/line_history
          key: run-bot-day-inventory-${{ env.DAY_INVENTORY_CACHE_DATE }}-${{ github.run_id }}
          restore-keys: |
            run-bot-day-inventory-${{ env.DAY_INVENTORY_CACHE_DATE }}-
            provider-smoke-day-inventory-${{ env.DAY_INVENTORY_CACHE_DATE }}-

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Preflight repair runtime JSON
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p .data/exports .data/cache/day_inventory .data/day_inventory .data/line_history artifacts/run-bot
          python -u scripts/preflight_repair_runtime_json.py || true

      - name: Snapshot restored day inventory
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p .data/exports .data/cache/day_inventory .data/day_inventory .data/line_history artifacts/run-bot
          python -u scripts/guard_day_inventory_no_shrink.py snapshot || true

      - name: Expand day inventory to target
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p .data/exports .data/cache/day_inventory .data/day_inventory artifacts/run-bot
          python -u scripts/expand_day_inventory_to_target.py || true
          python -u scripts/guard_day_inventory_no_shrink.py snapshot || true
          cp .data/exports/latest-day-inventory-target-expand.json artifacts/run-bot/latest-day-inventory-target-expand.json 2>/dev/null || true

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Apply publication family policy
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p .data/exports .data/cache .data/day_inventory .data/line_history artifacts/run-bot
          python -u scripts/apply_publication_family_policy.py

      - name: Apply A/B tier bookmaker contract
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p .data/exports .data/cache .data/day_inventory .data/line_history artifacts/run-bot
          python -u scripts/apply_ab_tier_bookmaker_contract.py || true

      - name: Apply provider quota governor
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p .data/exports .data/cache .data/day_inventory .data/line_history artifacts/run-bot
          echo "provider quota governor shell start $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          if timeout 45s python -u scripts/apply_provider_quota_governor.py; then
            echo "provider quota governor applied"
          else
            status=$?
            echo "provider quota governor failed or timed out with status ${status}; continuing with request-budget policy"
          fi

      - name: Apply provider request budget
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p .data/exports .data/cache .data/day_inventory .data/line_history artifacts/run-bot
          echo "provider request budget start $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          if timeout 45s python -u scripts/apply_provider_request_budget.py; then
            echo "provider request budget applied"
          else
            status=$?
            echo "provider request budget failed or timed out with status ${status}; continuing with workflow env"
          fi

      - name: Apply per-run API quota contract
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p .data/exports .data/cache .data/day_inventory .data/line_history artifacts/run-bot
          echo "per-run API quota contract start $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          if timeout 45s python -u scripts/apply_per_run_api_quota_contract.py; then
            echo "per-run API quota contract applied"
          else
            status=$?
            echo "per-run API quota contract failed or timed out with status ${status}; continuing with previous env"
          fi
          python -u scripts/apply_publication_family_policy.py || true

      - name: Provider smoke
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p .data/exports .data/cache .data/day_inventory .data/line_history artifacts/run-bot
          echo "provider smoke start $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          if timeout 90s python -u workflow/provider_smoke.py; then
            echo "provider smoke completed"
          else
            status=$?
            echo "provider smoke failed or timed out with status ${status}; continuing production run"
          fi
          cp .data/exports/latest-provider-smoke.json artifacts/run-bot/latest-provider-smoke.json 2>/dev/null || true
          cp .data/exports/latest-provider-smoke.md artifacts/run-bot/latest-provider-smoke.md 2>/dev/null || true

      - name: Run tests
        shell: bash
        run: |
          set -uo pipefail
          echo "unit tests start $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          if timeout 60s python -m pytest -q tests/test_market_integrity.py; then
            echo "unit tests passed"
          else
            status=$?
            echo "unit tests failed or timed out with status ${status}; continuing production run"
          fi

      - name: Run bot
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p .data/exports .data/cache .data/day_inventory .data/line_history artifacts/run-bot
          python -u scripts/apply_publication_family_policy.py || true
          echo "runtime start $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          python -u -m app.cli run-once 2>&1 | tee .data/exports/latest-run-bot.log
          status=${PIPESTATUS[0]}
          echo "runtime status ${status}"
          echo "runtime finish $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          python -u scripts/guard_day_inventory_no_shrink.py repair || true
          python -u scripts/backfill_inventory_bookmaker_coverage.py || true
          python -u scripts/build_b_cover_candidate_gap_report.py || true
          find .data/exports -maxdepth 2 -type f -printf '%p\n' | sort || true
          cp -r .data/exports artifacts/run-bot/exports || true
          cp -r .data/cache artifacts/run-bot/cache || true
          cp -r .data/day_inventory artifacts/run-bot/day_inventory || true
          cp -r .data/line_history artifacts/run-bot/line_history || true
          cp .logs/debug-last-run.json artifacts/run-bot/debug-last-run.json 2>/dev/null || true
          cp .data/exports/latest-run-bot.log artifacts/run-bot/latest-run-bot.log 2>/dev/null || true
          cp .data/provider_quota_governor_state.json artifacts/run-bot/provider_quota_governor_state.json 2>/dev/null || true
          cp .data/provider_request_budget_state.json artifacts/run-bot/provider_request_budget_state.json 2>/dev/null || true
          exit ${status}

      - name: Persist movement watchlist and diagnostics
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          if [[ ! -s .data/exports/latest-run-bot.log ]]; then
            echo "skip post-run diagnostics: fresh run-bot log was not created"
            exit 0
          fi
          python -u scripts/apply_publication_family_policy.py || true
          python -u scripts/restore_awaiting_movement_candidates.py || true
          python -u scripts/persist_awaiting_movement_candidates.py || true
          python -u scripts/build_fresh_b_cover_diagnostics.py || true
          cp .data/exports/latest-awaiting-movement-candidates.json artifacts/run-bot/latest-awaiting-movement-candidates.json 2>/dev/null || true
          cp .data/exports/latest-awaiting-movement-restore.json artifacts/run-bot/latest-awaiting-movement-restore.json 2>/dev/null || true
          cp .data/exports/latest-fresh-b-cover-diagnostics.json artifacts/run-bot/latest-fresh-b-cover-diagnostics.json 2>/dev/null || true
          cp .data/exports/latest-controlled-fallback-report.json artifacts/run-bot/latest-controlled-fallback-report.json 2>/dev/null || true
          cp .data/exports/latest-controlled-fallback-prepublish-guard.json artifacts/run-bot/latest-controlled-fallback-prepublish-guard.json 2>/dev/null || true
          cp artifacts/controlled-fallback-report.json artifacts/run-bot/controlled-fallback-report.json 2>/dev/null || true
          python -u scripts/build_b_cover_candidate_gap_report.py || true
          cp .data/exports/latest-b-cover-candidate-gap-report.json artifacts/run-bot/latest-b-cover-candidate-gap-report.json 2>/dev/null || true
          cp .data/exports/latest-b-cover-candidate-gap-report.csv artifacts/run-bot/latest-b-cover-candidate-gap-report.csv 2>/dev/null || true
          python -u scripts/build_fresh_b_cover_diagnostics.py || true
          cp .data/exports/latest-fresh-b-cover-diagnostics.json artifacts/run-bot/latest-fresh-b-cover-diagnostics.json 2>/dev/null || true

      - name: Update cumulative day inventory coverage
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          if [[ ! -s .data/exports/latest-run-bot.log ]]; then
            echo "skip cumulative day inventory coverage: fresh run-bot log was not created"
            exit 0
          fi
          mkdir -p .data/exports .data/day_inventory .data/line_history artifacts/run-bot
          python -u scripts/day_inventory_cumulative_coverage.py || true
          python -u scripts/backfill_inventory_bookmaker_coverage.py || true
          python -u scripts/guard_day_inventory_no_shrink.py repair || true
          python -u scripts/build_b_cover_candidate_gap_report.py || true
          cp .data/exports/latest-day-inventory-cumulative-coverage.json artifacts/run-bot/latest-day-inventory-cumulative-coverage.json 2>/dev/null || true
          cp .data/exports/latest-day-inventory-coverage-truth.json artifacts/run-bot/latest-day-inventory-coverage-truth.json 2>/dev/null || true
          cp .data/exports/latest-day-inventory-coverage-truth.csv artifacts/run-bot/latest-day-inventory-coverage-truth.csv 2>/dev/null || true
          cp .data/exports/latest-inventory-bookmaker-backfill.json artifacts/run-bot/latest-inventory-bookmaker-backfill.json 2>/dev/null || true
          cp .data/exports/latest-b-cover-candidate-gap-report.json artifacts/run-bot/latest-b-cover-candidate-gap-report.json 2>/dev/null || true
          cp .data/exports/latest-b-cover-candidate-gap-report.csv artifacts/run-bot/latest-b-cover-candidate-gap-report.csv 2>/dev/null || true
          cp -r .data/day_inventory artifacts/run-bot/day_inventory || true
          cp -r .data/line_history artifacts/run-bot/line_history || true

      - name: Normalize published pick payloads
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          if [[ ! -s .data/exports/latest-run-bot.log ]]; then
            echo "skip payload normalization: fresh run-bot log was not created"
            exit 0
          fi
          python scripts/normalize_published_pick_payloads.py || true
          cp .data/exports/latest-normalized-publication-payloads.json artifacts/run-bot/latest-normalized-publication-payloads.json 2>/dev/null || true

      - name: Send HARIZON Telegram run report
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          if [[ ! -s .data/exports/latest-run-bot.log ]]; then
            echo "skip HARIZON report: fresh run-bot log was not created"
            exit 0
          fi
          python scripts/send_harizon_telegram_run_report_v10.py || python scripts/send_harizon_telegram_run_report_v9.py || python scripts/send_harizon_telegram_run_report_v8.py || python scripts/send_harizon_telegram_run_report_v7.py || python scripts/send_harizon_telegram_run_report_v5.py || python scripts/send_harizon_telegram_run_report_v4.py || python scripts/send_harizon_telegram_run_report_v3.py || python scripts/send_harizon_telegram_run_report.py || true
          cp .data/exports/latest-publication-status.json artifacts/run-bot/latest-publication-status.json 2>/dev/null || true
          cp .data/exports/latest-harizon-telegram-run-report.txt artifacts/run-bot/latest-harizon-telegram-run-report.txt 2>/dev/null || true
          cp .data/exports/latest-harizon-telegram-run-report.json artifacts/run-bot/latest-harizon-telegram-run-report.json 2>/dev/null || true
          cp .data/exports/latest-harizon-telegram-run-report-v5.json artifacts/run-bot/latest-harizon-telegram-run-report-v5.json 2>/dev/null || true
          cp .data/exports/latest-harizon-telegram-run-report-v5.txt artifacts/run-bot/latest-harizon-telegram-run-report-v5.txt 2>/dev/null || true
          cp .data/exports/latest-harizon-telegram-run-report-v9.json artifacts/run-bot/latest-harizon-telegram-run-report-v9.json 2>/dev/null || true
          cp .data/exports/latest-harizon-telegram-run-report-v9.txt artifacts/run-bot/latest-harizon-telegram-run-report-v9.txt 2>/dev/null || true
          cp .data/exports/latest-harizon-telegram-run-report-v10-status.json artifacts/run-bot/latest-harizon-telegram-run-report-v10-status.json 2>/dev/null || true

      - name: Commit runtime artifacts
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          if [[ ! -s .data/exports/latest-run-bot.log ]]; then
            echo "skip runtime artifact commit: fresh run-bot log was not created"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f .data/state.json .data/published-candidate-index.json .data/fallback-sent-index.json .data/candidate-lifecycle-state.json \
            .data/exports/latest-*.json .data/exports/latest-*.txt .data/exports/latest-*.csv \
            .data/day_inventory/current.json .data/day_inventory/latest.json .data/day_inventory/today.json .data/day_inventory/${DAY_INVENTORY_CACHE_DATE}.json \
            .data/line_history/latest.json .data/line_history/${DAY_INVENTORY_CACHE_DATE}.json \
            .data/provider_quota_governor_state.json .data/provider_request_budget_state.json .data/provider_quota_state.json || true
          git reset -- .data/odds_movement_snapshots.jsonl 2>/dev/null || true
          git reset -- .data/exports/latest-build-day-inventory.log .data/exports/latest-day-inventory-core-build-report.json .data/exports/latest-day-inventory-core-crosswalk.json .data/exports/latest-day-inventory-core-strict-merge-report.json 2>/dev/null || true
          git checkout -- .data/exports/latest-build-day-inventory.log .data/exports/latest-day-inventory-core-build-report.json .data/exports/latest-day-inventory-core-crosswalk.json .data/exports/latest-day-inventory-core-strict-merge-report.json 2>/dev/null || true
          git commit -m "Update runtime artifacts [skip ci]" || true
          git push || true

      - name: Save persisted day inventory
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            .data/day_inventory
            .data/line_history
          key: run-bot-day-inventory-${{ env.DAY_INVENTORY_CACHE_DATE }}-${{ github.run_id }}

      - name: Prune artifact payload
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          python -u scripts/prune_run_artifacts.py || true

      - name: Upload run artifact
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: run-bot-${{ github.run_id }}
          path: |
            artifacts/run-bot/**
            .data/exports/latest-*.json
            .data/exports/latest-*.txt
            .data/exports/latest-*.csv
            .data/day_inventory/current.json
            .data/day_inventory/latest.json
            .data/day_inventory/today.json
            .data/line_history/latest.json
            .data/provider_quota_governor_state.json
            .data/provider_request_budget_state.json
            .data/published-candidate-index.json
            .data/fallback-sent-index.json
            .data/candidate-lifecycle-state.json
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 7
