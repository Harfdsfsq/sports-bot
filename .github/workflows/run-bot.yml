name: run-bot

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Run mode"
        required: true
        default: "normal"
  schedule:
    - cron: "0 */2 * * *"

permissions:
  contents: write

concurrency:
  group: run-bot
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      PYTHONUNBUFFERED: "1"
      TZ: Europe/Moscow
      APP_TIMEZONE: Europe/Moscow
      APP_ENV: production
      RUN_MODE: ${{ github.event.inputs.mode || 'normal' }}
      PROVIDER_FREE_QUOTA_POLICY_ENABLED: "true"
      FREE_CONTEXT_RUNTIME_ENABLED: "true"
      FREE_CONTEXT_RUNTIME_TIMEOUT_SECONDS: "6"
      PROVIDER_CONTEXT_SOURCES_DO_NOT_CONFIRM_PRICE: "true"
      RUNTIME_PROVIDER_DIAGNOSTICS_ENABLED: "true"
      ODDS_API_IO_MAX_REQUESTS_PER_RUN: "140"
      ODDS_API_IO_ACCOUNT2_MAX_REQUESTS_PER_RUN: "140"
      BZZOIRO_EVENTS_MAX_REQUESTS_PER_RUN: "1"
      BZZOIRO_PREDICTIONS_MAX_REQUESTS_PER_RUN: "1"
      BZZOIRO_PAGE_SIZE: "3"
      BZZOIRO_TIMEOUT_SECONDS: "18"
      SSTATS_MAX_REQUESTS_PER_RUN: "12"
      FOOTBALL_DATA_MAX_REQUESTS_PER_RUN: "4"
      THESPORTSDB_MAX_REQUESTS_PER_RUN: "4"
      ALLSPORTSAPI_MAX_REQUESTS_PER_RUN: "1"
      FUTRIXMETRICS_MAX_REQUESTS_PER_RUN: "6"
      HIGHLIGHTLY_MAX_REQUESTS_PER_RUN: "4"
      HIGHLIGHTLY_BASE_URL: "https://soccer.highlightly.net"
      HIGHLIGHTLY_SMOKE_PATH: "/leagues"
      FREE_FOOTBALL_RAPIDAPI_MAX_REQUESTS_PER_RUN: "2"
      SPORTLOGIC_QUERY_GUARD_ENABLED: "true"
      SPORTLOGIC_BROAD_FALLBACK_ENABLED: "true"
      SPORTLOGIC_MAX_REQUESTS_PER_RUN: "8"
      SPORTLOGIC_PER_PAGE: "40"
      WEATHERAPI_MAX_REQUESTS_PER_RUN: "40"
      OPENWEATHERMAP_MAX_REQUESTS_PER_RUN: "20"
      OPEN_METEO_ENABLED: "true"
      OPEN_METEO_MAX_REQUESTS_PER_RUN: "60"
      METEOSTAT_RAPIDAPI_MAX_REQUESTS_PER_RUN: "2"
      NEWSAPI_MAX_REQUESTS_PER_RUN: "2"
      CURRENTS_MAX_REQUESTS_PER_RUN: "2"
      GNEWS_MAX_REQUESTS_PER_RUN: "2"
      NEWSDATA_MAX_REQUESTS_PER_RUN: "2"
      GUARDIAN_MAX_REQUESTS_PER_RUN: "3"
      CLUBELO_ENABLED: "true"
      CLUBELO_BASE_URL: "http://api.clubelo.com"
      CLUBELO_MAX_REQUESTS_PER_DAY: "1"
      FOOTBALL_DATA_CO_UK_ENABLED: "true"
      FOOTBALL_DATA_CO_UK_MAX_REQUESTS_PER_DAY: "1"
      WIKIDATA_ENABLED: "true"
      WIKIDATA_MAX_REQUESTS_PER_DAY: "4"
      WIKIDATA_SPARQL_MAX_REQUESTS_PER_DAY: "2"
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      ODDS_API_IO_KEY: ${{ secrets.ODDS_API_IO_KEY }}
      ODDS_API_IO_KEY_2: ${{ secrets.ODDS_API_IO_KEY_2 }}
      BZZOIRO_API_KEY: ${{ secrets.BZZOIRO_API_KEY }}
      SSTATS_API_KEY: ${{ secrets.SSTATS_API_KEY }}
      FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
      THESPORTSDB_API_KEY: ${{ secrets.THESPORTSDB_API_KEY }}
      ALLSPORTSAPI_API_KEY: ${{ secrets.ALLSPORTSAPI_API_KEY }}
      SPORTLOGIC_API_KEY: ${{ secrets.SPORTLOGIC_API_KEY }}
      SPORTLOGIC_KEY: ${{ secrets.SPORTLOGIC_API_KEY }}
      SPORTLOGIC_TOKEN: ${{ secrets.SPORTLOGIC_API_KEY }}
      WEATHERAPI_KEY: ${{ secrets.WEATHERAPI_KEY }}
      WEATHER_API_KEY: ${{ secrets.WEATHERAPI_KEY }}
      WEATHERAPI_API_KEY: ${{ secrets.WEATHERAPI_KEY }}
      OPENWEATHERMAP_API_KEY: ${{ secrets.OPENWEATHERMAP_API_KEY }}
      OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHERMAP_API_KEY }}
      OPENWEATHERMAP_KEY: ${{ secrets.OPENWEATHERMAP_API_KEY }}
      NEWSAPI_KEY: ${{ secrets.NEWSAPI_KEY }}
      CURRENTS_API_KEY: ${{ secrets.CURRENTS_API_KEY }}
      GNEWS_KEY: ${{ secrets.GNEWS_KEY }}
      NEWSDATA_API_KEY: ${{ secrets.NEWSDATA_API_KEY }}
      GUARDIAN_API_KEY: ${{ secrets.GUARDIAN_API_KEY }}
      FUTRIXMETRICS_API_KEY: ${{ secrets.FUTRIXMETRICS_API_KEY }}
      HIGHLIGHTLY_API_KEY: ${{ secrets.HIGHLIGHTLY_API_KEY }}
      METEOSTAT_RAPIDAPI_KEY: ${{ secrets.METEOSTAT_RAPIDAPI_KEY }}
      RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
      FREE_FOOTBALL_RAPIDAPI_KEY: ${{ secrets.FREE_FOOTBALL_RAPIDAPI_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run bot
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p .data/exports .data/cache artifacts/run-bot
          echo "runtime start $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          timeout 25m python -X faulthandler -c "import runpy, sys; import app.services.runbot_runtime_bootstrap as boot; print('runtime bootstrap', {'installed': boot.INSTALLED, 'failed': boot.FAILED}, flush=True); sys.argv=['python -m app.cli','run-once']; runpy.run_module('app.cli', run_name='__main__')"
          status=$?
          echo "runtime status ${status}"
          echo "runtime finish $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          find .data/exports -maxdepth 2 -type f -printf '%p\n' | sort || true
          cp -r .data/exports artifacts/run-bot/exports || true
          cp -r .data/cache artifacts/run-bot/cache || true
          exit ${status}
      - name: Commit runtime artifacts
        if: always()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f .data/exports .data/cache || true
          git commit -m "Update runtime artifacts [skip ci]" || true
          git push || true
      - name: Upload run artifact
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: run-bot-${{ github.run_id }}
          path: |
            artifacts/run-bot/**
            .data/exports/**
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 7
