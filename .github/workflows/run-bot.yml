  FOOTBALL_DATA_MATCH_LIMIT: '160'
  FOOTBALL_DATA_CONTEXT_MATCH_LIMIT: '140'
  FOOTBALL_DATA_STANDINGS_LIMIT: '12'
  FOOTBALL_DATA_HISTORY_COMPETITIONS_LIMIT: '12'
