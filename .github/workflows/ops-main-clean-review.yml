name: Ops • main clean review

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Summarize latest run
        run: python scripts/summarize_latest_run.py

      - name: Audit latest run integrity
        run: python scripts/audit_odds_integrity.py

      - name: Upload review artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: main-clean-review-${{ github.run_id }}
          path: |
            .data/exports/main-clean-publish-report.json
            .data/exports/odds-integrity-report.json
            .data/exports/latest-run-summary.json
          if-no-files-found: ignore
          retention-days: 7
