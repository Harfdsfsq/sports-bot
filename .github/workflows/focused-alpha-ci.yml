name: focused-alpha-ci

on:
  pull_request:
    paths:
      - "app/cli.py"
      - "app/services/focused_alpha*.py"
      - "app/services/daily_coverage_plan.py"
      - "app/services/daily_coverage_assignments.py"
      - "app/services/daily_coverage_full_inventory_provider_patch.py"
      - "scripts/build_focused_alpha_decisions.py"
      - "scripts/patch_focused_alpha_candidate_rank.py"
      - "scripts/publish_controlled_fallback_guarded.py"
      - "tests/test_focused_alpha*.py"
      - ".github/workflows/focused-alpha-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused-alpha:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff
      - name: Compile Focused Alpha modules
        run: |
          python -m py_compile \
            app/cli.py \
            app/services/focused_alpha.py \
            app/services/focused_alpha_assignments.py \
            app/services/focused_alpha_history.py \
            app/services/focused_alpha_learning_ledger.py \
            app/services/focused_alpha_runtime_policy.py \
            app/services/daily_coverage_plan.py \
            app/services/daily_coverage_assignments.py \
            app/services/daily_coverage_full_inventory_provider_patch.py \
            scripts/build_focused_alpha_decisions.py \
            scripts/patch_focused_alpha_candidate_rank.py \
            scripts/publish_controlled_fallback_guarded.py
      - name: Ruff Focused Alpha change set
        run: |
          ruff check --config pyproject.toml \
            app/cli.py \
            app/services/focused_alpha.py \
            app/services/focused_alpha_assignments.py \
            app/services/focused_alpha_history.py \
            app/services/focused_alpha_learning_ledger.py \
            app/services/focused_alpha_runtime_policy.py \
            app/services/daily_coverage_plan.py \
            app/services/daily_coverage_assignments.py \
            app/services/daily_coverage_full_inventory_provider_patch.py \
            scripts/build_focused_alpha_decisions.py \
            scripts/patch_focused_alpha_candidate_rank.py \
            scripts/publish_controlled_fallback_guarded.py \
            tests/test_focused_alpha*.py
      - name: Run Focused Alpha tests
        run: python -m pytest -q tests/test_focused_alpha*.py
      - name: Build repository history and decision baseline
        run: |
          python - <<'PY'
          import json
          from app.services.focused_alpha_history import build_history_audit
          from scripts.build_focused_alpha_decisions import build_decisions
          from app.services.focused_alpha_learning_ledger import update_learning_ledger

          audit = build_history_audit()
          board = build_decisions()
          ledger = update_learning_ledger(board)
          print(json.dumps({
              "history": {
                  "raw_rows": audit.get("raw_rows"),
                  "canonical_rows": audit.get("canonical_rows"),
                  "telegram_sent_rows": audit.get("telegram_sent_rows"),
                  "settled_rows": audit.get("settled_rows"),
                  "duplicates_collapsed": audit.get("duplicates_collapsed"),
                  "live_learning_ready": audit.get("live_learning_ready"),
                  "live_learning_blockers": audit.get("live_learning_blockers"),
              },
              "decisions": {
                  "candidates_seen": board.get("candidates_seen"),
                  "passes_shadow_contract": board.get("passes_shadow_contract"),
                  "selected_count": board.get("selected_count"),
              },
              "ledger": ledger.get("summary"),
          }, ensure_ascii=False, indent=2))
          PY
      - name: Upload Focused Alpha baseline
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: focused-alpha-baseline-${{ github.run_id }}
          path: |
            .data/exports/latest-focused-alpha-*.json
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 7
