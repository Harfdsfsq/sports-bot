name: Daily report

on:
  workflow_dispatch:
    inputs:
      profile:
        description: Runtime profile for report-only run
        required: true
        default: balanced
        type: choice
        options:
          - balanced
          - conservative
          - default
      target_offset_days:
        description: "0 = today by MSK, 1 = yesterday"
        required: false
        default: '0'
        type: string
      force_resend:
        description: Remove sent marker and send report again for selected date
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: daily-report-${{ github.event_name }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  TZ: Europe/Moscow
  APP_TIMEZONE: Europe/Moscow

  TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
  TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

  ODDS_API_IO_KEY: ${{ secrets.ODDS_API_IO_KEY }}
  ODDS_API_IO_KEY_2: ${{ secrets.ODDS_API_IO_KEY_2 }}
  ODDSPAPI_API_KEY: ${{ secrets.ODDSPAPI_API_KEY }}
  ALLSPORTSAPI_API_KEY: ${{ secrets.ALLSPORTSAPI_API_KEY }}
  FUTRIXMETRICS_API_KEY: ${{ secrets.FUTRIXMETRICS_API_KEY }}
  SSTATS_API_KEY: ${{ secrets.SSTATS_API_KEY }}
  BZZOIRO_API_KEY: ${{ secrets.BZZOIRO_API_KEY }}
  API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
  FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
  THESPORTSDB_API_KEY: ${{ secrets.THESPORTSDB_API_KEY }}
  NEWSAPI_KEY: ${{ secrets.NEWSAPI_KEY }}
  CURRENTS_API_KEY: ${{ secrets.CURRENTS_API_KEY }}
  CURRENTS_KEY: ${{ secrets.CURRENTS_KEY }}
  GNEWS_KEY: ${{ secrets.GNEWS_KEY }}
  WEATHERAPI_KEY: ${{ secrets.WEATHERAPI_KEY }}
  OPENWEATHERMAP_API_KEY: ${{ secrets.OPENWEATHERMAP_API_KEY }}
  OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}
  OPENWEATHERMAP_KEY: ${{ secrets.OPENWEATHERMAP_KEY }}
  METEOSTAT_RAPIDAPI_KEY: ${{ secrets.METEOSTAT_RAPIDAPI_KEY }}
  METEOSTAT_RAPIDAPI_HOST: ${{ secrets.METEOSTAT_RAPIDAPI_HOST }}

  PUBLISH_DRY_RUN: 'false'
  PREDICTION_PUBLICATION_ENABLED: 'false'
  RUN_REPORT_ENABLED: 'false'
  RUN_REPORT_ONLY_WHEN_NO_PREDICTIONS: 'false'
  SETTLEMENT_ENABLED: 'true'
  SETTLEMENT_GRACE_MINUTES: '180'
  SETTLEMENT_LOOKBACK_DAYS: '7'
  SETTLEMENT_SEND_TELEGRAM_SUMMARY: 'false'

  DAILY_REPORT_ENABLED: 'true'
  DAILY_REPORT_SEND_TELEGRAM: 'false'
  DAILY_REPORT_HOUR_LOCAL: '0'
  DAILY_REPORT_TARGET_OFFSET_DAYS: ${{ github.event_name == 'workflow_dispatch' && inputs.target_offset_days || '0' }}
  DAILY_REPORT_RESEND_ON_CHANGE: 'true'
  DAILY_REPORT_MIN_BETS: '0'
  NIGHTLY_REVIEW_REPORT_ONLY_ENABLED: 'true'

  MATCH_BOOTSTRAP_PROVIDER: 'odds_api_io'
  PUBLISH_WINDOW_HOURS: '12'
  MIN_KICKOFF_LEAD_MINUTES: '30'
  MAX_PICKS_PER_RUN: '0'
  CONTROLLED_FALLBACK_SEND_TELEGRAM: 'false'
  CONTROLLED_FALLBACK_SEND_NO_PICK_REPORT: 'false'
  CONTROLLED_FALLBACK_ENABLED: 'false'

jobs:
  daily-report:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Prepare local state folders
        shell: bash
        run: |
          mkdir -p .data .data/bets .data/exports .data/provider_cache/daily-coverage .data/provider_cache/day-shortlist .logs artifacts/daily-report

      - name: Apply selected runtime profile
        shell: bash
        env:
          SELECTED_PROFILE: ${{ github.event_name == 'workflow_dispatch' && inputs.profile || 'balanced' }}
        run: |
          set -euo pipefail
          case "$SELECTED_PROFILE" in
            balanced) PROFILE_FILE="config/balanced_output.env" ;;
            conservative) PROFILE_FILE="config/conservative_passability.env" ;;
            default) PROFILE_FILE="" ;;
            *) echo "Unknown profile: $SELECTED_PROFILE" >&2; exit 1 ;;
          esac
          if [ -n "$PROFILE_FILE" ] && [ -f "$PROFILE_FILE" ]; then
            grep -E '^[A-Za-z_][A-Za-z0-9_]*=' "$PROFILE_FILE" >> "$GITHUB_ENV"
          fi
          if [ -f config/final_runtime_overrides.env ]; then
            grep -E '^[A-Za-z_][A-Za-z0-9_]*=' config/final_runtime_overrides.env >> "$GITHUB_ENV"
          fi

      - name: Apply auto-learning runtime overrides
        shell: bash
        run: |
          if [ -f .data/auto_learning_runtime_overrides.env ]; then
            grep -E '^[A-Za-z_][A-Za-z0-9_]*=' .data/auto_learning_runtime_overrides.env >> "$GITHUB_ENV"
            echo "Applied auto-learning runtime overrides: .data/auto_learning_runtime_overrides.env"
          fi

      - name: Apply integrity fixups
        shell: bash
        run: |
          python scripts/apply_run_integrity_fixups.py || true
          cat .data/exports/latest-run-integrity-fixups.json || true

      - name: Force report-only daily mode
        shell: bash
        run: |
          REPORT_OFFSET="${{ github.event_name == 'workflow_dispatch' && inputs.target_offset_days || '0' }}"
          echo "PREDICTION_PUBLICATION_ENABLED=false" >> "$GITHUB_ENV"
          echo "CONTROLLED_FALLBACK_ENABLED=false" >> "$GITHUB_ENV"
          echo "CONTROLLED_FALLBACK_SEND_TELEGRAM=false" >> "$GITHUB_ENV"
          echo "CONTROLLED_FALLBACK_SEND_NO_PICK_REPORT=false" >> "$GITHUB_ENV"
          echo "RUN_REPORT_ENABLED=false" >> "$GITHUB_ENV"
          echo "RUN_REPORT_ONLY_WHEN_NO_PREDICTIONS=false" >> "$GITHUB_ENV"
          echo "SETTLEMENT_ENABLED=true" >> "$GITHUB_ENV"
          echo "SETTLEMENT_GRACE_MINUTES=180" >> "$GITHUB_ENV"
          echo "SETTLEMENT_LOOKBACK_DAYS=7" >> "$GITHUB_ENV"
          echo "SETTLEMENT_SEND_TELEGRAM_SUMMARY=false" >> "$GITHUB_ENV"
          echo "DAILY_REPORT_ENABLED=true" >> "$GITHUB_ENV"
          echo "DAILY_REPORT_SEND_TELEGRAM=false" >> "$GITHUB_ENV"
          echo "DAILY_REPORT_HOUR_LOCAL=0" >> "$GITHUB_ENV"
          echo "DAILY_REPORT_TARGET_OFFSET_DAYS=${REPORT_OFFSET}" >> "$GITHUB_ENV"
          echo "DAILY_REPORT_RESEND_ON_CHANGE=true" >> "$GITHUB_ENV"
          echo "DAILY_REPORT_MIN_BETS=0" >> "$GITHUB_ENV"
          echo "NIGHTLY_REVIEW_REPORT_ONLY_ENABLED=true" >> "$GITHUB_ENV"
          echo "MAX_PICKS_PER_RUN=0" >> "$GITHUB_ENV"

      - name: Force resend for manual run
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.force_resend }}
        shell: bash
        run: |
          echo "DAILY_OPS_REPORT_FORCE_SEND=true" >> "$GITHUB_ENV"
          rm -f .data/daily-ops-report-sent.json || true

      - name: Ensure calibration profile exists
        shell: bash
        run: |
          mkdir -p .data
          if [ ! -f .data/calibration-profile.json ] && [ -f config/calibration-profile.example.json ]; then
            cp config/calibration-profile.example.json .data/calibration-profile.json
          fi

      - name: Run settlement and base daily logic
        run: python -m app.cli run-once

      - name: Generate audit and training payloads
        if: always()
        shell: bash
        run: |
          python -m app.cli coverage-audit > .data/exports/latest-coverage-audit.json || true
          python -m app.cli history-guard-audit > .data/exports/latest-history-guard-audit.json 2> .data/exports/latest-history-guard-audit.err || true
          python -m app.cli training-dataset > .data/exports/latest-training-dataset.json || true
          python -m app.cli reporting-sqlite > .data/exports/latest-reporting-sqlite.json || true

      - name: Run daily auto-learning feedback loop
        if: always()
        shell: bash
        run: |
          python scripts/auto_learning_engine.py || true

      - name: Build completed settlement review
        if: always()
        shell: bash
        run: |
          python scripts/build_settlement_review_report.py --target-offset-days "$DAILY_REPORT_TARGET_OFFSET_DAYS" --send-telegram || true
          cat .data/exports/latest-settlement-review-report.txt || true

      - name: Build and send Russian daily operations report
        if: always()
        shell: bash
        run: |
          python scripts/build_daily_ops_report_ledger.py --send-telegram || python scripts/build_daily_ops_report.py --send-telegram || true
          cat .data/exports/latest-daily-ops-report.txt || true

      - name: Collect daily report artifacts
        if: always()
        shell: bash
        run: |
          mkdir -p artifacts/daily-report
          cp -f .data/exports/latest-daily-ops-report.json artifacts/daily-report/latest-daily-ops-report.json 2>/dev/null || true
          cp -f .data/exports/latest-daily-ops-report.txt artifacts/daily-report/latest-daily-ops-report.txt 2>/dev/null || true
          cp -f .data/exports/latest-daily-report.json artifacts/daily-report/latest-daily-report.json 2>/dev/null || true
          cp -f .data/exports/latest-daily-summary.json artifacts/daily-report/latest-daily-summary.json 2>/dev/null || true
          cp -f .data/exports/latest-settlement-review-report.json artifacts/daily-report/latest-settlement-review-report.json 2>/dev/null || true
          cp -f .data/exports/latest-settlement-review-report.txt artifacts/daily-report/latest-settlement-review-report.txt 2>/dev/null || true
          cp -rf .data/bets artifacts/daily-report/bets 2>/dev/null || true

      - name: Upload daily-report artifact
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: daily-report-current
          path: |
            artifacts/daily-report
            .data/exports/latest-daily-ops-report.json
            .data/exports/latest-daily-ops-report.txt
            .logs/debug-last-run.json
            .logs/runs
            .data/*.json
            .data/bets/**
          if-no-files-found: ignore
          retention-days: 14

      - name: Sync persistent state
        if: always()
        shell: bash
        env:
          PERSISTENT_STATE_COMMIT_MESSAGE: "Update persistent report state"
        run: |
          git add -f .data/bets || true
          python scripts/sync_persistent_state.py || true
