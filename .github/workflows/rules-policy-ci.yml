name: rules-policy-ci

on:
  push:
    branches: [main]
    paths:
      - "app/services/runtime_preflight.py"
      - "app/services/focused_alpha_runtime_policy.py"
      - "app/services/rules_source_integrity.py"
      - "config/rules_compliant.env"
      - ".github/workflows/run-bot.yml"
      - ".github/workflows/run-bot-fast.yml"
      - ".github/workflows/run-bot-rules.yml"
      - ".github/workflows/production-schedule.yml"
      - ".github/workflows/rules-policy-ci.yml"
      - "tests/test_runtime_preflight*.py"
      - "tests/test_rules_source_integrity.py"
      - "tests/test_rules_ab_publication_runtime.py"
      - "tests/test_focused_alpha_runtime_policy.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-rules-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install --disable-pip-version-check -r requirements.txt
      - name: Compile runtime modules
        run: python -m py_compile app/services/runtime_preflight.py app/services/focused_alpha_runtime_policy.py app/services/rules_source_integrity.py
      - name: Parse production workflows
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml
          for name in ("run-bot.yml", "run-bot-fast.yml", "run-bot-rules.yml", "production-schedule.yml", "rules-policy-ci.yml"):
              path = Path(".github/workflows") / name
              payload = yaml.safe_load(path.read_text(encoding="utf-8"))
              assert isinstance(payload, dict), name
              assert payload.get("jobs"), name
          PY
      - name: Test rules contract
        run: >-
          pytest -q
          tests/test_runtime_preflight.py
          tests/test_runtime_preflight_phase_policy.py
          tests/test_runtime_preflight_rules_ab.py
          tests/test_rules_source_integrity.py
          tests/test_rules_ab_publication_runtime.py
          tests/test_focused_alpha_runtime_policy.py
