name: rules-policy-ci

on:
  push:
    branches: [main]
    paths:
      - "app/services/runtime_preflight.py"
      - "app/services/focused_alpha_runtime_policy.py"
      - "app/services/rules_source_integrity.py"
      - "config/rules_compliant.env"
      - "tests/test_runtime_preflight*.py"
      - "tests/test_rules_source_integrity.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-rules-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install --disable-pip-version-check -r requirements.txt
      - name: Compile changed runtime modules
        run: python -m py_compile app/services/runtime_preflight.py app/services/focused_alpha_runtime_policy.py app/services/rules_source_integrity.py
      - name: Test rules contract
        run: >-
          pytest -q
          tests/test_runtime_preflight.py
          tests/test_runtime_preflight_phase_policy.py
          tests/test_runtime_preflight_rules_ab.py
          tests/test_rules_source_integrity.py
