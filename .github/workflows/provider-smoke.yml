name: provider-smoke

on:
  workflow_dispatch:
    inputs:
      providers:
        description: "all/core/odds/context/weather/news/mapping/csv/rapidapi or comma-separated provider names"
        required: true
        default: "all"
      max_seconds:
        description: "Hard diagnostics limit in seconds"
        required: true
        default: "360"
      target_date:
        description: "Moscow local date YYYY-MM-DD. Empty = today"
        required: false
        default: ""
      coverage_target:
        description: "Top matches to audit, nearest kickoff first"
        required: false
        default: "300"
      send_samples:
        description: "Show small OK samples in txt report"
        type: boolean
        required: false
        default: true

permissions:
  contents: read

concurrency:
  group: provider-smoke
  cancel-in-progress: true

jobs:
  provider-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      PYTHONUNBUFFERED: "1"
      PYTHONPATH: ${{ github.workspace }}
      TZ: Europe/Moscow
      APP_TIMEZONE: Europe/Moscow
      APP_ENV: provider-smoke-repair
      PUBLISH_DRY_RUN: "true"
      PREDICTION_PUBLICATION_ENABLED: "false"
      RUN_REPORT_ENABLED: "false"
      ENHANCED_RUN_REPORT_SEND_TELEGRAM: "false"
      DETAILED_RUN_REPORT_SEND_TELEGRAM: "false"
      DAILY_REPORT_ENABLED: "false"
      SETTLEMENT_SEND_TELEGRAM_SUMMARY: "false"
      TELEGRAM_MESSAGE_SOFT_LIMIT: "3600"

      PROVIDER_SMOKE_FAST_PROVIDERS: ${{ github.event.inputs.providers || 'all' }}
      PROVIDER_SMOKE_FAST_MAX_SECONDS: ${{ github.event.inputs.max_seconds || '360' }}
      PROVIDER_SMOKE_SHOW_OK_SAMPLES: ${{ github.event.inputs.send_samples || 'true' }}
      PROVIDER_SMOKE_FAST_TIMEOUT: "22"
      PROVIDER_SMOKE_FAST_CONCURRENCY: "4"
      PROVIDER_SMOKE_REPEATS: "1"
      PROVIDER_SMOKE_MATCHING_DIAGNOSTICS_ENABLED: "true"
      PROVIDER_SMOKE_MATCHING_TIMEOUT_SECONDS: "35"
      PROVIDER_SMOKE_MATCHING_PROVIDERS: "sstats,bzzoiro,football_data,allsportsapi"
      PROVIDER_SMOKE_MATCHING_ODDS_LIMIT: "100"
      PROVIDER_SMOKE_MATCHING_ODDS_PAGES: "3"
      PROVIDER_SMOKE_MATCHING_DAYS_AHEAD: "2"
      PROVIDER_SMOKE_SSTATS_LOOKBACK_DAYS: "45"
      BZZOIRO_PROVIDER_SMOKE_ENABLED: "true"
      API_FULL_SMOKE_ENABLED: "false"
      API_FULL_SMOKE_SPORTLOGIC_ENABLED: "false"
      API_FULL_SMOKE_SPORTLOGIC_DETAILS_ENABLED: "false"
      API_FULL_SMOKE_MAX_SECONDS: "180"
      API_FULL_SMOKE_TIMEOUT_SECONDS: "22"
      API_FULL_SMOKE_CONCURRENCY: "4"
      API_FULL_SMOKE_DETAIL_CONCURRENCY: "1"
      API_FULL_SMOKE_ODDS_EXTRA_MAX_REQUESTS: "4"
      API_FULL_SMOKE_ODDS_EVENT_LIMIT: "2"
      API_FULL_SMOKE_FOOTBALL_DATA_COMPETITION_LIMIT: "1"
      SPORTLOGIC_ACTIVE_ODDS_SMOKE_PAGES: "0"
      SPORTLOGIC_ACTIVE_ODDS_SMOKE_GAME_LIMIT: "0"
      SSTATS_DEEP_SMOKE_DETAIL_GAMES: "2"
      SSTATS_DEEP_SMOKE_CONCURRENCY: "2"
      SSTATS_DEEP_SMOKE_TIMEOUT_SECONDS: "18"
      SSTATS_DEEP_SMOKE_INCLUDE_APIKEY: "true"

      DAY_INVENTORY_TARGET_DATE: ${{ github.event.inputs.target_date }}
      PROVIDER_SMOKE_TARGET_DATE: ${{ github.event.inputs.target_date }}
      PROVIDER_SMOKE_COVERAGE_TARGET: ${{ github.event.inputs.coverage_target || '300' }}
      DAY_INVENTORY_MAX_MATCHES: ${{ github.event.inputs.coverage_target || '300' }}
      DAY_INVENTORY_BOOTSTRAP_PROVIDER: "odds_api_io"
      MATCH_BOOTSTRAP_PROVIDER: "odds_api_io"
      DAY_INVENTORY_FORCE_PROVIDER_MERGE: "true"
      DAY_INVENTORY_BUILD_TIMEOUT_SECONDS: "600"
      DAY_INVENTORY_DIRECT_WINDOW_DAYS: "1"
      DAY_INVENTORY_DIRECT_MIN_MATCHES: "1"
      DAY_INVENTORY_EXTRA_FIXTURES_ENABLED: "true"
      DAY_INVENTORY_ENABLE_BZZOIRO: "true"
      DAY_INVENTORY_ENABLE_ALLSPORTSAPI: "true"
      DAY_INVENTORY_ENABLE_SPORTLOGIC: "false"
      DAY_INVENTORY_ENABLE_SSTATS: "true"
      DAY_INVENTORY_TOP_MATCHES_ENABLED: "true"
      DAY_INVENTORY_ODDS_API_IO_TARGET_MATCHES: "180"
      DAY_INVENTORY_MULTI_SOURCE_MAX_MATCHES: "120"
      DAY_INVENTORY_OTHER_MAX_MATCHES: "120"
      DAY_INVENTORY_SSTATS_ONLY_MAX_MATCHES: "70"
      DAY_INVENTORY_SSTATS_OVERFLOW_MAX_MATCHES: "70"
      DAY_INVENTORY_SSTATS_TOTAL_HARD_CAP: "140"
      DAY_INVENTORY_FORCE_FULL_300: "true"
      DAY_INVENTORY_FORCE_FULL_ALLOW_SSTATS_OVER_HARD_CAP: "false"
      DAY_INVENTORY_EXCLUDE_BAD_STATUS_FROM_TOP: "true"
      DAY_INVENTORY_EXCLUDE_LOW_VALUE_FROM_FIRST_PASS: "true"
      DAY_INVENTORY_BZZOIRO_WINDOW_DAYS: "1"
      DAY_INVENTORY_BZZOIRO_MAX_PAGES: "10"
      DAY_INVENTORY_BZZOIRO_MAX_REQUESTS: "12"
      DAY_INVENTORY_ALLSPORTSAPI_WINDOW_DAYS: "0"
      DAY_INVENTORY_ALLSPORTSAPI_MATCH_LIMIT: "500"
      DAY_INVENTORY_SPORTLOGIC_MATCH_LIMIT: "0"
      DAY_INVENTORY_SPORTLOGIC_MAX_REQUESTS: "0"
      DAY_INVENTORY_SSTATS_WINDOW_DAYS: "1"
      DAY_INVENTORY_SSTATS_LIMIT: "1000"
      DAY_INVENTORY_SSTATS_MAX_REQUESTS: "3"

      PROVIDER_FREE_QUOTA_POLICY_ENABLED: "true"
      PROVIDER_QUOTA_GOVERNOR_ENABLED: "true"
      PROVIDER_QUOTA_RUNS_PER_DAY: "12"
      PROVIDER_QUOTA_SAFETY_FACTOR: "0.78"
      PROVIDER_QUOTA_HARD_TIMEOUT_SECONDS: "25"
      PROVIDER_REQUEST_BUDGET_MODE: "per_run_only"
      PROVIDER_REQUEST_BUDGET_DISABLE_DAILY_MONTHLY: "true"
      PUBLISH_MIN_ODDS_SOURCES: "2"
      PUBLISH_MIN_CONTEXT_SOURCES: "2"
      MIN_CONTEXT_SOURCES_PUBLISH: "2"
      CONTROLLED_FALLBACK_MIN_ODDS_SOURCES: "2"
      MARKET_FAMILY_PUBLICATION_GUARD_ENABLED: "true"
      PUBLICATION_ALLOWED_MARKET_FAMILIES: "totals,spreads"
      HARIZON_ALLOWED_PUBLICATION_FAMILIES: "totals,spreads"
      H2H_PUBLICATION_ENABLED: "false"
      BTTS_PUBLICATION_ENABLED: "false"
      DNB_PUBLICATION_ENABLED: "false"
      DOUBLE_CHANCE_PUBLICATION_ENABLED: "false"
      TEAM_TOTALS_PUBLICATION_ENABLED: "false"
      TOTALS_PUBLICATION_ENABLED: "true"
      SPREADS_PUBLICATION_ENABLED: "true"

      ODDS_API_IO_KEY: ${{ secrets.ODDS_API_IO_KEY }}
      ODDS_API_IO_KEY_2: ${{ secrets.ODDS_API_IO_KEY_2 }}
      ODDS_API_IO_KEY2: ${{ secrets.ODDS_API_IO_KEY2 }}
      BZZOIRO_API_KEY: ${{ secrets.BZZOIRO_API_KEY }}
      SSTATS_API_KEY: ${{ secrets.SSTATS_API_KEY }}
      FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
      FOOTBALL_DATA_KEY: ${{ secrets.FOOTBALL_DATA_KEY }}
      THESPORTSDB_API_KEY: ${{ secrets.THESPORTSDB_API_KEY }}
      ALLSPORTSAPI_API_KEY: ${{ secrets.ALLSPORTSAPI_API_KEY }}
      SPORTLOGIC_API_KEY: ${{ secrets.SPORTLOGIC_API_KEY }}
      SPORTLOGIC_KEY: ${{ secrets.SPORTLOGIC_API_KEY }}
      SPORTLOGIC_TOKEN: ${{ secrets.SPORTLOGIC_API_KEY }}
      WEATHERAPI_KEY: ${{ secrets.WEATHERAPI_KEY }}
      WEATHER_API_KEY: ${{ secrets.WEATHERAPI_KEY }}
      WEATHERAPI_API_KEY: ${{ secrets.WEATHERAPI_KEY }}
      OPENWEATHERMAP_API_KEY: ${{ secrets.OPENWEATHERMAP_API_KEY }}
      OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHERMAP_API_KEY }}
      OPENWEATHERMAP_KEY: ${{ secrets.OPENWEATHERMAP_API_KEY }}
      NEWSAPI_KEY: ${{ secrets.NEWSAPI_KEY }}
      CURRENTS_API_KEY: ${{ secrets.CURRENTS_API_KEY }}
      CURRENTS_KEY: ${{ secrets.CURRENTS_KEY }}
      GNEWS_KEY: ${{ secrets.GNEWS_KEY }}
      NEWSDATA_API_KEY: ${{ secrets.NEWSDATA_API_KEY }}
      NEWSDATA_KEY: ${{ secrets.NEWSDATA_KEY }}
      GUARDIAN_API_KEY: ${{ secrets.GUARDIAN_API_KEY }}
      GUARDIAN_KEY: ${{ secrets.GUARDIAN_KEY }}
      FUTRIXMETRICS_API_KEY: ${{ secrets.FUTRIXMETRICS_API_KEY }}
      FUTRIXMETRICS_KEY: ${{ secrets.FUTRIXMETRICS_KEY }}
      FUTRIXMETRICS_BASE_URL: ${{ secrets.FUTRIXMETRICS_BASE_URL }}
      HIGHLIGHTLY_API_KEY: ${{ secrets.HIGHLIGHTLY_API_KEY }}
      HIGHLIGHTLY_KEY: ${{ secrets.HIGHLIGHTLY_KEY }}
      HIGHLIGHTLY_BASE_URL: ${{ secrets.HIGHLIGHTLY_BASE_URL }}
      HIGHLIGHTLY_SMOKE_PATH: ${{ secrets.HIGHLIGHTLY_SMOKE_PATH }}
      HIGHLIGHTLY_USE_RAPIDAPI: ${{ secrets.HIGHLIGHTLY_USE_RAPIDAPI }}
      HIGHLIGHTLY_RAPIDAPI_HOST: ${{ secrets.HIGHLIGHTLY_RAPIDAPI_HOST }}
      METEOSTAT_RAPIDAPI_KEY: ${{ secrets.METEOSTAT_RAPIDAPI_KEY }}
      METEOSTAT_RAPIDAPI_HOST: meteostat.p.rapidapi.com
      METEOSTAT_RAPIDAPI_PATH: ${{ secrets.METEOSTAT_RAPIDAPI_PATH }}
      RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
      ODDS_FEED_RAPIDAPI_KEY: ${{ secrets.ODDS_FEED_RAPIDAPI_KEY }}
      ODDS_FEED_RAPIDAPI_HOST: ${{ secrets.ODDS_FEED_RAPIDAPI_HOST }}
      ODDS_FEED_RAPIDAPI_PATH: ${{ secrets.ODDS_FEED_RAPIDAPI_PATH }}
      SPORTSBOOK_RAPIDAPI_KEY: ${{ secrets.SPORTSBOOK_RAPIDAPI_KEY }}
      SPORTSBOOK_RAPIDAPI_HOST: ${{ secrets.SPORTSBOOK_RAPIDAPI_HOST }}
      SPORTSBOOK_RAPIDAPI_PATH: ${{ secrets.SPORTSBOOK_RAPIDAPI_PATH }}
      SPORTAPI7_RAPIDAPI_KEY: ${{ secrets.SPORTAPI7_RAPIDAPI_KEY }}
      SPORTAPI7_RAPIDAPI_HOST: ${{ secrets.SPORTAPI7_RAPIDAPI_HOST }}
      SPORTAPI7_RAPIDAPI_PATH: ${{ secrets.SPORTAPI7_RAPIDAPI_PATH }}
      FREE_FOOTBALL_RAPIDAPI_KEY: ${{ secrets.FREE_FOOTBALL_RAPIDAPI_KEY }}
      FREE_FOOTBALL_RAPIDAPI_HOST: ${{ secrets.FREE_FOOTBALL_RAPIDAPI_HOST }}
      FREE_FOOTBALL_RAPIDAPI_PATH: ${{ secrets.FREE_FOOTBALL_RAPIDAPI_PATH }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Prepare smoke directories
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .data/exports artifacts/provider-smoke artifacts/provider-smoke-fast
          mkdir -p .data/exports .data/cache .data/day_inventory artifacts/provider-smoke artifacts/provider-smoke-fast

      - name: Apply quota and policy guards
        shell: bash
        run: |
          set -uo pipefail
          python -u scripts/apply_publication_family_policy.py || true
          python -u scripts/apply_provider_quota_governor.py || true
          python -u scripts/apply_provider_request_budget.py || true
          python -u scripts/apply_per_run_api_quota_contract.py || true

      - name: Build 300-match smoke inventory
        shell: bash
        run: |
          set -uo pipefail
          echo "build smoke inventory start $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          if timeout 660s python -u scripts/build_day_inventory.py 2>&1 | tee .data/exports/provider-smoke-build-day-inventory.log; then
            echo "build smoke inventory completed"
          else
            status=$?
            echo "build smoke inventory failed or timed out with status ${status}; continuing diagnostics"
          fi
          cp .data/exports/latest-day-inventory-summary.json artifacts/provider-smoke/latest-day-inventory-summary.json 2>/dev/null || true
          cp .data/exports/provider-smoke-build-day-inventory.log artifacts/provider-smoke/provider-smoke-build-day-inventory.log 2>/dev/null || true
          cp -r .data/day_inventory artifacts/provider-smoke/day_inventory 2>/dev/null || true

      - name: Run provider endpoint and matching diagnostics
        shell: bash
        env:
          API_FULL_SMOKE_ENABLED: "false"
          PROVIDER_SMOKE_REPEATS: "1"
          PROVIDER_SMOKE_MATCHING_PROVIDERS: "sstats,bzzoiro,football_data,allsportsapi"
          SPORTLOGIC_ACTIVE_ODDS_SMOKE_PAGES: "0"
          SPORTLOGIC_ACTIVE_ODDS_SMOKE_GAME_LIMIT: "0"
        run: |
          set -uo pipefail
          mkdir -p .data/exports artifacts/provider-smoke artifacts/provider-smoke-fast
          echo "provider diagnostics start $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          if timeout "$(( PROVIDER_SMOKE_FAST_MAX_SECONDS + 120 ))" python -u scripts/provider_smoke_fast.py \
            --providers "${PROVIDER_SMOKE_FAST_PROVIDERS}" \
            --max-seconds "${PROVIDER_SMOKE_FAST_MAX_SECONDS}" \
            --timeout "${PROVIDER_SMOKE_FAST_TIMEOUT}" \
            --concurrency "${PROVIDER_SMOKE_FAST_CONCURRENCY}" \
            --repeats "1" 2>&1 | tee .data/exports/provider-smoke-fast-run.log; then
            echo "provider diagnostics completed"
          else
            status=$?
            echo "provider diagnostics failed or timed out with status ${status}; continuing artifact collection"
          fi
          cp .data/exports/latest-provider-smoke-fast.json .data/exports/latest-provider-smoke.json 2>/dev/null || true
          cp .data/exports/latest-provider-smoke-fast.txt .data/exports/latest-provider-smoke.txt 2>/dev/null || true

      - name: Run explicit full-data endpoint probe
        shell: bash
        env:
          API_FULL_SMOKE_ENABLED: "true"
          API_FULL_SMOKE_DETAIL_CONCURRENCY: "1"
          API_FULL_SMOKE_SPORTLOGIC_ENABLED: "false"
          API_FULL_SMOKE_SPORTLOGIC_DETAILS_ENABLED: "false"
          SPORTLOGIC_ACTIVE_ODDS_SMOKE_PAGES: "0"
          SPORTLOGIC_ACTIVE_ODDS_SMOKE_GAME_LIMIT: "0"
        run: |
          set -uo pipefail
          echo "explicit full-data probe v10 start $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          if timeout 220s python -u scripts/api_full_data_smoke_probe_v10.py 2>&1 | tee .data/exports/api-full-data-smoke-run.log; then
            echo "explicit full-data probe v10 completed"
          else
            status=$?
            echo "explicit full-data probe v10 failed or timed out with status ${status}; continuing"
          fi

      - name: Run SStats deep endpoint probe
        shell: bash
        env:
          SSTATS_DEEP_SMOKE_DETAIL_GAMES: "2"
          SSTATS_DEEP_SMOKE_CONCURRENCY: "2"
          SSTATS_DEEP_SMOKE_TIMEOUT_SECONDS: "18"
        run: |
          set -uo pipefail
          echo "sstats deep smoke v2 start $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          if timeout 180s python -u scripts/sstats_deep_smoke_probe_v2.py 2>&1 | tee .data/exports/sstats-deep-smoke-run.log; then
            echo "sstats deep smoke v2 completed"
          else
            status=$?
            echo "sstats deep smoke v2 failed or timed out with status ${status}; continuing"
          fi

      - name: Build 300-match coverage matrix
        shell: bash
        run: |
          set -uo pipefail
          echo "coverage matrix v2 start $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          if python -u scripts/provider_smoke_coverage_matrix_v2.py 2>&1 | tee .data/exports/provider-smoke-coverage-matrix-run.log; then
            echo "coverage matrix v2 completed"
          else
            status=$?
            echo "coverage matrix v2 failed with status ${status}; continuing"
          fi

      - name: Build provider signal coverage blueprint
        shell: bash
        run: |
          set -uo pipefail
          echo "provider signal coverage blueprint v2 start $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          if python -u scripts/provider_signal_coverage_blueprint_v2.py 2>&1 | tee .data/exports/provider-signal-coverage-blueprint-run.log; then
            echo "provider signal coverage blueprint v2 completed"
          else
            status=$?
            echo "provider signal coverage blueprint v2 failed with status ${status}; continuing"
          fi

      - name: Collect provider smoke artifacts
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p artifacts/provider-smoke artifacts/provider-smoke-fast
          cp .data/exports/latest-provider-smoke*.json artifacts/provider-smoke/ 2>/dev/null || true
          cp .data/exports/latest-provider-smoke*.txt artifacts/provider-smoke/ 2>/dev/null || true
          cp .data/exports/latest-api-full-data-enrichment.json artifacts/provider-smoke/ 2>/dev/null || true
          cp .data/exports/latest-api-full-data-enrichment.txt artifacts/provider-smoke/ 2>/dev/null || true
          cp .data/exports/latest-sstats-deep-smoke.json artifacts/provider-smoke/ 2>/dev/null || true
          cp .data/exports/latest-sstats-deep-smoke.txt artifacts/provider-smoke/ 2>/dev/null || true
          cp .data/exports/sstats-deep-smoke-run.log artifacts/provider-smoke/ 2>/dev/null || true
          cp .data/exports/provider-signal-coverage-blueprint.json artifacts/provider-smoke/ 2>/dev/null || true
          cp .data/exports/provider-signal-coverage-blueprint.txt artifacts/provider-smoke/ 2>/dev/null || true
          cp .data/exports/provider-signal-coverage-blueprint-run.log artifacts/provider-smoke/ 2>/dev/null || true
          cp .data/exports/api-full-data-smoke-run.log artifacts/provider-smoke/ 2>/dev/null || true
          cp .data/exports/provider-smoke-fast-run.log artifacts/provider-smoke/ 2>/dev/null || true
          cp .data/exports/provider-smoke-coverage-matrix.json artifacts/provider-smoke/ 2>/dev/null || true
          cp .data/exports/provider-smoke-coverage-matrix.txt artifacts/provider-smoke/ 2>/dev/null || true
          cp .data/exports/provider-smoke-coverage-matrix-run.log artifacts/provider-smoke/ 2>/dev/null || true
          cp .data/exports/latest-day-inventory-summary.json artifacts/provider-smoke/ 2>/dev/null || true
          cp .data/exports/provider-smoke-build-day-inventory.log artifacts/provider-smoke/ 2>/dev/null || true
          cp -r .data/day_inventory artifacts/provider-smoke/day_inventory 2>/dev/null || true
          echo "----- provider smoke coverage matrix -----"
          cat .data/exports/provider-smoke-coverage-matrix.txt 2>/dev/null || true
          echo "----- provider smoke diagnostics -----"
          cat .data/exports/latest-provider-smoke-diagnostics.txt 2>/dev/null || cat .data/exports/latest-provider-smoke.txt 2>/dev/null || true
          echo "----- API full-data enrichment -----"
          cat .data/exports/latest-api-full-data-enrichment.txt 2>/dev/null || true
          echo "----- SStats deep smoke -----"
          cat .data/exports/latest-sstats-deep-smoke.txt 2>/dev/null || true
          echo "----- Provider signal coverage blueprint -----"
          cat .data/exports/provider-signal-coverage-blueprint.txt 2>/dev/null || true

      - name: Upload provider smoke artifact
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: provider-smoke-${{ github.run_id }}
          path: |
            artifacts/provider-smoke/**
            artifacts/provider-smoke-fast/**
            .data/exports/**
            .data/day_inventory/**
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7
