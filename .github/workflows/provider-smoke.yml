name: provider-smoke

on:
  workflow_dispatch:
    inputs:
      providers:
        description: "core/minimal or comma-separated provider names"
        required: true
        default: "odds_api_io,bzzoiro,sstats,sportlogic"
      max_seconds:
        description: "Hard diagnostics limit in seconds"
        required: true
        default: "180"
      target_date:
        description: "Moscow local date YYYY-MM-DD. Empty = today"
        required: false
        default: ""
      coverage_target:
        description: "Daily top match inventory size"
        required: false
        default: "300"
      send_samples:
        description: "Show small OK samples in txt report"
        type: boolean
        required: false
        default: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: provider-smoke
  cancel-in-progress: true

jobs:
  provider-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      PYTHONUNBUFFERED: "1"
      PYTHONPATH: ${{ github.workspace }}
      TZ: Europe/Moscow
      APP_TIMEZONE: Europe/Moscow
      APP_ENV: provider-smoke-minimal-repair
      PROVIDER_SMOKE_MINIMAL_REPAIR: "true"
      PROVIDER_SMOKE_REPAIR_ENV_GUARD_ENABLED: "true"
      DAY_INVENTORY_PRESERVE_CACHED_EVIDENCE: "true"
      PUBLISH_DRY_RUN: "true"
      PUBLISH_ALLOW_B_TIER: "true"
      PUBLISH_COVERAGE_TIER_MODE: "hybrid"
      CONTROLLED_FALLBACK_TELEGRAM_ALLOW_TIER_B: "true"
      PREDICTION_PUBLICATION_ENABLED: "false"
      RUN_REPORT_ENABLED: "false"
      ENHANCED_RUN_REPORT_SEND_TELEGRAM: "false"
      DETAILED_RUN_REPORT_SEND_TELEGRAM: "false"
      DAILY_REPORT_ENABLED: "false"
      SETTLEMENT_SEND_TELEGRAM_SUMMARY: "false"
      TELEGRAM_MESSAGE_SOFT_LIMIT: "3600"

      PROVIDER_SMOKE_FAST_PROVIDERS: ${{ github.event.inputs.providers || 'odds_api_io,bzzoiro,sstats,sportlogic' }}
      PROVIDER_SMOKE_FAST_MAX_SECONDS: ${{ github.event.inputs.max_seconds || '180' }}
      PROVIDER_SMOKE_SHOW_OK_SAMPLES: ${{ github.event.inputs.send_samples || 'true' }}
      PROVIDER_SMOKE_FAST_TIMEOUT: "18"
      PROVIDER_SMOKE_FAST_CONCURRENCY: "2"
      PROVIDER_SMOKE_REPEATS: "1"
      PROVIDER_API_MIN_PROBE_TIMEOUT: "16"
      PROVIDER_SMOKE_MATCHING_DIAGNOSTICS_ENABLED: "true"
      PROVIDER_SMOKE_MATCHING_TIMEOUT_SECONDS: "22"
      PROVIDER_SMOKE_MATCHING_PROVIDERS: "sstats,bzzoiro,sportlogic"
      PROVIDER_SMOKE_MATCHING_ODDS_LIMIT: "160"
      PROVIDER_SMOKE_MATCHING_ODDS_PAGES: "4"
      PROVIDER_SMOKE_MATCHING_DAYS_AHEAD: "1"
      PROVIDER_SMOKE_SSTATS_LOOKBACK_DAYS: "21"

      API_FULL_SMOKE_ENABLED: "false"
      API_FULL_SMOKE_BZZOIRO_ENABLED: "true"
      API_FULL_SMOKE_ODDS_API_IO_ENABLED: "true"
      API_FULL_SMOKE_SPORTLOGIC_ENABLED: "true"
      API_FULL_SMOKE_SPORTLOGIC_DETAILS_ENABLED: "false"
      API_FULL_SMOKE_ODDS_EXTRA_MAX_REQUESTS: "10"
      API_FULL_SMOKE_ODDS_EVENT_LIMIT: "20"
      API_FULL_SMOKE_FOOTBALL_DATA_COMPETITION_LIMIT: "0"

      DAY_INVENTORY_TARGET_DATE: ${{ github.event.inputs.target_date }}
      PROVIDER_SMOKE_TARGET_DATE: ${{ github.event.inputs.target_date }}
      PROVIDER_SMOKE_COVERAGE_TARGET: ${{ github.event.inputs.coverage_target || '300' }}
      DAY_INVENTORY_TARGET_SIZE: ${{ github.event.inputs.coverage_target || '300' }}
      DAY_INVENTORY_MAX_MATCHES: ${{ github.event.inputs.coverage_target || '300' }}
      DAY_INVENTORY_FORCE_TOP_300: "true"
      DAY_INVENTORY_FORCE_FULL_300: "true"
      DAY_INVENTORY_BOOTSTRAP_PROVIDER: "odds_api_io"
      MATCH_BOOTSTRAP_PROVIDER: "odds_api_io"
      DAY_INVENTORY_FORCE_PROVIDER_MERGE: "true"
      DAY_INVENTORY_BUILD_TIMEOUT_SECONDS: "240"
      DAY_INVENTORY_DIRECT_WINDOW_DAYS: "1"
      DAY_INVENTORY_DIRECT_MIN_MATCHES: "1"
      DAY_INVENTORY_EXTRA_FIXTURES_ENABLED: "true"
      DAY_INVENTORY_ENABLE_BZZOIRO: "true"
      DAY_INVENTORY_ENABLE_SSTATS: "true"
      DAY_INVENTORY_ENABLE_SPORTLOGIC: "true"
      DAY_INVENTORY_ENABLE_ALLSPORTSAPI: "false"
      DAY_INVENTORY_TOP_MATCHES_ENABLED: "true"
      DAY_INVENTORY_ODDS_API_IO_TARGET_MATCHES: "220"
      DAY_INVENTORY_MULTI_SOURCE_MAX_MATCHES: "220"
      DAY_INVENTORY_OTHER_MAX_MATCHES: "80"
      DAY_INVENTORY_SSTATS_ONLY_MAX_MATCHES: "220"
      DAY_INVENTORY_SSTATS_OVERFLOW_MAX_MATCHES: "220"
      DAY_INVENTORY_SSTATS_TOTAL_HARD_CAP: "300"
      DAY_INVENTORY_FORCE_FULL_ALLOW_SSTATS_OVER_HARD_CAP: "true"
      DAY_INVENTORY_EXCLUDE_BAD_STATUS_FROM_TOP: "true"
      DAY_INVENTORY_EXCLUDE_LOW_VALUE_FROM_FIRST_PASS: "true"
      DAY_INVENTORY_BZZOIRO_WINDOW_DAYS: "1"
      DAY_INVENTORY_BZZOIRO_MAX_PAGES: "20"
      DAY_INVENTORY_BZZOIRO_MAX_REQUESTS: "200"
      DAY_INVENTORY_SSTATS_WINDOW_DAYS: "1"
      DAY_INVENTORY_SSTATS_LIMIT: "1000"
      DAY_INVENTORY_SSTATS_MAX_REQUESTS: "150"
      DAY_INVENTORY_SPORTLOGIC_MATCH_LIMIT: "100"
      DAY_INVENTORY_SPORTLOGIC_MAX_REQUESTS: "40"
      DAY_INVENTORY_ALLSPORTSAPI_WINDOW_DAYS: "0"
      DAY_INVENTORY_ALLSPORTSAPI_MATCH_LIMIT: "0"

      PROVIDER_FREE_QUOTA_POLICY_ENABLED: "true"
      PROVIDER_QUOTA_GOVERNOR_ENABLED: "true"
      PROVIDER_QUOTA_RUNS_PER_DAY: "12"
      PROVIDER_QUOTA_SAFETY_FACTOR: "0.70"
      PROVIDER_QUOTA_HARD_TIMEOUT_SECONDS: "18"
      PROVIDER_REQUEST_BUDGET_MODE: "per_run_with_daily_guards"
      PROVIDER_REQUEST_BUDGET_DISABLE_DAILY_MONTHLY: "false"

      ODDS_API_IO_HOURLY_LIMIT: "100"
      ODDS_API_IO_PER_RUN_MAX: "100"
      ODDS_API_IO_ACCOUNT1_PER_RUN_MAX: "50"
      ODDS_API_IO_ACCOUNT2_PER_RUN_MAX: "50"
      ODDS_API_IO_MAX_HTTP_REQUESTS_PER_RUN: "100"
      ODDS_API_IO_MAX_REQUESTS_PER_RUN: "100"
      ODDS_API_IO_REQUEST_BUDGET_GRANTED: "100"
      ODDS_API_IO_REQUESTS_MAX_PER_RUN: "100"
      ODDS_API_IO_MAX_EVENT_PAGES_PER_SPORT: "10"
      ODDS_API_IO_MAX_PAGES_PER_SPORT: "10"
      ODDS_API_IO_PAGE_LIMIT: "100"
      PRICE_BACKFILL_ODDS_API_IO_BATCHES_PER_ACCOUNT: "5"
      PRICE_BACKFILL_ODDS_API_IO_MAX_EVENT_IDS_PER_REQUEST: "10"
      PRICE_BACKFILL_ODDS_API_IO_EVENT_LIMIT: "100"
      MAX_MATCHES_FOR_ODDS_FETCH: "300"

      BZZOIRO_PROVIDER_SMOKE_ENABLED: "true"
      BZZOIRO_ENABLED: "true"
      ENABLE_BZZOIRO: "true"
      ENABLE_BZZOIRO_CONTEXT: "true"
      BZZOIRO_CONTEXT_ENABLED: "true"
      BZZOIRO_RATE_LIMIT_PER_MINUTE: "200"
      BZZOIRO_PER_RUN_MAX: "200"
      BZZOIRO_MAX_REQUESTS_PER_RUN: "200"
      BZZOIRO_MAX_HTTP_REQUESTS_PER_RUN: "200"
      BZZOIRO_REQUESTS_MAX_PER_RUN: "200"
      BZZOIRO_REQUEST_BUDGET_GRANTED: "200"
      BZZOIRO_EVENTS_MAX_REQUESTS_PER_RUN: "80"
      BZZOIRO_PREDICTIONS_MAX_REQUESTS_PER_RUN: "40"
      BZZOIRO_PREDICTIONS_MAX_PAGES: "10"
      BZZOIRO_MAX_PAGES: "20"
      BZZOIRO_CONTEXT_MATCH_LIMIT: "300"
      BZZOIRO_PRICE_BACKFILL_ENABLED: "true"
      BZZOIRO_PRICE_BACKFILL_TARGET_LIMIT: "80"

      SSTATS_ENABLED: "true"
      ENABLE_SSTATS: "true"
      ENABLE_SSTATS_CONTEXT: "true"
      SSTATS_CONTEXT_ENABLED: "true"
      SSTATS_RATE_LIMIT_PER_MINUTE: "150"
      SSTATS_PER_RUN_MAX: "150"
      SSTATS_MAX_REQUESTS_PER_RUN: "150"
      SSTATS_REQUESTS_MAX_PER_RUN: "150"
      SSTATS_REQUEST_BUDGET_GRANTED: "150"
      SSTATS_MAX_HTTP_REQUESTS_PER_RUN: "150"
      SSTATS_CONTEXT_MATCH_LIMIT: "300"
      SSTATS_DEEP_DETAIL_LIMIT_PER_RUN: "40"
      SSTATS_DEEP_CONTEXT_MATCH_LIMIT: "80"
      SSTATS_DEEP_ENRICHMENT_ENABLED: "true"
      SSTATS_DEEP_ENRICHMENT_AFTER_CROSSWALK: "true"
      SSTATS_DEEP_SMOKE_DETAIL_GAMES: "30"
      SSTATS_DEEP_SMOKE_CONCURRENCY: "2"
      SSTATS_DEEP_SMOKE_TIMEOUT_SECONDS: "16"
      SSTATS_DEEP_SMOKE_INCLUDE_APIKEY: "true"
      SSTATS_GAME_DETAIL_ENABLED: "true"
      SSTATS_LAST_GAMES_STATS_ENABLED: "true"
      SSTATS_INJURIES_ENABLED: "false"
      SSTATS_GLICKO_ENABLED: "true"
      SSTATS_ODDS_RESCUE_ENABLED: "true"

      SPORTLOGIC_DAILY_LIMIT: "500"
      SPORTLOGIC_ENABLED: "true"
      ENABLE_SPORTLOGIC: "true"
      SPORTLOGIC_CONTROLLED_ODDS_ENABLED: "true"
      SPORTLOGIC_PER_RUN_MAX: "40"
      SPORTLOGIC_MAX_HTTP_REQUESTS_PER_RUN: "40"
      SPORTLOGIC_REQUESTS_MAX_PER_RUN: "40"
      SPORTLOGIC_REQUEST_BUDGET_GRANTED: "40"
      SPORTLOGIC_MATCH_LIMIT: "100"
      SPORTLOGIC_CONTEXT_MATCH_LIMIT: "100"
      SPORTLOGIC_ODDS_MATCH_LIMIT: "40"
      SPORTLOGIC_ACTIVE_ODDS_SMOKE_PAGES: "2"
      SPORTLOGIC_ACTIVE_ODDS_SMOKE_GAME_LIMIT: "40"
      SPORTLOGIC_MATCH_MIN_SCORE: "48"

      PUBLISH_MIN_ODDS_SOURCES: "1"
      PUBLISH_MIN_CONTEXT_SOURCES: "2"
      MIN_CONTEXT_SOURCES_PUBLISH: "2"
      CONTROLLED_FALLBACK_MIN_ODDS_SOURCES: "1"
      MARKET_FAMILY_PUBLICATION_GUARD_ENABLED: "true"
      PUBLICATION_ALLOWED_MARKET_FAMILIES: "totals,spreads"
      HARIZON_ALLOWED_PUBLICATION_FAMILIES: "totals,spreads"
      H2H_PUBLICATION_ENABLED: "false"
      BTTS_PUBLICATION_ENABLED: "false"
      DNB_PUBLICATION_ENABLED: "false"
      DOUBLE_CHANCE_PUBLICATION_ENABLED: "false"
      TEAM_TOTALS_PUBLICATION_ENABLED: "false"
      TOTALS_PUBLICATION_ENABLED: "true"
      SPREADS_PUBLICATION_ENABLED: "true"

      ODDS_API_IO_KEY: ${{ secrets.ODDS_API_IO_KEY }}
      ODDS_API_IO_KEY_2: ${{ secrets.ODDS_API_IO_KEY_2 }}
      ODDS_API_IO_KEY2: ${{ secrets.ODDS_API_IO_KEY2 }}
      BZZOIRO_API_KEY: ${{ secrets.BZZOIRO_API_KEY }}
      SSTATS_API_KEY: ${{ secrets.SSTATS_API_KEY }}
      SPORTLOGIC_API_KEY: ${{ secrets.SPORTLOGIC_API_KEY }}
      SPORTLOGIC_KEY: ${{ secrets.SPORTLOGIC_API_KEY }}
      SPORTLOGIC_TOKEN: ${{ secrets.SPORTLOGIC_API_KEY }}
      FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
      FOOTBALL_DATA_KEY: ${{ secrets.FOOTBALL_DATA_KEY }}
      THESPORTSDB_API_KEY: ${{ secrets.THESPORTSDB_API_KEY }}
      ALLSPORTSAPI_API_KEY: ${{ secrets.ALLSPORTSAPI_API_KEY }}
      WEATHERAPI_KEY: ${{ secrets.WEATHERAPI_KEY }}
      WEATHER_API_KEY: ${{ secrets.WEATHERAPI_KEY }}
      WEATHERAPI_API_KEY: ${{ secrets.WEATHERAPI_KEY }}
      OPENWEATHERMAP_API_KEY: ${{ secrets.OPENWEATHERMAP_API_KEY }}
      OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHERMAP_API_KEY }}
      OPENWEATHERMAP_KEY: ${{ secrets.OPENWEATHERMAP_API_KEY }}
      NEWSAPI_KEY: ${{ secrets.NEWSAPI_KEY }}
      CURRENTS_API_KEY: ${{ secrets.CURRENTS_API_KEY }}
      CURRENTS_KEY: ${{ secrets.CURRENTS_KEY }}
      GNEWS_KEY: ${{ secrets.GNEWS_KEY }}
      NEWSDATA_API_KEY: ${{ secrets.NEWSDATA_API_KEY }}
      NEWSDATA_KEY: ${{ secrets.NEWSDATA_KEY }}
      GUARDIAN_API_KEY: ${{ secrets.GUARDIAN_API_KEY }}
      GUARDIAN_KEY: ${{ secrets.GUARDIAN_KEY }}
      FUTRIXMETRICS_API_KEY: ${{ secrets.FUTRIXMETRICS_API_KEY }}
      FUTRIXMETRICS_KEY: ${{ secrets.FUTRIXMETRICS_KEY }}
      HIGHLIGHTLY_API_KEY: ${{ secrets.HIGHLIGHTLY_API_KEY }}
      METEOSTAT_RAPIDAPI_KEY: ${{ secrets.METEOSTAT_RAPIDAPI_KEY }}
      RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
      ODDS_FEED_RAPIDAPI_KEY: ${{ secrets.ODDS_FEED_RAPIDAPI_KEY }}
      FREE_FOOTBALL_RAPIDAPI_KEY: ${{ secrets.FREE_FOOTBALL_RAPIDAPI_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Prepare smoke directories
        run: |
          set -euo pipefail
          rm -rf .data/exports artifacts/provider-smoke artifacts/provider-smoke-fast
          mkdir -p .data/exports .data/cache .data/day_inventory .data/line_history artifacts/provider-smoke artifacts/provider-smoke-fast

      - name: Compute day inventory cache key
        run: |
          set -euo pipefail
          if [ -n "${DAY_INVENTORY_TARGET_DATE:-}" ]; then
            cache_date="${DAY_INVENTORY_TARGET_DATE}"
          else
            cache_date="$(TZ="${APP_TIMEZONE}" date +%F)"
          fi
          echo "DAY_INVENTORY_CACHE_DATE=${cache_date}" >> "$GITHUB_ENV"
          echo "day inventory cache date: ${cache_date}"

      - name: Restore persisted day inventory
        uses: actions/cache/restore@v4
        with:
          path: |
            .data/day_inventory
            .data/line_history
          key: provider-smoke-day-inventory-${{ env.DAY_INVENTORY_CACHE_DATE }}-${{ github.run_id }}
          restore-keys: |
            provider-smoke-day-inventory-${{ env.DAY_INVENTORY_CACHE_DATE }}-

      - name: Apply quota and policy guards
        run: |
          set -uo pipefail
          python -u scripts/apply_publication_family_policy.py || true
          python -u scripts/apply_provider_quota_governor.py || true
          python -u scripts/apply_provider_request_budget.py || true
          python -u scripts/apply_per_run_api_quota_contract.py || true

      - name: Reassert raised provider-smoke environment
        run: |
          set -euo pipefail
          python - <<'PY' >> "$GITHUB_ENV"
          raised = {
            'APP_ENV': 'provider-smoke-minimal-repair',
            'PROVIDER_SMOKE_MINIMAL_REPAIR': 'true',
            'PROVIDER_SMOKE_REPAIR_ENV_GUARD_ENABLED': 'true',
            'DAY_INVENTORY_PRESERVE_CACHED_EVIDENCE': 'true',
            'ODDS_API_IO_PER_RUN_MAX': '100',
            'ODDS_API_IO_ACCOUNT1_PER_RUN_MAX': '50',
            'ODDS_API_IO_ACCOUNT2_PER_RUN_MAX': '50',
            'ODDS_API_IO_MAX_HTTP_REQUESTS_PER_RUN': '100',
            'ODDS_API_IO_MAX_REQUESTS_PER_RUN': '100',
            'ODDS_API_IO_REQUEST_BUDGET_GRANTED': '100',
            'ODDS_API_IO_REQUESTS_MAX_PER_RUN': '100',
            'PRICE_BACKFILL_ODDS_API_IO_BATCHES_PER_ACCOUNT': '5',
            'PRICE_BACKFILL_ODDS_API_IO_EVENT_LIMIT': '100',
            'MAX_MATCHES_FOR_ODDS_FETCH': '300',
            'BZZOIRO_PER_RUN_MAX': '200',
            'BZZOIRO_MAX_REQUESTS_PER_RUN': '200',
            'BZZOIRO_MAX_HTTP_REQUESTS_PER_RUN': '200',
            'BZZOIRO_REQUESTS_MAX_PER_RUN': '200',
            'BZZOIRO_REQUEST_BUDGET_GRANTED': '200',
            'BZZOIRO_PRICE_BACKFILL_TARGET_LIMIT': '80',
            'SSTATS_PER_RUN_MAX': '150',
            'SSTATS_MAX_REQUESTS_PER_RUN': '150',
            'SSTATS_REQUESTS_MAX_PER_RUN': '150',
            'SSTATS_REQUEST_BUDGET_GRANTED': '150',
            'SSTATS_MAX_HTTP_REQUESTS_PER_RUN': '150',
            'SSTATS_GAME_DETAIL_ENABLED': 'true',
            'SPORTLOGIC_ENABLED': 'true',
            'ENABLE_SPORTLOGIC': 'true',
            'SPORTLOGIC_PER_RUN_MAX': '40',
            'SPORTLOGIC_MAX_HTTP_REQUESTS_PER_RUN': '40',
            'SPORTLOGIC_REQUESTS_MAX_PER_RUN': '40',
            'SPORTLOGIC_REQUEST_BUDGET_GRANTED': '40',
            'SPORTLOGIC_ACTIVE_ODDS_SMOKE_PAGES': '2',
            'SPORTLOGIC_ACTIVE_ODDS_SMOKE_GAME_LIMIT': '40',
            'DAY_INVENTORY_ENABLE_SPORTLOGIC': 'true',
            'DAY_INVENTORY_SPORTLOGIC_MAX_REQUESTS': '40',
            'DAY_INVENTORY_BZZOIRO_MAX_REQUESTS': '200',
            'DAY_INVENTORY_SSTATS_MAX_REQUESTS': '150',
            'PUBLISH_MIN_ODDS_SOURCES': '1',
            'PUBLISH_MIN_CONTEXT_SOURCES': '2',
            'TOTALS_PUBLICATION_ENABLED': 'true',
            'SPREADS_PUBLICATION_ENABLED': 'true',
          }
          for key in sorted(raised):
              print(f'{key}={raised[key]}')
          PY

      - name: Run minimal API repair probe
        run: |
          set -uo pipefail
          echo "minimal api repair probe start $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          if timeout 120s python -u scripts/provider_api_min_repair_probe.py 2>&1 | tee .data/exports/provider-api-min-repair-probe-run.log; then
            echo "minimal api repair probe completed"
          else
            status=$?
            echo "minimal api repair probe failed or timed out with status ${status}; continuing diagnostics"
          fi

      - name: Build and normalize top-300 smoke inventory
        run: |
          set -uo pipefail
          echo "top-300 smoke inventory start $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          if timeout 270s python -u scripts/build_day_inventory.py 2>&1 | tee .data/exports/provider-smoke-build-day-inventory.log; then
            echo "top-300 smoke inventory build completed"
          else
            status=$?
            echo "top-300 smoke inventory build failed or timed out with status ${status}; continuing diagnostics"
          fi
          python -u scripts/repair_inventory_source_counts.py 2>&1 | tee .data/exports/provider-smoke-source-count-repair-run.log || true
          python -u scripts/project_day_inventory_context_sources.py 2>&1 | tee .data/exports/provider-smoke-context-source-projection-run.log || true
          cp .data/exports/latest-day-inventory-summary.json artifacts/provider-smoke/latest-day-inventory-summary.json 2>/dev/null || true
          cp .data/exports/latest-inventory-source-count-repair.json artifacts/provider-smoke/latest-inventory-source-count-repair.json 2>/dev/null || true
          cp .data/exports/latest-day-inventory-context-source-projection.json artifacts/provider-smoke/latest-day-inventory-context-source-projection.json 2>/dev/null || true
          cp .data/exports/latest-day-inventory-price-backfill-plan.* artifacts/provider-smoke/ 2>/dev/null || true
          cp .data/exports/latest-day-inventory-price-backfill-execution.* artifacts/provider-smoke/ 2>/dev/null || true
          cp .data/exports/provider-smoke-build-day-inventory.log artifacts/provider-smoke/provider-smoke-build-day-inventory.log 2>/dev/null || true
          cp .data/exports/provider-smoke-source-count-repair-run.log artifacts/provider-smoke/provider-smoke-source-count-repair-run.log 2>/dev/null || true
          cp .data/exports/provider-smoke-context-source-projection-run.log artifacts/provider-smoke/provider-smoke-context-source-projection-run.log 2>/dev/null || true
          cp -r .data/day_inventory artifacts/provider-smoke/day_inventory 2>/dev/null || true

      - name: Run provider endpoint and matching diagnostics
        env:
          API_FULL_SMOKE_ENABLED: "false"
          PROVIDER_SMOKE_REPEATS: "1"
          PROVIDER_SMOKE_MATCHING_PROVIDERS: "sstats,bzzoiro,sportlogic"
          BZZOIRO_PROVIDER_SMOKE_ENABLED: "true"
          ODDS_API_IO_PER_RUN_MAX: "100"
          ODDS_API_IO_ACCOUNT1_PER_RUN_MAX: "50"
          ODDS_API_IO_ACCOUNT2_PER_RUN_MAX: "50"
          MAX_MATCHES_FOR_ODDS_FETCH: "300"
          BZZOIRO_REQUEST_BUDGET_GRANTED: "200"
          SSTATS_REQUEST_BUDGET_GRANTED: "150"
          SSTATS_GAME_DETAIL_ENABLED: "true"
          SPORTLOGIC_ENABLED: "true"
          ENABLE_SPORTLOGIC: "true"
          SPORTLOGIC_REQUEST_BUDGET_GRANTED: "40"
          SPORTLOGIC_ACTIVE_ODDS_SMOKE_PAGES: "2"
          SPORTLOGIC_ACTIVE_ODDS_SMOKE_GAME_LIMIT: "40"
        run: |
          set -uo pipefail
          mkdir -p .data/exports artifacts/provider-smoke artifacts/provider-smoke-fast
          echo "provider diagnostics start $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          if timeout "$(( PROVIDER_SMOKE_FAST_MAX_SECONDS + 90 ))" python -u scripts/provider_smoke_fast.py \
            --providers "${PROVIDER_SMOKE_FAST_PROVIDERS}" \
            --max-seconds "${PROVIDER_SMOKE_FAST_MAX_SECONDS}" \
            --timeout "${PROVIDER_SMOKE_FAST_TIMEOUT}" \
            --concurrency "${PROVIDER_SMOKE_FAST_CONCURRENCY}" \
            --repeats "1" 2>&1 | tee .data/exports/provider-smoke-fast-run.log; then
            echo "provider diagnostics completed"
          else
            status=$?
            echo "provider diagnostics failed or timed out with status ${status}; continuing artifact collection"
          fi
          cp .data/exports/latest-provider-smoke-fast.json .data/exports/latest-provider-smoke.json 2>/dev/null || true
          cp .data/exports/latest-provider-smoke-fast.txt .data/exports/latest-provider-smoke.txt 2>/dev/null || true
          python -u scripts/repair_inventory_source_counts.py 2>&1 | tee .data/exports/provider-smoke-source-count-repair-after-diagnostics-run.log || true
          python -u scripts/project_day_inventory_context_sources.py 2>&1 | tee .data/exports/provider-smoke-context-source-projection-after-diagnostics-run.log || true

      - name: Collect provider smoke artifacts
        if: always()
        run: |
          set -uo pipefail
          mkdir -p artifacts/provider-smoke artifacts/provider-smoke-fast
          cp .data/exports/latest-provider-api-min-repair-probe.* artifacts/provider-smoke/ 2>/dev/null || true
          cp .data/exports/provider-api-min-repair-probe-run.log artifacts/provider-smoke/ 2>/dev/null || true
          cp .data/exports/latest-provider-smoke*.json artifacts/provider-smoke/ 2>/dev/null || true
          cp .data/exports/latest-provider-smoke*.txt artifacts/provider-smoke/ 2>/dev/null || true
          cp .data/exports/provider-smoke-fast-run.log artifacts/provider-smoke/ 2>/dev/null || true
          cp .data/exports/latest-day-inventory-summary.json artifacts/provider-smoke/ 2>/dev/null || true
          cp .data/exports/latest-day-inventory-cached-evidence-preserve-patch.json artifacts/provider-smoke/ 2>/dev/null || true
          cp .data/exports/latest-inventory-source-count-repair.json artifacts/provider-smoke/ 2>/dev/null || true
          cp .data/exports/latest-day-inventory-context-source-projection.json artifacts/provider-smoke/ 2>/dev/null || true
          cp .data/exports/latest-day-inventory-price-backfill-plan.* artifacts/provider-smoke/ 2>/dev/null || true
          cp .data/exports/latest-day-inventory-price-backfill-execution.* artifacts/provider-smoke/ 2>/dev/null || true
          cp .data/exports/provider-smoke-source-count-repair*.log artifacts/provider-smoke/ 2>/dev/null || true
          cp .data/exports/provider-smoke-context-source-projection*.log artifacts/provider-smoke/ 2>/dev/null || true
          cp .data/exports/provider-smoke-build-day-inventory.log artifacts/provider-smoke/ 2>/dev/null || true
          cp -r .data/day_inventory artifacts/provider-smoke/day_inventory 2>/dev/null || true
          cp -r .data/line_history artifacts/provider-smoke/line_history 2>/dev/null || true
          echo "----- cached evidence preserve patch -----"
          cat .data/exports/latest-day-inventory-cached-evidence-preserve-patch.json 2>/dev/null || true
          echo "----- minimal API repair probe -----"
          cat .data/exports/latest-provider-api-min-repair-probe.txt 2>/dev/null || true
          echo "----- source-count/top-300 inventory repair -----"
          cat .data/exports/latest-inventory-source-count-repair.json 2>/dev/null || true
          echo "----- context source projection -----"
          cat .data/exports/latest-day-inventory-context-source-projection.json 2>/dev/null || true
          echo "----- price backfill plan -----"
          cat .data/exports/latest-day-inventory-price-backfill-plan.txt 2>/dev/null || true
          echo "----- price backfill execution -----"
          cat .data/exports/latest-day-inventory-price-backfill-execution.txt 2>/dev/null || true
          echo "----- provider smoke diagnostics -----"
          cat .data/exports/latest-provider-smoke-diagnostics.txt 2>/dev/null || cat .data/exports/latest-provider-smoke.txt 2>/dev/null || true
          echo "----- top-300 day inventory summary -----"
          cat .data/exports/latest-day-inventory-summary.json 2>/dev/null || true

      - name: Save persisted day inventory
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            .data/day_inventory
            .data/line_history
          key: provider-smoke-day-inventory-${{ env.DAY_INVENTORY_CACHE_DATE }}-${{ github.run_id }}

      - name: Upload provider smoke artifact
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: provider-smoke-${{ github.run_id }}
          path: |
            artifacts/provider-smoke/**
            artifacts/provider-smoke-fast/**
            .data/exports/**
            .data/day_inventory/**
            .data/line_history/**
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7
